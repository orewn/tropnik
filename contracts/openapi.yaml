components:
  schemas:
    AccountActionToken:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
      minLength: 43
      maxLength: 43
      writeOnly: true
      description: 256 random bits encoded as canonical unpadded base64url. Sent only in email URL fragments and POST bodies, never in API responses or logs; only SHA-256 digests are stored.
    AccountMailInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque random token; not a JWT or user ID
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Error:
      description: Stable machine code with human-readable message; no internal SQL/errors
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  requestId:
                    type: string
