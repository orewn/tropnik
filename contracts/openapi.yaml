openapi: 3.1.0
info:
  title: TROPA API
  version: 0.4.32
  description: 'Server-authoritative guided hiking groups. Minimum four people includes the

    guide by default. No guide obtains verified status through self-registration.

    Offline observations are evidence awaiting reconciliation, not authorization.

    Production responses contain real database records only. The database initially

    contains region metadata, not fabricated trails, guides, reviews or departures.

    '
servers:
- url: /api/v1
security: []
x-tropnik-body-budgets:
  description: >-
    Browser, BFF, SSR and Android count decoded JSON stream bytes, independent
    of gzip and Content-Length. Larger response budgets apply only to successful
    responses for the exact method and path templates below. Query parameters
    do not change the path family. Oversize is an explicit failure, never silent
    truncation. MiB means 1048576 bytes. Request limits remain 1 MiB for every
    method, including mutations returning a larger response.
  requestBytes: 1048576
  defaultResponseBytes: 1048576
  errorResponseBytes: 1048576
  success:
  - method: GET
    paths: ['/routes/{id}']
    bytes: 8388608
    reason: Complete reviewed route geometry; route list pages retain the 1 MiB default.
  - method: GET
    paths: ['/departures/{id}/messages', '/recruitment-requests/{id}/messages']
    bytes: 4194304
    reason: Latest 100 messages, at most 4000 Unicode characters each; Go HTML escaping may require six bytes per character.
  - method: GET
    paths:
    - /departures/{id}/reviews
    - /guides/{id}/reviews
    - /recruitment-requests
    - /me/reports
    - /me/moderation-actions
    - /me/appeals
    - /me/notifications
    - /moderation/reports
    - /moderation/appeals
    bytes: 8388608
    reason: SQL-bounded latest-100 rich collections; combined report target text, reasons and names exceed 4 MiB after Go HTML escaping.
  - method: GET
    paths: ['/departures/{id}/emergency-card']
    bytes: 2097152
    reason: Up to 50 emergency exits and 50 control points with bounded names and descriptions.
  - method: GET
    paths: ['/departures/{id}/safety-passport']
    bytes: 16777216
    reason: Existing 8 MiB route metadata may contain long valid RFC3339 fractional strings; the passport adds private details.
  - method: POST
    paths:
    - /departures/{id}/safety-passport/prepare
    - /departures/{id}/mchs/submission
    - /departures/{id}/mchs/confirmation
    - /departures/{id}/mchs/start-contact
    - /departures/{id}/mchs/return-report
    bytes: 16777216
    reason: These five mutations return the same complete safety passport, including idempotent replay.
paths:
  /health/live:
    get:
      summary: Process liveness
      responses:
        '200':
          description: Process is serving requests
  /health/ready:
    get:
      summary: Database, schema and safety encryption readiness
      responses:
        '200':
          description: Database reachable, current schema initialized and 256-bit safety key configured
        '503':
          description: Database or schema unavailable, or safety encryption is not configured
  /regions:
    get:
      summary: Regions with real published route counts
      responses:
        '200':
          description: Envelope<Region[]>, see api.ts
  /guides:
    get:
      summary: Guides with active operator-reviewed qualifications and actual rating counts
      responses:
        '200':
          description: Envelope<Guide[]>; rating is null when reviewCount=0, no contacts returned
  /guides/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      summary: Public guide profile; eligibility for a particular route is still checked separately
      responses:
        '200':
          description: Envelope<Guide>
        '404':
          $ref: '#/components/responses/Error'
  /routes:
    get:
      summary: Published or closed routes with provenance; overview geometry has at most 1000 vertices
        and is not for navigation
      parameters:
      - name: region
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Envelope<Route[]>; at most 1 MiB decoded JSON. The page may be shorter than limit; follow meta.nextCursor until absent.
  /routes/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      summary: One public route and its current revision, geometryDetail=full
      responses:
        '200':
          description: Envelope<Route>; complete geometry with at most 100000 vertices, capped at 8 MiB decoded JSON. Oversized legacy records return an explicit error, never truncated geometry.
        '404':
          $ref: '#/components/responses/Error'
  /me/departures:
    get:
      summary: Private completed participation history for the current authenticated account
      description: No user ID parameter is accepted. Completion time and departure ID form a stable descending cursor. Withdrawn public routes remain in the participant history with the pinned route revision. No roster or private contacts are returned. Hidden reviews still prevent duplicate submission to their target.
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 256
        description: Opaque position from meta.nextCursor, not authorization or an account selector
      responses:
        '200':
          description: Envelope<CompletedDeparture[]>; meta.nextCursor continues older records when present
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /departures:
    get:
      summary: Upcoming departures; no member names or private contacts
      parameters:
      - name: route
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Envelope<Departure[]>
    post:
      summary: Verified eligible guide creates a departure within the reviewed route group policy
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - routeId
              - startsAt
              - endsAt
              - timeZone
              properties:
                routeId:
                  type: string
                routeRevisionId:
                  type: string
                  description: Optional stale-card guard; conflicts if current revision changed
                startsAt:
                  type: string
                  format: date-time
                endsAt:
                  type: string
                  format: date-time
                timeZone:
                  type: string
                  example: Europe/Moscow
                minPeople:
                  type: integer
                  minimum: 4
                  default: 4
                  description: Includes guide; must be at least the reviewed route minPeople
                capacity:
                  type: integer
                  minimum: 4
                  maximum: 50
                  default: 8
                  description: Includes guide; cannot exceed the reviewed route maxGroupSize
      responses:
        '201':
          description: Envelope<Departure>
        '403':
          $ref: '#/components/responses/Error'
  /departures/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      summary: Public departure status; membership when authenticated
      responses:
        '200':
          description: Envelope<Departure>
        '404':
          $ref: '#/components/responses/Error'
  /departures/{id}/join:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Atomically take one place; the assigned guide counts once
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Envelope<Departure>; safe replay does not consume a second place
        '409':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /departures/{id}/leave:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Cancel participation before start; withdrawing guide removes readiness
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Envelope<Departure>
        '409':
          $ref: '#/components/responses/Error'
  /departures/{id}/participants:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      summary: Roster for assigned guide only, without contacts or cancelled participants
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 'Envelope<Participant[]>: userId, displayName, role, status'
        '403':
          $ref: '#/components/responses/Error'
  /departures/{id}/check-in:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Assigned eligible guide records physical attendance or absence online
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - userId
              - expectedVersion
              properties:
                userId:
                  type: string
                expectedVersion:
                  type: integer
                present:
                  type: boolean
                  default: true
                  description: Set false to mark a participant absent before start; this invalidates a prepared safety manifest. The guide cannot mark themselves absent.
      responses:
        '200':
          description: Envelope<Departure>
  /departures/{id}/transition:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Guide starts, completes, cancels or aborts; start rechecks all gates
      description: A required safety policy additionally needs the current independently confirmed passport, a fresh predeparture contact and attendance for every registered active participant. Expired contact returns 409 departure_not_ready.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              - expectedVersion
              properties:
                action:
                  type: string
                  enum:
                  - start
                  - complete
                  - cancel
                  - abort
                expectedVersion:
                  type: integer
      responses:
        '200':
          description: Envelope<Departure>
        '409':
          $ref: '#/components/responses/Error'
  /departures/{id}/safety-passport:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      summary: Read the current versioned safety passport
      description: Assigned guide, active/completed participant or staff only. Participants receive only the public
        payload; private details are restricted to the assigned guide and staff. A not-yet-prepared passport has version
        0 and no public/private payload.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Envelope<SafetyPassport>
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SafetyPassport'
                  meta:
                    type: object
        '401': &id001
          $ref: '#/components/responses/Error'
        '403': *id001
        '404': *id001
        '429': *id001
        '503': *id001
  /departures/{id}/safety-passport/prepare:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Assigned guide prepares a new encrypted passport version
      description: Before trip start and end only. The exact active roster and pinned route revision are snapshotted;
        earlier submission/confirmation/contact state is cleared. Retries with the same key and input create no duplicate
        version and return the currently authorized passport view. Missing encryption configuration returns 503 without
        storing plaintext.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SafetyPrepareInput'
      responses:
        '201':
          description: Envelope<SafetyPassport>
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SafetyPassport'
                  meta:
                    type: object
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '503': *id001
  /departures/{id}/mchs/submission:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Record an external MChS submission reference
      description: Assigned guide only. Current passport must be ready_to_submit and require or recommend notification.
        submittedAt must not precede the latest safety change or exceed server time by five minutes. Only records
        submitted_unverified; opening the official form never confirms submission.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCHSSubmissionInput'
      responses:
        '200':
          description: Envelope<SafetyPassport>
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SafetyPassport'
                  meta:
                    type: object
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '503': *id001
  /departures/{id}/mchs/confirmation:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Independent staff member verifies external registration evidence
      description: Moderator/admin only; the assigned guide and any active participant cannot approve their own trip,
        even with staff privileges. Current version must be submitted_unverified. Stores evidence reference and enters
        start_contact_pending. This endpoint does not contact a government API.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCHSConfirmationInput'
      responses:
        '200':
          description: Envelope<SafetyPassport>
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SafetyPassport'
                  meta:
                    type: object
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '503': *id001
  /departures/{id}/mchs/start-contact:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Assigned guide records or renews the completed predeparture contact
      description: Current version must be start_contact_pending or confirmed before start. contactedAt must be within
        the last 24 hours, no earlier than 24 hours before scheduled start, before scheduled end, and no more than
        five minutes ahead of server time. A delayed departure needs a fresh contact after the previous one expires.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCHSStartContactInput'
      responses:
        '200':
          description: Envelope<SafetyPassport>
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SafetyPassport'
                  meta:
                    type: object
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '503': *id001
  /departures/{id}/mchs/return-report:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Assigned guide records the actual return notification
      description: Current passport must be return_report_pending and the trip completed or aborted. reportedAt cannot
        precede scheduled start or exceed server time by five minutes. Records method/time and closes the safety workflow;
        does not submit a message to emergency services.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCHSReturnReportInput'
      responses:
        '200':
          description: Envelope<SafetyPassport>
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SafetyPassport'
                  meta:
                    type: object
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '503': *id001
  /departures/{id}/safety-check-ins:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Assigned guide appends a field safety observation
      description: Available only during an active trip. Stores observedAt separately from serverReceivedAt; retries
        with the same key/input return the original observation without duplication. Does not change the authoritative
        roster or authorize a trip start.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SafetyCheckInInput'
      responses:
        '201':
          description: Envelope<SafetyCheckIn>
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SafetyCheckIn'
                  meta:
                    type: object
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
        '503': *id001
  /departures/{id}/emergency-card:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      summary: Read the participant emergency card
      description: Assigned guide, active/completed participant or staff only. Includes 112, route/date information
        and leader/emergency contact details from the latest encrypted passport. Other participants' contacts are
        excluded. This response is private and must not enter shared caches.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Envelope<EmergencyCard>
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/EmergencyCard'
                  meta:
                    type: object
        '401': *id001
        '403': *id001
        '404': *id001
        '429': *id001
        '503': *id001
  /departures/{id}/messages:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      summary: Private messages; active or completed participants only
      security:
      - bearerAuth: []
      parameters:
      - name: after
        in: query
        schema:
          type: string
          format: date-time
      - name: cursor
        in: query
        schema:
          type: string
        description: Use meta.nextCursor to avoid gaps between equal timestamps
      responses:
        '200':
          description: Envelope<Message[]>; initial latest 100 ascending, meta.nextCursor retrieves newer
            messages. No fake delivery acknowledgement.; hidden messages have visibility=hidden and empty
            body. Refresh latest-100 snapshots to receive moderation changes.
        '403':
          $ref: '#/components/responses/Error'
    post:
      summary: Send a plain-text message; clientId prevents duplicates
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - body
              - clientId
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 4000
                clientId:
                  type: string
                  minLength: 16
                  maxLength: 128
      responses:
        '201':
          description: Envelope<Message>
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /departures/{id}/reviews:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      summary: Reviews derived from completed participant records
      responses:
        '200':
          description: Envelope<Review[]>
    post:
      summary: One review per participant, departure and target
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - target
              - rating
              - body
              properties:
                target:
                  type: string
                  enum:
                  - guide
                  - route
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                body:
                  type: string
                  minLength: 1
                  maxLength: 3000
      responses:
        '201':
          description: Envelope<Review>
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/register:
    post:
      summary: Create a real account; guide applications remain pending
      description: Registration requires a configured TLS mail transport and bounded queue capacity. Success retains the session envelope and emailVerified=false; verification mail is requested asynchronously, not guaranteed delivered. Missing configuration returns 503 before account creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              - displayName
              - role
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                  writeOnly: true
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 80
                role:
                  type: string
                  enum:
                  - tourist
                  - guide
      responses:
        '201':
          description: Envelope<{token,expiresAt,user}>; token returned once, hash stored in DB
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /auth/email/request:
    post:
      summary: Request an email verification link without revealing account existence
      description: Same 202 response for unknown, already verified, disabled, staff and per-address limited accounts. Shared IP limits can return 429. Mail is attempted asynchronously; a process restart can lose queued work. At most three verification or recovery requests per address in fifteen minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountMailInput'
      responses:
        '202':
          description: Envelope<AccountMailResponse>; status=accepted and a uniform message; no token or user identifier
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /auth/email/confirm:
    post:
      summary: Consume a single-use verification token, valid for at most 24 hours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  $ref: '#/components/schemas/AccountActionToken'
      responses:
        '200':
          description: Envelope with status=verified. No session is created.
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/password/request:
    post:
      summary: Request a password reset without revealing account existence
      description: Same asynchronous response and address/IP limits as email verification requests. Staff accounts use operator-managed recovery. A new link replaces the previous link of the same purpose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountMailInput'
      responses:
        '202':
          description: Envelope<AccountMailResponse>; status=accepted and a uniform message, not delivery confirmation
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /auth/password/reset:
    post:
      summary: Consume a 30-minute single-use token and revoke every existing session
      description: Token consumption, password replacement and revocation of all sessions and outstanding action links commit atomically. Concurrent login cannot create a session with credentials verified before the reset. No automatic login. The web BFF clears its session cookie on success. Password-change notification is attempted asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password, passwordConfirmation]
              properties:
                token:
                  $ref: '#/components/schemas/AccountActionToken'
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                  writeOnly: true
                passwordConfirmation:
                  type: string
                  minLength: 12
                  maxLength: 128
                  writeOnly: true
      responses:
        '200':
          description: Envelope with status=password_changed and a sign-in-again message
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /me/delete:
    post:
      summary: Reauthenticate and permanently close the current account
      description: Requires the current password and explicit confirmation. Active participation, guide assignments and owned open recruitment requests block deletion. Staff accounts require operator deprovisioning. A transaction replaces email, display name and password, disables the account and revokes every session and action token. Completed participation, user-generated text, qualification evidence and audit remain with an anonymised profile. This is not a promise of erasing all personal data from retained content or backups.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, confirmation]
              properties:
                password:
                  type: string
                  maxLength: 128
                  writeOnly: true
                confirmation:
                  type: string
                  const: delete
      responses:
        '204':
          description: Account closed. The web BFF clears its session cookie.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      summary: Email/password session; generic failure and request limits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                password:
                  type: string
                  writeOnly: true
      responses:
        '200':
          description: Envelope<{token,expiresAt,user}>
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Session revoked
  /me:
    get:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Envelope<User>
        '401':
          $ref: '#/components/responses/Error'
  /me/profile:
    patch:
      summary: Change display name or request guide review; cannot self-verify
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - displayName
              properties:
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 80
                role:
                  type: string
                  enum:
                  - tourist
                  - guide
      responses:
        '200':
          description: Envelope<User>
  /sync/observations:
    post:
      summary: Record offline field observations; never implicitly authorize a start
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - observations
              properties:
                observations:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required:
                    - clientId
                    - departureId
                    - baseVersion
                    - observedAt
                    - kind
                    - body
                    properties:
                      clientId:
                        type: string
                        minLength: 16
                        maxLength: 128
                      departureId:
                        type: string
                      baseVersion:
                        type: integer
                        minimum: 1
                      observedAt:
                        type: string
                        format: date-time
                      kind:
                        type: string
                        enum:
                        - field_note
                        - check_in_observation
                      body:
                        type: string
                        minLength: 1
                        maxLength: 4000
      responses:
        '200':
          description: Envelope<SyncAck[]>; every item has serverAuthorized=false
  /recruitment-requests:
    get:
      summary: Open interests and accepted requests, separate from confirmed hikes
      security:
      - bearerAuth: []
      parameters:
      - name: route
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Envelope<RecruitmentRequest[]>, see api.ts
    post:
      summary: Tourist creates an interest group and becomes a member of its chat
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - routeId
              - body
              properties:
                routeId:
                  type: string
                preferredDate:
                  type: string
                  format: date
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '201':
          description: Envelope<RecruitmentRequest>; no departure permission issued
        '429':
          $ref: '#/components/responses/Error'
  /recruitment-requests/{id}/join:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Envelope<{interested:true,confirmedParticipant:false}>
  /recruitment-requests/{id}/leave:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Leave interest chat; owner cancels an open request
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Interest cancelled; actual departure membership is separate
  /recruitment-requests/{id}/accept:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Eligible guide atomically accepts and creates a dated departure
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - startsAt
              - endsAt
              - timeZone
              properties:
                routeRevisionId:
                  type: string
                startsAt:
                  type: string
                  format: date-time
                endsAt:
                  type: string
                  format: date-time
                timeZone:
                  type: string
                minPeople:
                  type: integer
                  minimum: 4
                  default: 4
                capacity:
                  type: integer
                  minimum: 4
                  maximum: 50
                  default: 8
      responses:
        '201':
          description: Envelope<Departure>; tourists are NOT silently booked
        '403':
          $ref: '#/components/responses/Error'
  /recruitment-requests/{id}/messages:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Envelope<RecruitmentMessage[]>; latest 100 plain-text messages, ascending; hidden
            messages have visibility=hidden and empty body. Refresh latest-100 snapshots to receive moderation
            changes.
    post:
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - body
              - clientId
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 4000
                clientId:
                  type: string
                  minLength: 16
                  maxLength: 128
      responses:
        '201':
          description: Envelope<RecruitmentMessage>
        '429':
          $ref: '#/components/responses/Error'
  /guides/{id}/reviews:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      summary: Latest 100 public non-hidden guide reviews; hidden reviews do not contribute to rating
      responses:
        '200':
          description: Envelope<Review[]>
        '404':
          $ref: '#/components/responses/Error'
  /me/summary:
    get:
      summary: Own profile, actual completion counts, badges with evidence IDs and current mute expiry
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Envelope<AccountSummary>; exact fields in api.ts
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /me/notifications:
    get:
      summary: Latest 100 stored notifications for this account; no push delivery is implied
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Envelope<Notification[]>; exact fields in api.ts
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /me/notifications/{id}/read:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Mark an owned notification as read
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Read status persisted
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /reports:
    post:
      summary: Report another user’s material; private-message reports require current membership
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - targetType
              - targetId
              - reason
              - body
              properties:
                targetType:
                  type: string
                  enum:
                  - message
                  - recruitment_message
                  - review
                targetId:
                  type: string
                reason:
                  type: string
                  enum:
                  - spam
                  - harassment
                  - dangerous_information
                  - personal_data
                  - other
                body:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        '201':
          description: Envelope<Report>; exact fields in api.ts
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /me/reports:
    get:
      summary: Own reports and decisions, latest 100
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Envelope<Report[]>; exact fields in api.ts
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /me/moderation-actions:
    get:
      summary: Decisions affecting this account; expiresAt ends only the mute component
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Envelope<ModerationAction[]>; exact fields in api.ts
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /me/appeals:
    get:
      summary: Own appeal history, latest 100
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Envelope<Appeal[]>; exact fields in api.ts
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /moderation-actions/{id}/appeals:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Subject requests independent review; an active mute does not block appeals
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - body
              properties:
                body:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        '201':
          description: Envelope<Appeal>; exact fields in api.ts
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /moderation/reports:
    get:
      summary: Eligible staff case queue excluding conflicts of interest; case IDs are audited
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - open
          - resolved
          - dismissed
          default: open
      responses:
        '200':
          description: Envelope<ModerationReport[]>; exact fields in api.ts
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /moderation/reports/{id}/resolve:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: Staff resolves a case; no self-sanction or deciding one’s own report
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - action
              - reason
              properties:
                action:
                  type: string
                  enum:
                  - dismiss
                  - hide
                  - mute
                  - hide_and_mute
                reason:
                  type: string
                  minLength: 10
                  maxLength: 2000
                muteHours:
                  type: integer
                  minimum: 1
                  maximum: 168
                  description: Required only for mute or hide_and_mute
      responses:
        '200':
          description: Envelope<Report>; exact fields in api.ts
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /moderation/appeals:
    get:
      summary: Independent staff appeal queue excluding subject, original reporter and moderator
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - open
          - upheld
          - overturned
          default: open
      responses:
        '200':
          description: Envelope<ModerationAppeal[]>; exact fields in api.ts
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /moderation/appeals/{id}/resolve:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      summary: A different staff member upholds or overturns a decision; other active decisions remain
        effective
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - decision
              - reason
              properties:
                decision:
                  type: string
                  enum:
                  - upheld
                  - overturned
                reason:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        '200':
          description: Envelope<Appeal>; exact fields in api.ts
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
components:
  schemas:
    AccountActionToken:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
      minLength: 43
      maxLength: 43
      writeOnly: true
      description: 256 random bits encoded as canonical unpadded base64url. Sent only in email URL fragments and POST bodies, never in API responses or logs; only SHA-256 digests are stored.
    AccountMailInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    MCHSNotificationPolicy:
      type: string
      enum:
      - not_required
      - recommended
      - required
    MCHSStatus:
      type: string
      enum:
      - not_required
      - recommended
      - required
      - preparing
      - ready_to_submit
      - submitted_unverified
      - start_contact_pending
      - confirmed
      - amendment_required
      - active
      - return_report_pending
      - closed
      - rejected
      - cancelled
      description: Platform state of external evidence. No state represents a response from an MChS API or a rescue
        guarantee.
    SafetyPhone:
      type: string
      minLength: 7
      maxLength: 25
      pattern: ^[+0-9][0-9 ()-]{6,24}$
      description: Trimmed phone number containing 7 to 15 ASCII digits.
    SafetyPoint:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 240
        description:
          type: string
          maxLength: 2000
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      description: Coordinates, when supplied, must form a complete finite WGS84 pair.
    SafetyCheckInRule:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 240
        offsetHour:
          type: integer
          minimum: 0
          maximum: 720
        at:
          type: string
          format: date-time
    RouteSafetyMetadata:
      type: object
      additionalProperties: false
      required: []
      properties:
        riskClass:
          type: string
          enum:
          - standard
          - elevated
          - high
          - extreme
        routeType:
          type: string
          enum:
          - pedestrian
          - mountain
          - water
          - ski
          - speleo
          - combined
        legalDifficultyCategory:
          type: string
          minLength: 1
          maxLength: 40
        mchsNotificationPolicy:
          $ref: '#/components/schemas/MCHSNotificationPolicy'
        mchsTerritorialUnitId:
          type: string
          maxLength: 120
        emergencyExits:
          type: array
          items:
            $ref: '#/components/schemas/SafetyPoint'
          maxItems: 50
        controlPoints:
          type: array
          items:
            $ref: '#/components/schemas/SafetyPoint'
          maxItems: 50
        defaultCheckInSchedule:
          type: array
          items:
            $ref: '#/components/schemas/SafetyCheckInRule'
          maxItems: 50
        safetyRevision:
          type: integer
          minimum: 1
      description: Safety fields included in Route responses and pinned into each reviewed route revision.
    DepartureSafetyState:
      type: object
      additionalProperties: false
      required:
      - safetyStatus
      - safetyPassportVersion
      - mchsNotificationPolicy
      - mchsConfirmed
      - startContactConfirmed
      - returnReported
      - safetyClosed
      properties:
        safetyStatus:
          $ref: '#/components/schemas/MCHSStatus'
        safetyPassportVersion:
          type: integer
          minimum: 0
        mchsNotificationPolicy:
          $ref: '#/components/schemas/MCHSNotificationPolicy'
        mchsSubmissionId:
          type: string
        mchsConfirmed:
          type: boolean
        startContactConfirmed:
          type: boolean
          description: Before start, true only while the confirmed contact remains valid within the current 24-hour
            window. Active/completed/aborted trips retain the historical confirmation.
        returnReported:
          type: boolean
        safetyClosed:
          type: boolean
      description: Safety fields present in Departure responses. Stale contacts and roster amendments cannot authorize
        a required start.
    SafetyParticipantContact:
      type: object
      additionalProperties: false
      required:
      - userId
      - phone
      properties:
        userId:
          type: string
          minLength: 1
        displayName:
          type: string
        role:
          type: string
          enum:
          - tourist
          - guide
        phone:
          $ref: '#/components/schemas/SafetyPhone'
      description: Private contact. Participant ID must match the current roster; displayName and role are read from
        the server and ignore client claims.
    SafetyRouteSnapshot:
      type: object
      additionalProperties: false
      required:
      - routeId
      - routeRevisionId
      - title
      - description
      - riskClass
      - routeType
      - legalDifficultyCategory
      - emergencyExits
      - controlPoints
      - defaultCheckInSchedule
      - safetyRevision
      properties:
        routeId:
          type: string
        routeRevisionId:
          type: string
        title:
          type: string
        description:
          type: string
        riskClass:
          type: string
        routeType:
          type: string
        legalDifficultyCategory:
          type: string
        territorialUnitId:
          type: string
        emergencyExits:
          type: array
          items:
            $ref: '#/components/schemas/SafetyPoint'
        controlPoints:
          type: array
          items:
            $ref: '#/components/schemas/SafetyPoint'
        defaultCheckInSchedule:
          type: array
          items:
            $ref: '#/components/schemas/SafetyCheckInRule'
        safetyRevision:
          type: integer
          minimum: 1
    SafetyPublicPayload:
      type: object
      additionalProperties: false
      required:
      - route
      - startsAt
      - endsAt
      - timeZone
      - leaderName
      - participantCount
      - preparedAt
      properties:
        route:
          $ref: '#/components/schemas/SafetyRouteSnapshot'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        timeZone:
          type: string
        leaderName:
          type: string
        participantCount:
          type: integer
          minimum: 1
          maximum: 50
        preparedAt:
          type: string
          format: date-time
    SafetyPrivateDetails:
      type: object
      additionalProperties: false
      required:
      - leaderPhone
      - emergencyContactName
      - emergencyContactPhone
      - communicationPlan
      - transport
      - backupRoute
      - equipment
      - firstAid
      - insurance
      - notes
      - participants
      properties:
        leaderPhone:
          $ref: '#/components/schemas/SafetyPhone'
        emergencyContactName:
          type: string
          minLength: 2
          maxLength: 120
        emergencyContactPhone:
          $ref: '#/components/schemas/SafetyPhone'
        communicationPlan:
          type: string
          minLength: 1
          maxLength: 2000
        transport:
          type: string
          minLength: 1
          maxLength: 2000
        backupRoute:
          type: string
          minLength: 1
          maxLength: 2000
        equipment:
          type: string
          minLength: 1
          maxLength: 2000
        firstAid:
          type: string
          minLength: 1
          maxLength: 2000
        insurance:
          type: string
          minLength: 1
          maxLength: 2000
        notes:
          type: string
          maxLength: 4000
        participants:
          type: array
          items:
            $ref: '#/components/schemas/SafetyParticipantContact'
          minItems: 1
          maxItems: 50
      description: Decrypted private data available only to the assigned guide and platform staff. Never returned in
        a participant passport or public departure response.
    SafetyPrepareInput:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - leaderPhone
      - emergencyContactName
      - emergencyContactPhone
      - communicationPlan
      - transport
      - backupRoute
      - equipment
      - firstAid
      - insurance
      - participants
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        leaderPhone:
          $ref: '#/components/schemas/SafetyPhone'
        emergencyContactName:
          type: string
          minLength: 2
          maxLength: 120
        emergencyContactPhone:
          $ref: '#/components/schemas/SafetyPhone'
        communicationPlan:
          type: string
          minLength: 1
          maxLength: 2000
        transport:
          type: string
          minLength: 1
          maxLength: 2000
        backupRoute:
          type: string
          minLength: 1
          maxLength: 2000
        equipment:
          type: string
          minLength: 1
          maxLength: 2000
        firstAid:
          type: string
          minLength: 1
          maxLength: 2000
        insurance:
          type: string
          minLength: 1
          maxLength: 2000
        notes:
          type: string
          maxLength: 4000
        participants:
          type: array
          items:
            $ref: '#/components/schemas/SafetyParticipantContact'
          minItems: 1
          maxItems: 50
      description: Creates the next immutable encrypted passport version. expectedVersion must match the current version
        (0 for the first passport); participants must exactly match the current active roster with unique userIds.
    SafetyPassport:
      type: object
      additionalProperties: false
      required:
      - departureId
      - version
      - status
      - notificationPolicy
      - officialFormUrl
      properties:
        departureId:
          type: string
        version:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/MCHSStatus'
        notificationPolicy:
          $ref: '#/components/schemas/MCHSNotificationPolicy'
        officialFormUrl:
          type: string
          format: uri
        submissionId:
          type: string
        submittedAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
        startContactConfirmedAt:
          type: string
          format: date-time
        returnReportedAt:
          type: string
          format: date-time
        passportHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        manifestHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        public:
          $ref: '#/components/schemas/SafetyPublicPayload'
        private:
          $ref: '#/components/schemas/SafetyPrivateDetails'
    MCHSSubmissionInput:
      type: object
      additionalProperties: false
      required:
      - passportVersion
      - submissionId
      - submittedAt
      properties:
        passportVersion:
          type: integer
          minimum: 1
        submissionId:
          type: string
          minLength: 3
          maxLength: 160
        submittedAt:
          type: string
          format: date-time
    MCHSConfirmationInput:
      type: object
      additionalProperties: false
      required:
      - passportVersion
      - confirmationRef
      properties:
        passportVersion:
          type: integer
          minimum: 1
        confirmationRef:
          type: string
          minLength: 3
          maxLength: 240
        confirmationSha256:
          type: string
          pattern: ^([0-9a-fA-F]{64})?$
          description: Optional SHA-256 of the reviewed external evidence.
    MCHSStartContactInput:
      type: object
      additionalProperties: false
      required:
      - passportVersion
      - contactedAt
      properties:
        passportVersion:
          type: integer
          minimum: 1
        contactedAt:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 1000
    MCHSReturnReportInput:
      type: object
      additionalProperties: false
      required:
      - passportVersion
      - reportedAt
      - method
      properties:
        passportVersion:
          type: integer
          minimum: 1
        reportedAt:
          type: string
          format: date-time
        method:
          type: string
          minLength: 2
          maxLength: 120
        note:
          type: string
          maxLength: 1000
    SafetyCheckInInput:
      type: object
      additionalProperties: false
      required:
      - kind
      - observedAt
      properties:
        kind:
          type: string
          enum:
          - start
          - control_point
          - return
          - incident
        observedAt:
          type: string
          format: date-time
        latitude:
          type:
          - number
          - 'null'
          minimum: -90
          maximum: 90
        longitude:
          type:
          - number
          - 'null'
          minimum: -180
          maximum: 180
        note:
          type: string
          maxLength: 1000
      description: Assigned guide only while the trip is in progress. Coordinates must both be finite WGS84 values or
        both absent/null. observedAt cannot precede the scheduled start or be more than five minutes in the future.
        Recording an incident does not call emergency services.
    SafetyCheckIn:
      type: object
      additionalProperties: false
      required:
      - id
      - departureId
      - actorId
      - kind
      - observedAt
      - serverReceivedAt
      properties:
        id:
          type: string
        departureId:
          type: string
        actorId:
          type: string
        kind:
          type: string
          enum:
          - start
          - control_point
          - return
          - incident
        observedAt:
          type: string
          format: date-time
        latitude:
          type:
          - number
          - 'null'
          minimum: -90
          maximum: 90
        longitude:
          type:
          - number
          - 'null'
          minimum: -180
          maximum: 180
        note:
          type: string
          maxLength: 1000
        serverReceivedAt:
          type: string
          format: date-time
    EmergencyCard:
      type: object
      additionalProperties: false
      required:
      - departureId
      - emergencyNumber
      - routeTitle
      - startsAt
      - endsAt
      - timeZone
      - leaderName
      - mchsStatus
      - controlPoints
      - emergencyExits
      - messageTemplate
      properties:
        departureId:
          type: string
        emergencyNumber:
          type: string
          const: '112'
        routeTitle:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        timeZone:
          type: string
        leaderName:
          type: string
        leaderPhone:
          type: string
        emergencyContactName:
          type: string
        emergencyContactPhone:
          type: string
        mchsStatus:
          $ref: '#/components/schemas/MCHSStatus'
        mchsSubmissionId:
          type: string
        territorialUnitId:
          type: string
        controlPoints:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SafetyPoint'
        emergencyExits:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SafetyPoint'
        messageTemplate:
          type: string
      description: Private card for the assigned guide, active/completed participants and staff. Exposes leader/emergency
        contacts, never other participants' contacts. Before a passport is prepared, contact fields are omitted and
        safety-point arrays may be null. An already saved offline copy cannot be remotely revoked while disconnected.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque random token; not a JWT or user ID
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Error:
      description: Stable machine code with human-readable message; no internal SQL/errors
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  requestId:
                    type: string
