name: tropa
services:
  db:
    extends:
      file: compose.database.yaml
      service: postgis
    environment:
      POSTGRES_DB: tropa
      POSTGRES_USER: tropa_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a unique owner password}
      TROPA_APP_PASSWORD: ${TROPA_APP_PASSWORD:?Generate a separate API password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/01-runtime-role.sh:/docker-entrypoint-initdb.d/01-runtime-role.sh:ro
    healthcheck:
      # The image starts a socket-only server while initialization scripts run.
      # Wait for the final TCP listener before migrations use the runtime role.
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U tropa_owner -d tropa"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]
  migrate:
    build: ../backend
    image: tropa-api:local
    entrypoint: [/tropa-migrate]
    environment:
      DATABASE_URL: postgres://tropa_owner:${POSTGRES_PASSWORD:?Required}@db:5432/tropa?sslmode=disable
      RUNTIME_DB_ROLE: tropa_app
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]
    restart: "no"
  api:
    build: ../backend
    image: tropa-api:local
    environment:
      APP_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the HTTPS website origin}
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://tropa_app:${TROPA_APP_PASSWORD:?Required}@db:5432/tropa?sslmode=disable
      TRUST_PRIVATE_DATABASE_NETWORK: "true"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      TROPA_PROXY_TOKEN: ${TROPA_PROXY_TOKEN:-}
      TROPA_AUTH_RATE_KEY: ${TROPA_AUTH_RATE_KEY:?Generate a stable independent auth HMAC key}
      TROPA_SAFETY_DATA_KEY: ${TROPA_SAFETY_DATA_KEY:?Generate and back up an independent safety encryption key}
      TROPA_ACCOUNT_MAIL_KEY: ${TROPA_ACCOUNT_MAIL_KEY:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, /tropa-health]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks: [backend, application]
  # Docker cannot publish ports from an internal-only network. This fixed
  # upstream HTTP hop owns the loopback bindings; API and DB keep no egress.
  ingress:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    platform: linux/amd64
    user: "65532:65532"
    environment:
      XDG_CONFIG_HOME: /tmp/caddy-config
      XDG_DATA_HOME: /tmp/caddy-data
    volumes:
      - ./ingress/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./ingress/api.caddy:/etc/caddy/listeners/api.caddy:ro
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:size=16m,uid=65532,gid=65532,mode=0700
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, curl, --noproxy, "*", --fail, --silent, --show-error, --max-time, "2", http://127.0.0.1:8080/api/v1/health/ready]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks: [application, frontend]
networks:
  backend:
    internal: true
  application:
    internal: true
  frontend: {}
volumes:
  postgres-data:
