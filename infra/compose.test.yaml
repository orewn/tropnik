services:
  db:
    extends:
      file: compose.database.yaml
      service: postgis
    environment:
      POSTGRES_DB: tropa_test
      POSTGRES_USER: tropa_test
      POSTGRES_PASSWORD: ${TROPA_TEST_PASSWORD:?Generated by run-integration.sh}
    ports: ["127.0.0.1::5432"]
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      # A socket-only init server is not ready for the host-side Go connection.
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U tropa_test -d tropa_test"]
      interval: 2s
      timeout: 3s
      retries: 30
