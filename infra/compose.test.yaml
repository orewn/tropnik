services:
  db:
    image: postgis/postgis:18-3.7
    platform: linux/amd64
    environment:
      POSTGRES_DB: tropa_test
      POSTGRES_USER: tropa_test
      POSTGRES_PASSWORD: ${TROPA_TEST_PASSWORD:?Generated by run-integration.sh}
    ports: ["127.0.0.1::5432"]
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tropa_test -d tropa_test"]
      interval: 2s
      timeout: 3s
      retries: 30
