# No production volumes, host ports, outbound network or host credential mounts.
# This stack is created and removed by the restore drill scripts only.
services:
  db:
    image: postgis/postgis:18-3.7
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${TROPA_DRILL_DATABASE:-postgres}
      POSTGRES_USER: tropa_drill
      POSTGRES_PASSWORD: ${TROPA_DRILL_PASSWORD:?Generated by the recovery drill}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    tmpfs:
      - /var/lib/postgresql:size=2147483648
    shm_size: 256mb
    mem_limit: 2g
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    logging:
      driver: none
    labels:
      io.tropnik.recovery-purpose: ${TROPA_DRILL_PURPOSE:-restore}
    healthcheck:
      # The init-time server listens only on a Unix socket. Wait for the final
      # TCP listener so migrations cannot race the image's extension setup.
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U tropa_drill -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    # docker exec supplies stdin/stdout directly; no inter-container network is
    # needed. Unlike an internal bridge, none also excludes host bridge services.
    network_mode: none
