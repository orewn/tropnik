# Copied Sites are standalone projects and cannot inherit the monorepo policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: .sites-runtime/pnpm-store
cacheDir: .sites-runtime/pnpm-store/policy-cache
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  miniflare>sharp: 0.35.5
  # Patched transitive versions within the existing major lines.
  '@babel/core@<7.29.6': 7.29.6
  'browserslist@<4.28.7': 4.28.7
  'baseline-browser-mapping@<2.11.0': 2.11.0
  'source-map-js@<1.2.2': 1.2.2
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'image-size@>=2.0.0 <2.0.3': 2.0.3
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'fflate@>=0.7.0 <0.7.5': 0.7.5
  'esbuild@>=0.28.0 <0.28.1': 0.28.1
  # Scoped compatibility checks cover the actual Wrangler bundler, Drizzle TS
  # loader, SVG/PNG renderer and TypeScript ESLint glob consumer in this project.
  # GHSA-g7r4-m6w7-qqqr / GHSA-67mh-4wv8-2f99
  wrangler>esbuild: 0.28.1
  '@esbuild-kit/core-utils>esbuild': 0.28.1
  # GHSA-wx4j-mvgx-mqwp / GHSA-g3hv-75wg-m249
  # @vercel/og bundles Satori: overriding only its declared dependency leaves
  # the old renderer in the shipped bundle. Upgrade the actual consumer too.
  'vinext>@vercel/og': 1.0.3
  '@typescript-eslint/typescript-estree>minimatch': 11.0.1
  # The hooks plugin explicitly supports either Zod 3 or 4; retain the patched branch.
  eslint-plugin-react-hooks>zod: 4.6.6
# The fixed OG bundle needs HarfBuzz's declared binary at its own boundary.
# This is the same pinned version already used by Satori, not a second engine.
packageExtensions:
  '@vercel/og@1.0.3':
    dependencies:
      harfbuzzjs: 0.10.0
patchedDependencies:
  '@vercel/og@1.0.3': patches/@vercel__og@1.0.3.patch
