name: Actual map loading baseline diagnosis

on:
  push:
    branches: [verify/map-loading-20261113]

permissions:
  contents: read

concurrency:
  group: map-loading-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    if: github.repository == 'orewn/tropnik'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Require unchanged production baseline
        run: git diff --exit-code 5fefc0da294400bf36110c9ee8130e68e7425071 HEAD -- web android contracts data
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install frozen dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = '11.25.0'
          pnpm --dir web install --frozen-lockfile
      - name: Restore the existing public Android preview
        run: node tools/pages-preview/fetch-apk.mjs
      - name: Verify bounded loading witness negative controls
        run: node --test tools/pages-preview/tests/browser-map-loading.test.mjs
      - name: Build the exact unchanged production app
        run: node tools/pages-preview/build.mjs --base /tropnik/ --origin https://orewn.github.io
      - name: Observe actual loading with one genuine delayed halo fetch
        timeout-minutes: 3
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/pages-preview/browser-map-loading.mjs
      - name: Preserve source-bound actual browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tropnik-map-loading-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/pages-preview/dist/build-info.json
            web/pages-preview/dist/verification.json
            web/pages-preview/dist/http-verification.json
            web/pages-preview/dist/browser-map-loading-verification.json
            web/pages-preview/design-qa/map-loading
          if-no-files-found: error
          retention-days: 7
