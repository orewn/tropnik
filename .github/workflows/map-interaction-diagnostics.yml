name: Focused map, satellite and offline diagnosis

on:
  push:
    branches: [diagnostics/map-interactions, perf/full-site-smoothness-0.4.24]
  workflow_dispatch:
    inputs:
      traceSmoothness:
        description: Also capture instrumented panel and search traces in a separate diagnostic job
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: map-interaction-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-candidate-audit:
    name: Full candidate browser audit
    if: github.repository == 'orewn/tropnik' && github.ref == 'refs/heads/perf/full-site-smoothness-0.4.24'
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Check out the exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install frozen dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = '11.25.0'
          pnpm --dir web install --frozen-lockfile
      - name: Verify browser harness boundaries
        run: node --test tools/pages-preview/tests/*.test.mjs
      - name: Run web regression checks
        working-directory: web
        run: node --experimental-strip-types --test --test-concurrency=1 tests/*.test.mjs
      - name: Check web lint and static client types
        run: |
          pnpm --dir web lint
          node web/node_modules/typescript/bin/tsc -p web/pages-preview/tsconfig.json --noEmit
      - name: Prepare the verified Android link and static candidate
        run: |
          node tools/pages-preview/fetch-apk.mjs
          node tools/pages-preview/build.mjs --base /tropnik/ --origin https://orewn.github.io
      - name: Verify native keyboard events and layout-shift attribution
        run: node --test tools/pages-preview/tests/browser-native-text.browser.mjs
      - name: Verify production map controls in phone landscape
        run: node --test tools/pages-preview/tests/browser-map-controls.browser.mjs
      - name: Verify source credit geometry across satellite loading
        run: |
          node --test tools/pages-preview/tests/browser-map-attribution.browser.mjs
          node tools/pages-preview/map-attribution-verification.mjs
      - name: Verify production Canvas underlay pixel parity
        run: node --test tools/pages-preview/tests/browser-map-underlay.browser.mjs
      - name: Verify Russia mask pixels and GPU context recovery
        run: node --test tools/pages-preview/tests/terrain-mask.browser.mjs
      - name: Verify full-mask shader pixel parity at both device pixel ratios
        run: |
          node --test tools/pages-preview/tests/terrain-full-mask.browser.mjs
          node tools/pages-preview/terrain-full-mask-report.mjs
      - name: Verify completed-frame presentation against the immutable direct renderer
        run: |
          node --test tools/pages-preview/tests/terrain-presentation.browser.mjs
          node tools/pages-preview/terrain-presentation-report.mjs
      - name: Verify unmasked Android terrain, GPU allocation and resize pixel parity
        run: |
          node --test tools/pages-preview/tests/terrain-unmasked.browser.mjs
          node tools/pages-preview/terrain-unmasked-report.mjs
      - name: Run the complete production browser audit before main
        timeout-minutes: 26
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/pages-preview/browser-smoke.mjs
      - name: Verify the full report belongs to this candidate
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          import {assertBrowserReport} from './tools/pages-preview/browser-report.mjs';
          import {assertMatchingBrowserEnvironments} from './tools/pages-preview/browser-environment.mjs';
          import {assertMapAttributionReceipt} from './tools/pages-preview/map-attribution-verification.mjs';
          import {assertTerrainFullMaskReport} from './tools/pages-preview/terrain-full-mask-report.mjs';
          import {assertTerrainPresentationReport} from './tools/pages-preview/terrain-presentation-report.mjs';
          import {assertTerrainUnmaskedReport} from './tools/pages-preview/terrain-unmasked-report.mjs';
          const build = JSON.parse(readFileSync('web/pages-preview/dist/build-info.json', 'utf8'));
          const browser = JSON.parse(readFileSync('web/pages-preview/dist/browser-verification.json', 'utf8'));
          assert.match(build.buildId, /^[a-f0-9]{16}$/);
          assert.equal(build.sourceCommit, process.env.GITHUB_SHA);
          assert.equal(build.hasApk, true);
          assertBrowserReport(browser, process.env.GITHUB_SHA, build.catalogue);
          const mask = JSON.parse(readFileSync('web/pages-preview/dist/browser-terrain-mask-verification.json', 'utf8'));
          assert.equal(mask.verified, true);
          assert.equal(mask.sourceCommit, process.env.GITHUB_SHA);
          assert.equal(mask.rendererSHA256, createHash('sha256').update(readFileSync('web/public/terrain/terrain-renderer.js')).digest('hex'));
          assert.equal(mask.cases.length, 4);
          assert.deepEqual(browser.terrainMask, mask, 'The full browser report must include the exact graphics proof from this run');
          const fullMask = JSON.parse(readFileSync('web/pages-preview/dist/browser-terrain-full-mask-verification.json', 'utf8'));
          assertTerrainFullMaskReport(fullMask, {sourceCommit:process.env.GITHUB_SHA, environment:browser.environment});
          assert.equal(fullMask.rendererSHA256, mask.rendererSHA256);
          const presentation = JSON.parse(readFileSync('web/pages-preview/dist/browser-terrain-presentation-verification.json', 'utf8'));
          assertTerrainPresentationReport(presentation, {sourceCommit:process.env.GITHUB_SHA, environment:browser.environment});
          const unmasked = JSON.parse(readFileSync('web/pages-preview/dist/browser-terrain-unmasked-verification.json', 'utf8'));
          assertTerrainUnmaskedReport(unmasked, {sourceCommit:process.env.GITHUB_SHA, environment:browser.environment});
          assert.equal(unmasked.rendererSHA256, presentation.rendererSHA256);
          assert.equal(presentation.rendererSHA256, mask.rendererSHA256);
          const attribution = JSON.parse(readFileSync('web/pages-preview/dist/browser-map-attribution-verification.json', 'utf8'));
          assertMapAttributionReceipt(attribution, {sourceCommit:process.env.GITHUB_SHA, environment:browser.environment});
          const underlay = JSON.parse(readFileSync('web/pages-preview/dist/browser-map-underlay-verification.json', 'utf8'));
          assert.equal(underlay.schemaVersion, 1);
          assert.equal(underlay.evidence, 'production-canvas-underlay-pixel-parity');
          assert.equal(underlay.baseline, 'same-production-draw-with-fixture-only-coverage-false');
          assert.equal(underlay.verified, true);
          assert.equal(underlay.sourceCommit, process.env.GITHUB_SHA);
          assert.equal(underlay.rendererSHA256, createHash('sha256').update(readFileSync('web/lib/custom-map-engine.ts')).digest('hex'));
          assert.equal(underlay.sources['web/lib/custom-map-engine.ts'], underlay.rendererSHA256);
          for (const [path, hash] of Object.entries(underlay.sources)) {
            assert.match(path, /^web\/(?:[\w.-]+\/)*[\w.-]+$/);
            assert.equal(hash, createHash('sha256').update(readFileSync(path)).digest('hex'));
          }
          assertMatchingBrowserEnvironments(underlay.environment, browser.environment, process.env.GITHUB_SHA);
          const covers = {opaque:[true], 'fractional-zoom':[true], 'pan-sequence':[true,true,true,false,true], missing:[false], transparent:[false], rotated:[false], pitched:[false], satellite:[false], overview:[false], zoom12:[true,true,true,false,true], zoom13:[false], zoom18:[false], 'tiny-tile':[false], 'unwrapped-world':[true], 'boundaries-hidden':[true]};
          assert.deepEqual(underlay.cases.map(item => item.dpr + '/' + item.name).sort(), [1,2].flatMap(dpr => Object.keys(covers).map(name => dpr + '/' + name)).sort());
          let underlayFrames = 0;
          for (const item of underlay.cases) {
            assert.equal(item.verified, true);
            assert.equal(item.contextAttributes.alpha, false);
            assert.equal(item.contextAttributes.willReadFrequently, item.policy.softwareRaster);
            assert.deepEqual(item.bitmapDimensions, [512,512]);
            assert.equal(item.priorFrame.kind, 'distinct-opaque-checkerboards');
            assert.equal(item.priorFrame.comparison.differentPixels, 512*384*item.dpr*item.dpr);
            assert.equal(item.priorFrame.comparison.totalPixels, 512*384*item.dpr*item.dpr);
            assert.ok(item.priorFrame.comparison.maxChannelDelta > 0 && item.priorFrame.comparison.maxChannelDelta <= 255);
            assert.match(item.priorFrame.baselinePixelSHA256, /^[a-f0-9]{64}$/);
            assert.match(item.priorFrame.optimizedPixelSHA256, /^[a-f0-9]{64}$/);
            assert.notEqual(item.priorFrame.baselinePixelSHA256, item.priorFrame.optimizedPixelSHA256);
            assert.deepEqual(item.frames.map(frame => frame.actualCoverage), covers[item.name]);
            assert.deepEqual(item.frames.map(frame => frame.expectedCoverage), covers[item.name]);
            if (item.name === 'tiny-tile') assert.ok(item.tileDeviceSpan <= 1);
            const negatives = item.name === 'opaque' ? ['remove-route','remove-selectedBoundary','remove-mask'] : ['missing','transparent'].includes(item.name) ? ['force-unsafe-cover'] : [];
            assert.deepEqual(item.negativeControls.map(control => control.name), negatives);
            for (const control of item.negativeControls) assert.ok(control.differentPixels > 0);
            for (const frame of item.frames) {
              underlayFrames++;
              assert.deepEqual([frame.width,frame.height], [512*item.dpr,384*item.dpr]);
              assert.deepEqual(frame.comparison, {differentPixels:0,maxChannelDelta:0,totalPixels:frame.width*frame.height});
              assert.match(frame.baselinePixelSHA256, /^[a-f0-9]{64}$/);
              assert.equal(frame.optimizedPixelSHA256, frame.baselinePixelSHA256);
              const {baseline,optimized} = frame.operations;
              assert.equal(baseline.area, 1);
              assert.ok(baseline.overview > 0);
              assert.equal(optimized.area, frame.actualCoverage ? 0 : 1);
              assert.equal(optimized.overview, frame.actualCoverage ? 0 : baseline.overview);
              for (const key of ['mask','selectedArea','detail','relief','imagery']) assert.equal(optimized[key], baseline[key]);
              assert.equal(baseline.clear, 1);
              assert.equal(optimized.clear, frame.actualCoverage ? 0 : 1);
              assert.equal(optimized.mask, 1);
              assert.equal(optimized.proofCalls, 1);
              if (frame.actualCoverage) assert.ok(item.tileDeviceSpan > 1);
              assert.deepEqual(frame.captures.map(capture => capture.phase), ['baseline','optimized']);
              for (const capture of frame.captures) {
                assert.match(capture.file, /^[a-zA-Z0-9.-]+\.png$/);
                const png = readFileSync('web/pages-preview/design-qa/map-underlay/' + capture.file);
                assert.equal(png.length, capture.bytes);
                assert.equal(createHash('sha256').update(png).digest('hex'), capture.sha256);
                assert.equal(png.subarray(0,8).toString('hex'), '89504e470d0a1a0a');
                assert.deepEqual([png.readUInt32BE(16),png.readUInt32BE(20)], [frame.width,frame.height]);
              }
            }
          }
          assert.equal(underlayFrames, 46);
          for (const fixture of ['browser-native-text-verification.json', 'browser-map-controls-verification.json']) {
            const receipt = JSON.parse(readFileSync('web/pages-preview/dist/' + fixture, 'utf8'));
            assert.equal(receipt.verified, true);
            assert.equal(receipt.sourceCommit, process.env.GITHUB_SHA);
            assertMatchingBrowserEnvironments(receipt.environment, browser.environment, process.env.GITHUB_SHA);
          }
          console.log(JSON.stringify({verified:true,sourceCommit:build.sourceCommit,buildId:build.buildId,profiles:browser.profiles.length}));
          NODE
      - name: Preserve candidate evidence without publication
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tropnik-candidate-browser-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/pages-preview/design-qa
            web/pages-preview/dist/build-info.json
            web/pages-preview/dist/verification.json
            web/pages-preview/dist/http-verification.json
            web/pages-preview/dist/browser-native-text-verification.json
            web/pages-preview/dist/browser-terrain-mask-verification.json
            web/pages-preview/dist/browser-terrain-full-mask-verification.json
            web/pages-preview/dist/browser-terrain-presentation-verification.json
            web/pages-preview/dist/browser-terrain-unmasked-verification.json
            web/pages-preview/dist/browser-map-attribution-verification.json
            web/pages-preview/dist/browser-map-underlay-verification.json
            web/pages-preview/dist/browser-map-controls-verification.json
            web/pages-preview/dist/browser-verification.json
            web/pages-preview/dist/browser-network.json
            web/pages-preview/dist/browser-failure.*
          if-no-files-found: error
          retention-days: 7

  inspect:
    name: Diagnose ${{ matrix.diagnostic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        diagnostic: [map-interactions, offline-safety, satellite-continuity, ui-smoothness, ui-smoothness-cpu]
    steps:
      - name: Check out the diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install frozen dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          pnpm --dir web install --frozen-lockfile
      - name: Prepare the verified Android artifact and static site
        run: |
          node tools/pages-preview/fetch-apk.mjs
          node tools/pages-preview/build.mjs --base /tropnik/ --origin https://orewn.github.io
      - name: Verify native keyboard events and layout-shift attribution
        if: matrix.diagnostic == 'ui-smoothness'
        run: node --test tools/pages-preview/tests/browser-native-text.browser.mjs
      - name: Run the existing focused browser audit
        timeout-minutes: 8
        env:
          GITHUB_SHA: ${{ github.sha }}
          TROPNIK_BROWSER_DIAGNOSTIC: ${{ matrix.diagnostic }}
          TROPNIK_BROWSER_TRACE: ${{ matrix.diagnostic == 'map-interactions' && '1' || '' }}
        run: node tools/pages-preview/browser-smoke.mjs
      - name: Preserve diagnostics without a release artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tropnik-${{ matrix.diagnostic }}-diagnostic-${{ github.run_id }}
          path: |
            web/pages-preview/design-qa
            web/pages-preview/dist/browser-map-interactions-diagnostic.json
            web/pages-preview/dist/browser-offline-safety-diagnostic.json
            web/pages-preview/dist/browser-satellite-continuity-diagnostic.json
            web/pages-preview/dist/browser-ui-smoothness-diagnostic.json
            web/pages-preview/dist/browser-ui-smoothness-cpu-diagnostic.json
            web/pages-preview/dist/browser-native-text-verification.json
            web/pages-preview/dist/browser-network.json
            web/pages-preview/dist/browser-failure.*
          if-no-files-found: error
          retention-days: 7

  trace-smoothness:
    name: Diagnose UI smoothness with explicit tracing
    # Candidate diagnosis is separate from the unchanged, untraced full gate.
    # Keep the bounded panel/search windows available while replacing the SDK.
    if: (github.event_name == 'workflow_dispatch' && inputs.traceSmoothness) || (github.event_name == 'push' && github.ref == 'refs/heads/perf/full-site-smoothness-0.4.24')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install frozen dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          pnpm --dir web install --frozen-lockfile
      - name: Prepare the verified Android artifact and static site
        run: |
          node tools/pages-preview/fetch-apk.mjs
          node tools/pages-preview/build.mjs --base /tropnik/ --origin https://orewn.github.io
      - name: Verify native keyboard events and layout-shift attribution
        run: node --test tools/pages-preview/tests/browser-native-text.browser.mjs
      - name: Capture bounded panel and search traces
        timeout-minutes: 8
        env:
          GITHUB_SHA: ${{ github.sha }}
          TROPNIK_BROWSER_DIAGNOSTIC: ui-smoothness
          TROPNIK_BROWSER_TRACE: '1'
        run: node tools/pages-preview/browser-smoke.mjs
      - name: Preserve instrumented diagnostics without a release artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tropnik-ui-smoothness-trace-diagnostic-${{ github.run_id }}
          path: |
            web/pages-preview/design-qa
            web/pages-preview/dist/browser-ui-smoothness-diagnostic.json
            web/pages-preview/dist/browser-native-text-verification.json
            web/pages-preview/dist/browser-network.json
            web/pages-preview/dist/browser-failure.*
          if-no-files-found: error
          retention-days: 7
