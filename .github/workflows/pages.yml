name: Public GitHub Pages

on:
  push:
    branches: [main]
    # Include every web/compiler/data input, including the native catalogue
    # manifest bound into the shared map. Backend-only and Kotlin-only changes
    # have their own gates and do not republish an unchanged static client.
    paths:
      - 'web/**'
      - 'tools/**'
      - 'data/**'
      - 'contracts/**'
      - 'android/app/src/main/assets/catalog-manifest.json'
      - 'docs/verification/place-stories-2026-11-13.json'
      - '.github/workflows/pages.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.repository == 'orewn/tropnik' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    permissions:
      contents: read
      pages: read
    outputs:
      build_id: ${{ steps.build_metadata.outputs.build_id }}
      artifact_name: ${{ steps.build_metadata.outputs.artifact_name }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the pinned package manager and frozen dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = '11.25.0'
          pnpm --dir web install --frozen-lockfile
      - name: Restore and verify the public Android preview
        run: node tools/pages-preview/fetch-apk.mjs
      - name: Verify APK download failure boundaries
        run: node --test tools/pages-preview/tests/*.test.mjs
      - name: Verify reviewed Telegram reference boundaries
        run: |
          python3 -m unittest discover -s tools/import-data/telegram -p 'test_*.py'
          python3 tools/import-data/telegram/cli.py validate
      - name: Verify reviewed route geometry against pinned sources
        run: python3 web/scripts/prepare-editorial-geometry.py --check
      - name: Reproduce recovered routes against the pinned full boundary
        run: |
          python3 -m venv "$RUNNER_TEMP/tropnik-route-data"
          "$RUNNER_TEMP/tropnik-route-data/bin/python" -m pip install -r tools/map-package/requirements-territories.txt
          "$RUNNER_TEMP/tropnik-route-data/bin/python" tools/import-data/recover_route_coverage.py build --archive data/catalog/coverage-recovery/source-responses.tar.gz --source-dir "$RUNNER_TEMP/tropnik-route-sources" --download-sources --check
          "$RUNNER_TEMP/tropnik-route-data/bin/python" -m unittest discover -s tools/import-data -p 'test_route_coverage_recovery.py'
          "$RUNNER_TEMP/tropnik-route-data/bin/python" -m unittest discover -s tools/map-package -p 'test_route_catalog_inputs.py'
      - name: Run web regression checks
        working-directory: web
        run: node --experimental-strip-types --test --test-concurrency=1 tests/*.test.mjs
      - name: Check web lint
        run: pnpm --dir web lint
      - name: Check static client types
        run: node web/node_modules/typescript/bin/tsc -p web/pages-preview/tsconfig.json --noEmit
      - name: Read the configured Pages destination
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Require the intended public destination
        env:
          PAGES_CONFIG_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_CONFIG_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          test "$PAGES_CONFIG_ORIGIN" = 'https://orewn.github.io'
          test "$PAGES_CONFIG_BASE" = '/tropnik'
      - name: Build and verify the static site
        run: node tools/pages-preview/build.mjs --base /tropnik/ --origin https://orewn.github.io
      - name: Check cold offline emergency access before the full browser audit
        timeout-minutes: 3
        env:
          GITHUB_SHA: ${{ github.sha }}
          TROPNIK_BROWSER_DIAGNOSTIC: offline-safety
        run: node tools/pages-preview/browser-smoke.mjs
      - name: Verify manual service worker updates and the real activation deadline
        timeout-minutes: 4
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/pages-preview/browser-service-worker-update.mjs
      - name: Verify complete trail overlay and native line selection
        timeout-minutes: 5
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/pages-preview/browser-trail-overlay.mjs
      - name: Verify worker trail pixels against the direct renderer
        timeout-minutes: 4
        run: node --test tools/pages-preview/tests/browser-trail-raster.browser.mjs
      - name: Check UI smoothness before the full browser audit
        timeout-minutes: 6
        env:
          GITHUB_SHA: ${{ github.sha }}
          TROPNIK_BROWSER_DIAGNOSTIC: ui-smoothness
        run: |
          node tools/pages-preview/browser-smoke.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {assertSmoothnessAudit} from './tools/pages-preview/browser-smoothness.mjs';
          const report = JSON.parse(readFileSync('web/pages-preview/dist/browser-ui-smoothness-diagnostic.json', 'utf8'));
          assert.equal(report.sourceCommit, process.env.GITHUB_SHA);
          assert.equal(report.status, 'completed');
          assert.equal(report.diagnosticOnly, true);
          assert.equal(report.releaseEligible, false);
          const profiles = [{name:'android-portrait',mobile:true,engine:'tropnik-canvas'}, {name:'desktop-webgl',mobile:false,engine:'tropnik-canvas'}];
          assert.deepEqual(report.profiles.map(item => item.profile), profiles.map(item => item.name));
          report.profiles.forEach((audit, index) => assertSmoothnessAudit(audit, profiles[index]));
          assert.deepEqual(report.performanceIssues, []);
          NODE
      - name: Verify production map controls in phone landscape
        run: node --test tools/pages-preview/tests/browser-map-controls.browser.mjs
      - name: Verify source credit geometry across satellite loading
        run: |
          node --test tools/pages-preview/tests/browser-map-attribution.browser.mjs
          node tools/pages-preview/map-attribution-verification.mjs
      - name: Verify production Canvas underlay pixel parity
        run: node --test tools/pages-preview/tests/browser-map-underlay.browser.mjs
      - name: Verify Russia mask pixels and GPU context recovery
        run: node --test tools/pages-preview/tests/terrain-mask.browser.mjs
      - name: Verify full-mask shader pixel parity at both device pixel ratios
        run: |
          node --test tools/pages-preview/tests/terrain-full-mask.browser.mjs
          node tools/pages-preview/terrain-full-mask-report.mjs
      - name: Verify completed-frame presentation against the immutable direct renderer
        run: |
          node --test tools/pages-preview/tests/terrain-presentation.browser.mjs
          node tools/pages-preview/terrain-presentation-report.mjs
      - name: Verify unmasked Android terrain, GPU allocation and resize pixel parity
        run: |
          node --test tools/pages-preview/tests/terrain-unmasked.browser.mjs
          node tools/pages-preview/terrain-unmasked-report.mjs
      - name: Verify real mobile rendering and sheet interaction and desktop map interactions
        # The prior full audit took 20m37s. The required satellite matrix adds
        # 169.905s measured in e749d99, including native8 and overzoom in both
        # engines. Allow 26m total; input, CLS and 350/750ms limits are unchanged.
        timeout-minutes: 26
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/pages-preview/browser-smoke.mjs
      - name: Record the verified build identity
        id: build_metadata
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync, appendFileSync} from 'node:fs';
          import {assertBrowserReport} from './tools/pages-preview/browser-report.mjs';
          import {assertMatchingBrowserEnvironments} from './tools/pages-preview/browser-environment.mjs';
          import {assertMapAttributionReceipt} from './tools/pages-preview/map-attribution-verification.mjs';
          import {assertTerrainFullMaskReport} from './tools/pages-preview/terrain-full-mask-report.mjs';
          import {assertTerrainPresentationReport} from './tools/pages-preview/terrain-presentation-report.mjs';
          import {assertTerrainUnmaskedReport} from './tools/pages-preview/terrain-unmasked-report.mjs';
          import {assertTrailOverlayReceipt} from './tools/pages-preview/browser-trail-overlay.mjs';
          import {assertServiceWorkerUpdateReceipt} from './tools/pages-preview/browser-service-worker-update.mjs';
          const build = JSON.parse(readFileSync('web/pages-preview/dist/build-info.json', 'utf8'));
          const browser = JSON.parse(readFileSync('web/pages-preview/dist/browser-verification.json', 'utf8'));
          assert.match(build.buildId, /^[a-f0-9]{16}$/);
          assert.equal(build.sourceCommit, process.env.GITHUB_SHA);
          assert.equal(build.hasApk, true);
          assertBrowserReport(browser, process.env.GITHUB_SHA, build.catalogue);
          const workerUpdate = JSON.parse(readFileSync('web/pages-preview/dist/browser-service-worker-update-verification.json', 'utf8'));
          assertServiceWorkerUpdateReceipt(workerUpdate, {sourceCommit:process.env.GITHUB_SHA, buildId:build.buildId, environment:browser.environment});
          assert.deepEqual(Object.keys(workerUpdate.sources).sort(), ['web/components/ServiceWorker.tsx','web/lib/service-worker-registration.ts','web/public/sw.js','tools/pages-preview/browser-service-worker-update.mjs'].sort());
          for (const [path, hash] of Object.entries(workerUpdate.sources)) {
            assert.equal(createHash('sha256').update(readFileSync(path)).digest('hex'), hash);
            assert.equal(build.inputs.find(input => input.path === path)?.sha256, hash);
          }
          const deployedWorker = readFileSync('web/pages-preview/dist/sw.js', 'utf8');
          const workerVersionPattern = /const VERSION='([^']+)'/g;
          const workerVersions = [...deployedWorker.matchAll(workerVersionPattern)];
          assert.equal(workerVersions.length, 1);
          assert.equal(workerUpdate.worker.version, workerVersions[0][1]);
          assert.equal(workerUpdate.worker.sha256, createHash('sha256').update(deployedWorker).digest('hex'));
          const normalizedWorker = deployedWorker.replace(workerVersionPattern, "const VERSION='SW_AUDIT_VERSION'");
          assert.equal(workerUpdate.worker.normalizedSha256, createHash('sha256').update(normalizedWorker).digest('hex'));
          for (const [key, variant] of Object.entries(workerUpdate.worker.variants)) {
            assert.equal(variant.version, workerUpdate.worker.version + '-sw-audit-' + key);
            const source = deployedWorker.replace(workerVersionPattern, `const VERSION='${variant.version}'`);
            assert.equal(variant.sha256, createHash('sha256').update(source).digest('hex'));
          }
          for (const capture of workerUpdate.screenshots) {
            const png = readFileSync('web/pages-preview/design-qa/service-worker-update/' + capture.file);
            assert.equal(png.length, capture.bytes);
            assert.equal(createHash('sha256').update(png).digest('hex'), capture.sha256);
            assert.equal(png.subarray(0,8).toString('hex'), '89504e470d0a1a0a');
            assert.deepEqual([png.readUInt32BE(16),png.readUInt32BE(20)], [workerUpdate.profile.width*workerUpdate.profile.deviceScaleFactor,workerUpdate.profile.height*workerUpdate.profile.deviceScaleFactor]);
          }
          const trailOverlay = JSON.parse(readFileSync('web/pages-preview/dist/browser-trail-overlay-verification.json', 'utf8'));
          const trailMetadata = JSON.parse(readFileSync('web/lib/trail-overlay.generated.json', 'utf8'));
          assertTrailOverlayReceipt(trailOverlay, {sourceCommit:process.env.GITHUB_SHA, buildId:build.buildId, metadata:trailMetadata, environment:browser.environment});
          for (const profile of trailOverlay.profiles) for (const capture of profile.screenshots) {
            const png = readFileSync('web/pages-preview/design-qa/trail-overlay/' + capture.file);
            assert.equal(png.length, capture.bytes);
            assert.equal(createHash('sha256').update(png).digest('hex'), capture.sha256);
            assert.equal(png.subarray(0,8).toString('hex'), '89504e470d0a1a0a');
            assert.deepEqual([png.readUInt32BE(16),png.readUInt32BE(20)], [profile.width*profile.deviceScaleFactor,profile.height*profile.deviceScaleFactor]);
          }
          const trailRaster = JSON.parse(readFileSync('web/pages-preview/dist/browser-trail-raster-verification.json', 'utf8'));
          assert.equal(trailRaster.schemaVersion, 1);
          assert.equal(trailRaster.verified, true);
          assert.equal(trailRaster.sourceCommit, process.env.GITHUB_SHA);
          assert.equal(trailRaster.buildId, build.buildId);
          assert.equal(trailRaster.evidence, 'production-trail-worker-pixel-parity');
          assert.equal(trailRaster.overlay.sha256, trailMetadata.sha256);
          assert.equal(trailRaster.overlay.sources, trailMetadata.uniqueGeometries);
          assertMatchingBrowserEnvironments(trailRaster.environment, browser.environment, process.env.GITHUB_SHA);
          assert.deepEqual(trailRaster.matrix, {dpr:[1,1.5,2], palettes:['relief','satellite'], scenarios:['disconnected','antimeridian','rotated-pitched','country']});
          for (const [path, hash] of Object.entries(trailRaster.sources)) {
            assert.match(path, /^web\/(?:[\w.-]+\/)*[\w.-]+$/);
            assert.equal(createHash('sha256').update(readFileSync(path)).digest('hex'), hash);
          }
          assert.equal(trailRaster.cases.length, 24);
          assert.equal(new Set(trailRaster.cases.map(item => `${item.dpr}/${item.name}/${item.palette}`)).size, 24);
          for (const item of trailRaster.cases) {
            assert.equal(item.verified, true);
            assert.equal(item.rasterComparison.differentPixels, 0);
            assert.equal(item.rasterComparison.maxChannelDelta, 0);
            assert.equal(item.referenceRasterPixelSHA256, item.workerRasterPixelSHA256);
            // Grouping two translucent strokes into an RGBA bitmap changes
            // 8-bit alpha rounding by at most two levels over an opaque map.
            // The actual transparent geometry/raster remains bit-identical.
            assert.ok(item.comparison.maxChannelDelta <= 2);
            assert.equal(item.nativeWorker.bitmap, true);
            assert.equal(item.nativeWorker.count, 1);
            assert.equal(item.nativeWorker.state.ready, true);
            assert.equal(item.nativeWorker.state.error, '');
            if (item.name === 'country') {
              assert.equal(item.sources, trailMetadata.uniqueGeometries);
              assert.equal(item.frame.parts, trailMetadata.sourceParts);
            }
            assert.deepEqual(item.captures.map(capture => capture.phase), ['reference','worker']);
            for (const capture of item.captures) {
              const png = readFileSync('web/pages-preview/design-qa/trail-raster/' + capture.file);
              assert.equal(png.length, capture.bytes);
              assert.equal(createHash('sha256').update(png).digest('hex'), capture.sha256);
              assert.equal(png.subarray(0,8).toString('hex'), '89504e470d0a1a0a');
              assert.deepEqual([png.readUInt32BE(16),png.readUInt32BE(20)], [item.frame.width,item.frame.height]);
            }
          }
          const mask = JSON.parse(readFileSync('web/pages-preview/dist/browser-terrain-mask-verification.json', 'utf8'));
          assert.equal(mask.verified, true);
          assert.equal(mask.sourceCommit, process.env.GITHUB_SHA);
          assert.equal(mask.rendererSHA256, createHash('sha256').update(readFileSync('web/public/terrain/terrain-renderer.js')).digest('hex'));
          assert.equal(mask.cases.length, 4);
          assert.deepEqual(browser.terrainMask, mask, 'The full browser report must include the exact graphics proof from this run');
          const fullMask = JSON.parse(readFileSync('web/pages-preview/dist/browser-terrain-full-mask-verification.json', 'utf8'));
          assertTerrainFullMaskReport(fullMask, {sourceCommit:process.env.GITHUB_SHA, environment:browser.environment});
          assert.equal(fullMask.rendererSHA256, mask.rendererSHA256);
          const presentation = JSON.parse(readFileSync('web/pages-preview/dist/browser-terrain-presentation-verification.json', 'utf8'));
          assertTerrainPresentationReport(presentation, {sourceCommit:process.env.GITHUB_SHA, environment:browser.environment});
          const unmasked = JSON.parse(readFileSync('web/pages-preview/dist/browser-terrain-unmasked-verification.json', 'utf8'));
          assertTerrainUnmaskedReport(unmasked, {sourceCommit:process.env.GITHUB_SHA, environment:browser.environment});
          assert.equal(unmasked.rendererSHA256, presentation.rendererSHA256);
          assert.equal(presentation.rendererSHA256, mask.rendererSHA256);
          const attribution = JSON.parse(readFileSync('web/pages-preview/dist/browser-map-attribution-verification.json', 'utf8'));
          assertMapAttributionReceipt(attribution, {sourceCommit:process.env.GITHUB_SHA, environment:browser.environment});
          const underlay = JSON.parse(readFileSync('web/pages-preview/dist/browser-map-underlay-verification.json', 'utf8'));
          assert.equal(underlay.schemaVersion, 1);
          assert.equal(underlay.evidence, 'production-canvas-underlay-pixel-parity');
          assert.equal(underlay.baseline, 'same-production-draw-with-fixture-only-coverage-false');
          assert.equal(underlay.verified, true);
          assert.equal(underlay.sourceCommit, process.env.GITHUB_SHA);
          assert.equal(underlay.rendererSHA256, createHash('sha256').update(readFileSync('web/lib/custom-map-engine.ts')).digest('hex'));
          assert.equal(underlay.sources['web/lib/custom-map-engine.ts'], underlay.rendererSHA256);
          for (const [path, hash] of Object.entries(underlay.sources)) {
            assert.match(path, /^web\/(?:[\w.-]+\/)*[\w.-]+$/);
            assert.equal(hash, createHash('sha256').update(readFileSync(path)).digest('hex'));
          }
          assertMatchingBrowserEnvironments(underlay.environment, browser.environment, process.env.GITHUB_SHA);
          const covers = {opaque:[true], 'fractional-zoom':[true], 'pan-sequence':[true,true,true,false,true], missing:[false], transparent:[false], rotated:[false], pitched:[false], satellite:[false], overview:[false], zoom12:[true,true,true,false,true], zoom13:[false], zoom18:[false], 'tiny-tile':[false], 'unwrapped-world':[true], 'boundaries-hidden':[true]};
          assert.deepEqual(underlay.cases.map(item => item.dpr + '/' + item.name).sort(), [1,2].flatMap(dpr => Object.keys(covers).map(name => dpr + '/' + name)).sort());
          let underlayFrames = 0;
          for (const item of underlay.cases) {
            assert.equal(item.verified, true);
            assert.equal(item.contextAttributes.alpha, false);
            assert.equal(item.contextAttributes.willReadFrequently, item.policy.softwareRaster);
            assert.deepEqual(item.bitmapDimensions, [512,512]);
            assert.equal(item.priorFrame.kind, 'distinct-opaque-checkerboards');
            assert.equal(item.priorFrame.comparison.differentPixels, 512*384*item.dpr*item.dpr);
            assert.equal(item.priorFrame.comparison.totalPixels, 512*384*item.dpr*item.dpr);
            assert.ok(item.priorFrame.comparison.maxChannelDelta > 0 && item.priorFrame.comparison.maxChannelDelta <= 255);
            assert.match(item.priorFrame.baselinePixelSHA256, /^[a-f0-9]{64}$/);
            assert.match(item.priorFrame.optimizedPixelSHA256, /^[a-f0-9]{64}$/);
            assert.notEqual(item.priorFrame.baselinePixelSHA256, item.priorFrame.optimizedPixelSHA256);
            assert.deepEqual(item.frames.map(frame => frame.actualCoverage), covers[item.name]);
            assert.deepEqual(item.frames.map(frame => frame.expectedCoverage), covers[item.name]);
            if (item.name === 'tiny-tile') assert.ok(item.tileDeviceSpan <= 1);
            const negatives = item.name === 'opaque' ? ['remove-route','remove-selectedBoundary','remove-mask'] : ['missing','transparent'].includes(item.name) ? ['force-unsafe-cover'] : [];
            assert.deepEqual(item.negativeControls.map(control => control.name), negatives);
            for (const control of item.negativeControls) assert.ok(control.differentPixels > 0);
            for (const frame of item.frames) {
              underlayFrames++;
              assert.deepEqual([frame.width,frame.height], [512*item.dpr,384*item.dpr]);
              assert.deepEqual(frame.comparison, {differentPixels:0,maxChannelDelta:0,totalPixels:frame.width*frame.height});
              assert.match(frame.baselinePixelSHA256, /^[a-f0-9]{64}$/);
              assert.equal(frame.optimizedPixelSHA256, frame.baselinePixelSHA256);
              const {baseline,optimized} = frame.operations;
              assert.equal(baseline.area, 1);
              assert.ok(baseline.overview > 0);
              assert.equal(optimized.area, frame.actualCoverage ? 0 : 1);
              assert.equal(optimized.overview, frame.actualCoverage ? 0 : baseline.overview);
              for (const key of ['mask','selectedArea','detail','relief','imagery']) assert.equal(optimized[key], baseline[key]);
              assert.equal(baseline.clear, 1);
              assert.equal(optimized.clear, frame.actualCoverage ? 0 : 1);
              assert.equal(optimized.mask, 1);
              assert.equal(optimized.proofCalls, 1);
              if (frame.actualCoverage) assert.ok(item.tileDeviceSpan > 1);
              assert.deepEqual(frame.captures.map(capture => capture.phase), ['baseline','optimized']);
              for (const capture of frame.captures) {
                assert.match(capture.file, /^[a-zA-Z0-9.-]+\.png$/);
                const png = readFileSync('web/pages-preview/design-qa/map-underlay/' + capture.file);
                assert.equal(png.length, capture.bytes);
                assert.equal(createHash('sha256').update(png).digest('hex'), capture.sha256);
                assert.equal(png.subarray(0,8).toString('hex'), '89504e470d0a1a0a');
                assert.deepEqual([png.readUInt32BE(16),png.readUInt32BE(20)], [frame.width,frame.height]);
              }
            }
          }
          assert.equal(underlayFrames, 46);
          const groundCache = underlay.groundCache;
          const groundScenarios = ['opaque','missing','satellite','overview','rotated-pitched','unwrapped-world'];
          const groundPhases = ['cold','stroke-history','warm','overlay-changed','overlay-empty','route-changed','route-empty'];
          assert.equal(groundCache.verified, true);
          assert.equal(groundCache.baseline, 'same-production-draw-with-ground-cache-disabled');
          assert.deepEqual(groundCache.dpr, [1,1.5,2]);
          assert.deepEqual(groundCache.scenarios, groundScenarios);
          assert.deepEqual(groundCache.phases, groundPhases);
          assert.deepEqual(groundCache.cases.map(item => item.dpr + '/' + item.name).sort(), [1,1.5,2].flatMap(dpr => groundScenarios.map(name => dpr + '/' + name)).sort());
          let groundFrames = 0;
          for (const item of groundCache.cases) {
            assert.equal(item.verified, true);
            assert.equal(item.cacheProof, true);
            assert.equal(item.previewOnly, false);
            assert.equal(item.nativeDpr, item.dpr);
            assert.equal(item.cacheEligible, item.name !== 'rotated-pitched');
            assert.deepEqual(item.phases, groundPhases);
            assert.deepEqual(item.frames.map(frame => frame.phase), groundPhases);
            if (item.cacheEligible) {
              assert.equal(item.groundContextAttributes.alpha, false);
              assert.equal(item.groundContextAttributes.willReadFrequently, item.policy.softwareRaster);
              assert.deepEqual(item.retainedBacking, {width:512*item.dpr,height:384*item.dpr,bytes:512*384*item.dpr*item.dpr*4});
            } else {
              assert.equal(item.groundContextAttributes, null);
              assert.equal(item.retainedBacking, null);
            }
            for (const [index, frame] of item.frames.entries()) {
              groundFrames++;
              assert.equal(frame.expectedHit, item.cacheEligible && index >= 2);
              assert.equal(frame.operations.baseline.groundRestore, 0);
              assert.equal(frame.operations.optimized.groundRestore, Number(frame.expectedHit));
              for (const side of ['baseline','optimized']) {
                assert.equal(frame.operations[side].mask, 1);
                assert.equal(frame.operations[side].proofCalls, 1);
              }
              for (const key of ['clear','area','overview','detail','relief','imagery','selectedArea']) {
                if (frame.expectedHit) assert.equal(frame.operations.optimized[key], 0);
                if (!item.cacheEligible) assert.equal(frame.operations.optimized[key], frame.operations.baseline[key]);
              }
              assert.deepEqual([frame.width,frame.height], [512*item.dpr,384*item.dpr]);
              assert.deepEqual(frame.comparison, {differentPixels:0,maxChannelDelta:0,totalPixels:frame.width*frame.height});
              assert.match(frame.baselinePixelSHA256, /^[a-f0-9]{64}$/);
              assert.equal(frame.optimizedPixelSHA256, frame.baselinePixelSHA256);
              if (index >= 3) assert.ok(frame.changedFromPrevious.differentPixels > 0);
              assert.deepEqual(frame.captures.map(capture => capture.phase), ['baseline','optimized']);
              for (const capture of frame.captures) {
                assert.match(capture.file, /^[a-zA-Z0-9.-]+\.png$/);
                const png = readFileSync('web/pages-preview/design-qa/map-underlay/' + capture.file);
                assert.equal(png.length, capture.bytes);
                assert.equal(createHash('sha256').update(png).digest('hex'), capture.sha256);
                assert.equal(png.subarray(0,8).toString('hex'), '89504e470d0a1a0a');
                assert.deepEqual([png.readUInt32BE(16),png.readUInt32BE(20)], [frame.width,frame.height]);
              }
            }
          }
          assert.equal(groundFrames, 126);
          const controls = JSON.parse(readFileSync('web/pages-preview/dist/browser-map-controls-verification.json', 'utf8'));
          assert.equal(controls.verified, true);
          assert.equal(controls.sourceCommit, process.env.GITHUB_SHA);
          assertMatchingBrowserEnvironments(controls.environment, browser.environment, process.env.GITHUB_SHA);
          appendFileSync(process.env.GITHUB_OUTPUT, `build_id=${build.buildId}\n`);
          assert.match(process.env.GITHUB_RUN_ID, /^\d+$/);
          assert.match(process.env.GITHUB_RUN_ATTEMPT, /^\d+$/);
          appendFileSync(process.env.GITHUB_OUTPUT, `artifact_name=github-pages-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}\n`);
          NODE
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tropnik-pages-browser-failure-${{ github.run_attempt }}
          path: |
            web/pages-preview/dist/browser-failure.*
            web/pages-preview/dist/browser-terrain-mask-verification.json
            web/pages-preview/dist/browser-terrain-full-mask-verification.json
            web/pages-preview/dist/browser-terrain-presentation-verification.json
            web/pages-preview/dist/browser-terrain-unmasked-verification.json
            web/pages-preview/dist/browser-map-attribution-verification.json
            web/pages-preview/dist/browser-map-underlay-verification.json
            web/pages-preview/dist/browser-map-controls-verification.json
            web/pages-preview/dist/browser-trail-overlay-verification.json
            web/pages-preview/dist/browser-trail-raster-verification.json
            web/pages-preview/dist/browser-ui-smoothness-diagnostic.json
            web/pages-preview/dist/browser-service-worker-update-verification.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve map design checks across zoom levels
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tropnik-pages-design-${{ github.run_attempt }}
          path: web/pages-preview/design-qa
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the verified static artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.build_metadata.outputs.artifact_name }}
          path: web/pages-preview/dist
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: ${{ github.repository == 'orewn/tropnik' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the matching verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          # Retain the successful build's exact artifact when only deployment
          # is retried: that job can have a later github.run_attempt.
          artifact_name: ${{ needs.build.outputs.artifact_name }}
          # GitHub Pages enforces a ten-minute deployment limit server-side.
          # Larger inputs are clamped by deploy-pages and cannot extend it.
          timeout: '600000'
      - name: Verify the public build, browser report and APK without authentication
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: node tools/pages-preview/verify-deployed.mjs "$PAGES_URL" "$EXPECTED_BUILD_ID" "$GITHUB_SHA"
