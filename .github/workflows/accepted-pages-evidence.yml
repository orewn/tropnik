{
  "name": "Read accepted Pages evidence without new measurements",
  "on": {
    "push": {
      "branches": [
        "verify/accepted-pages-evidence-20261113"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "tropnik-accepted-pages-evidence-20261113",
    "cancel-in-progress": false
  },
  "jobs": {
    "extract": {
      "if": "github.repository == 'orewn/tropnik' && github.ref == 'refs/heads/verify/accepted-pages-evidence-20261113'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "env": {
        "EVIDENCE_SOURCE": "79b5c5edd0c88f7c54e182181c3e8db6791ad706",
        "EVIDENCE_BUILD": "39a9a382cb37a4fb",
        "EVIDENCE_RUN": "43466306226",
        "EVIDENCE_ATTEMPT": "1",
        "EVIDENCE_ARTIFACT": "14061655923",
        "EVIDENCE_NAME": "github-pages-43466306226-1",
        "EVIDENCE_BYTES": "67257903",
        "EVIDENCE_SHA256": "c567b6bb9951c229b94046815f70b52b949fdcef6b88e559bf4925cd61d1dd2f"
      },
      "steps": [
        {
          "name": "Check out the exact accepted source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "79b5c5edd0c88f7c54e182181c3e8db6791ad706",
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24",
            "package-manager-cache": false
          }
        },
        {
          "name": "Bind the original successful run and immutable artifact",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "node --input-type=module <<'NODE'\nconst {default:assert}=await import('node:assert/strict');\nconst {writeFileSync}=await import('node:fs');\nconst {join}=await import('node:path');\nconst {execFileSync}=await import('node:child_process');\nconst e=process.env,repo='orewn/tropnik',source=e.EVIDENCE_SOURCE;\nassert.equal(e.GITHUB_REPOSITORY,repo);\nassert.equal(e.GITHUB_REF,'refs/heads/verify/accepted-pages-evidence-20261113');\nassert.match(source,/^[a-f0-9]{40}$/);\nassert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),source);\nconst get=async path=>{\n  const response=await fetch('https://api.github.com/repos/'+repo+path,{\n    headers:{Authorization:'Bearer '+e.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},\n    signal:AbortSignal.timeout(30000)\n  });\n  assert.equal(response.status,200,'GitHub metadata read failed: '+path);\n  return await response.json();\n};\nconst [run,artifact]=await Promise.all([get('/actions/runs/'+e.EVIDENCE_RUN),get('/actions/artifacts/'+e.EVIDENCE_ARTIFACT)]);\nassert.equal(run.id,Number(e.EVIDENCE_RUN));\nassert.equal(run.run_attempt,Number(e.EVIDENCE_ATTEMPT));\nassert.equal(run.path,'.github/workflows/pages.yml');\nassert.equal(run.event,'push');\nassert.equal(run.head_branch,'main');\nassert.equal(run.head_sha,source);\nassert.equal(run.status,'completed');\nassert.equal(run.conclusion,'success');\nassert.equal(run.repository.full_name,repo);\nassert.equal(artifact.id,Number(e.EVIDENCE_ARTIFACT));\nassert.equal(artifact.name,e.EVIDENCE_NAME);\nassert.equal(artifact.size_in_bytes,Number(e.EVIDENCE_BYTES));\nassert.equal(artifact.digest,'sha256:'+e.EVIDENCE_SHA256);\nassert.equal(artifact.expired,false);\nassert.equal(artifact.workflow_run.id,run.id);\nassert.equal(artifact.workflow_run.head_sha,source);\nassert.equal(artifact.workflow_run.head_branch,'main');\nconst receipt={\n schemaVersion:1,evidence:'accepted-pages-artifact-read-only',\n extractor:{sourceCommit:e.GITHUB_SHA,runId:Number(e.GITHUB_RUN_ID),attempt:Number(e.GITHUB_RUN_ATTEMPT)},\n artifactSourceCommit:source,expectedBuildId:e.EVIDENCE_BUILD,\n run:{id:run.id,attempt:run.run_attempt,path:run.path,event:run.event,headBranch:run.head_branch,headSha:run.head_sha,status:run.status,conclusion:run.conclusion,url:run.html_url},\n artifact:{id:artifact.id,name:artifact.name,bytes:artifact.size_in_bytes,sha256:e.EVIDENCE_SHA256,expired:artifact.expired,workflowRun:artifact.workflow_run},\n noNewMeasurements:true,noBrowserRun:true,observedAt:new Date().toISOString()\n};\nassert.notEqual(receipt.extractor.runId,receipt.run.id);\nwriteFileSync(join(e.RUNNER_TEMP,'tropnik-accepted-pages-transport.json'),JSON.stringify(receipt,null,2)+'\\n');\nconsole.log(JSON.stringify({artifactSourceCommit:source,acceptedRun:run.id,artifact:artifact.id,metadataVerified:true}));\nNODE"
        },
        {
          "name": "Download the original verified ZIP once",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "artifact-ids": "14061655923",
            "run-id": "43466306226",
            "repository": "orewn/tropnik",
            "github-token": "${{ github.token }}",
            "path": "${{ runner.temp }}/tropnik-accepted-pages-zip",
            "digest-mismatch": "error",
            "skip-decompress": true
          }
        },
        {
          "name": "Verify archive bytes and read only the three JSON members",
          "run": "python3 - <<'PY'\nimport hashlib,json,os,pathlib,shutil,stat,tarfile,zipfile\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])\ndownloads=root/'tropnik-accepted-pages-zip'\nassert downloads.is_dir()\nentries=list(downloads.rglob('*'))\nassert len(entries)<=16\nassert all(not p.is_symlink() for p in entries)\nfiles=[p for p in entries if p.is_file()]\nassert len(files)==1, 'Expected one original artifact ZIP'\narchive=files[0]\nassert stat.S_ISREG(archive.stat().st_mode)\ndef file_digest(path):\n    value=hashlib.sha256()\n    with path.open('rb') as stream:\n        for block in iter(lambda:stream.read(1024*1024),b''):\n            value.update(block)\n    return value.hexdigest()\nassert archive.stat().st_size==int(os.environ['EVIDENCE_BYTES'])\nassert file_digest(archive)==os.environ['EVIDENCE_SHA256']\noutput=root/'tropnik-accepted-pages-evidence'\noutput.mkdir(exist_ok=False)\ntar_path=root/'tropnik-accepted-pages-artifact.tar'\nassert not tar_path.exists()\nwith zipfile.ZipFile(archive) as outer:\n    members=outer.infolist()\n    assert len(members)==1 and members[0].filename=='artifact.tar'\n    member=members[0]\n    assert not member.is_dir() and not (member.flag_bits&1)\n    assert (member.external_attr>>16)&0o170000 in (0,stat.S_IFREG)\n    assert 0<member.file_size<=1024*1024*1024\n    with outer.open(member) as source,tar_path.open('xb') as target:\n        count=0\n        for block in iter(lambda:source.read(1024*1024),b''):\n            count+=len(block)\n            assert count<=1024*1024*1024\n            target.write(block)\n    assert count==member.file_size\nwanted={'build-info.json':8*1024*1024,'browser-ui-smoothness-diagnostic.json':16*1024*1024,'browser-verification.json':128*1024*1024}\nseen=set()\nrecords={}\nwith tarfile.open(tar_path,mode='r|') as inner:\n    for index,member in enumerate(inner):\n        assert index<10000\n        name=member.name\n        assert name and '\\x00' not in name and '\\\\' not in name\n        path=pathlib.PurePosixPath(name)\n        assert not path.is_absolute() and '..' not in path.parts\n        normalized=str(path)\n        assert normalized not in seen, 'Duplicate tar path'\n        seen.add(normalized)\n        assert member.type in (tarfile.REGTYPE,tarfile.AREGTYPE,tarfile.DIRTYPE), 'Only ordinary files/directories are allowed'\n        if normalized=='.':\n            assert member.isdir()\n            continue\n        if normalized not in wanted:\n            continue\n        assert member.isfile() and 0<member.size<=wanted[normalized]\n        stream=inner.extractfile(member)\n        assert stream is not None\n        data=stream.read(member.size+1)\n        assert len(data)==member.size\n        (output/normalized).write_bytes(data)\n        records[normalized]={'path':normalized,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}\nassert set(records)==set(wanted)\nreceipt={'schemaVersion':1,'archive':{'bytes':archive.stat().st_size,'sha256':file_digest(archive)},'tar':{'bytes':tar_path.stat().st_size,'sha256':file_digest(tar_path),'members':len(seen)},'members':records,'extractedFiles':sorted(records),'noOtherMembersExtracted':True}\n(output/'member-receipt.json').write_text(json.dumps(receipt,indent=2)+'\\n',encoding='utf-8')\nprint(json.dumps({'originalZipVerified':True,'selectedJsonMembers':len(records),'tarMembers':len(seen)}))\nPY"
        },
        {
          "name": "Validate original reports and print complete raw audit objects",
          "run": "node --input-type=module <<'NODE'\nconst {default:assert}=await import('node:assert/strict');\nconst {readFileSync,writeFileSync}=await import('node:fs');\nconst {join}=await import('node:path');\nconst {createHash}=await import('node:crypto');\nconst {assertBrowserReport}=await import('./tools/pages-preview/browser-report.mjs');\nconst {assertSmoothnessAudit}=await import('./tools/pages-preview/browser-smoothness.mjs');\nconst {assertMatchingBrowserEnvironments}=await import('./tools/pages-preview/browser-environment.mjs');\nconst e=process.env,dir=join(e.RUNNER_TEMP,'tropnik-accepted-pages-evidence'),source=e.EVIDENCE_SOURCE;\nconst hash=value=>createHash('sha256').update(value).digest('hex');\nconst transport=JSON.parse(readFileSync(join(e.RUNNER_TEMP,'tropnik-accepted-pages-transport.json'),'utf8'));\nconst members=JSON.parse(readFileSync(join(dir,'member-receipt.json'),'utf8'));\nconst read=name=>{\n const bytes=readFileSync(join(dir,name)),record=members.members[name];\n assert.equal(bytes.length,record.bytes);assert.equal(hash(bytes),record.sha256);\n return JSON.parse(bytes.toString('utf8'));\n};\nconst build=read('build-info.json'),early=read('browser-ui-smoothness-diagnostic.json'),full=read('browser-verification.json');\nassert.equal(build.sourceCommit,source);\nassert.equal(build.buildId,e.EVIDENCE_BUILD);\nfor(const report of [early,full]){\n assert.equal(report.sourceCommit,source);\n if(Object.hasOwn(report,'buildId'))assert.equal(report.buildId,build.buildId);\n}\nconst helperPaths=['tools/pages-preview/browser-report.mjs','tools/pages-preview/browser-smoothness.mjs','tools/pages-preview/browser-source-end-pan.mjs','tools/pages-preview/browser-environment.mjs'];\nconst helpers=helperPaths.map(path=>{\n const bytes=readFileSync(path),sha256=hash(bytes),inputs=build.inputs.filter(item=>item.path===path);\n assert.equal(inputs.length,1);assert.equal(inputs[0].bytes,bytes.length);assert.equal(inputs[0].sha256,sha256);\n return{path,bytes:bytes.length,sha256};\n});\nassert.equal(early.status,'completed');\nassert.equal(early.diagnosticOnly,true);\nassert.equal(early.releaseEligible,false);\nassert.equal(early.verified,false);\nassert.equal(early.performancePassed,true);\nassert.deepEqual(early.performanceIssues,[]);\nconst profiles=[{name:'android-portrait',mobile:true,engine:'tropnik-canvas'},{name:'desktop-webgl',mobile:false,engine:'tropnik-canvas'}];\nassert.deepEqual(early.profiles.map(item=>item.profile),profiles.map(item=>item.name));\nassert.deepEqual(full.siteSmoothness.map(item=>item.profile).sort(),profiles.map(item=>item.name).sort());\nfor(const [index,profile]of profiles.entries()){\n assertSmoothnessAudit(early.profiles[index],profile);\n const fullAudit=full.siteSmoothness.find(item=>item.profile===profile.name);\n assertSmoothnessAudit(fullAudit,profile);\n assert.equal(early.profiles[index].scenarios.length,8);\n assert.equal(fullAudit.scenarios.length,8);\n}\nassertBrowserReport(full,source,build.catalogue);\nassertMatchingBrowserEnvironments(early.environment,full.environment,source);\nconst envelope=report=>Object.fromEntries(['schemaVersion','status','sourceCommit','buildId','verified','diagnosticOnly','releaseEligible','performancePassed','performanceIssues','environment'].filter(key=>Object.hasOwn(report,key)).map(key=>[key,report[key]]));\nconst result={\n schemaVersion:1,evidence:'accepted-pages-raw-smoothness-extraction',extractionOnly:true,releaseEligible:false,newMeasurements:false,newBrowserRun:false,independentPNGDecoding:false,\n artifactSourceCommit:source,extractorSourceCommit:e.GITHUB_SHA,transport,members,\n build:{sourceCommit:build.sourceCommit,buildId:build.buildId,catalogue:build.catalogue},helpers,\n revalidation:{originalFullBrowserValidator:'passed',originalEarlyAndFullSmoothnessValidators:'passed',originalEnvironmentComparator:'passed'},\n early:{envelope:envelope(early),profiles:early.profiles},\n full:{envelope:envelope(full),siteSmoothness:full.siteSmoothness}\n};\nconst serialized=JSON.stringify(result);\nwriteFileSync(join(dir,'compact-evidence.json'),serialized+'\\n');\nconst width=12000,parts=Math.ceil(serialized.length/width),sha256=hash(serialized);\nconst header={schemaVersion:1,artifactSourceCommit:source,extractorSourceCommit:e.GITHUB_SHA,utf16CodeUnits:serialized.length,utf8Bytes:Buffer.byteLength(serialized,'utf8'),sha256,parts};\nconsole.log('TROPNIK_ACCEPTED_EVIDENCE_HEADER='+JSON.stringify(header));\nfor(let index=0;index<parts;index++)console.log('TROPNIK_ACCEPTED_EVIDENCE_CHUNK='+JSON.stringify({index,text:serialized.slice(index*width,(index+1)*width)}));\nconsole.log('TROPNIK_ACCEPTED_EVIDENCE_END='+JSON.stringify({parts,sha256}));\nNODE"
        },
        {
          "name": "Preserve the compact extraction receipt",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "tropnik-accepted-pages-evidence-${{ github.run_id }}",
            "path": "${{ runner.temp }}/tropnik-accepted-pages-evidence/compact-evidence.json\n${{ runner.temp }}/tropnik-accepted-pages-evidence/member-receipt.json\n${{ runner.temp }}/tropnik-accepted-pages-transport.json",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
