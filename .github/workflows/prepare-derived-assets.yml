name: Prepare derived assets without release acceptance

on:
  push:
    branches: [prepare/final-site-0.4.24]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-final-site-0.4.24
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'orewn/tropnik' && github.ref == 'refs/heads/prepare/final-site-0.4.24'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      prepared_commit: ${{ steps.prepare.outputs.prepared_commit }}
      prepared_tree: ${{ steps.prepare.outputs.prepared_tree }}
      source_commit: ${{ steps.prepare.outputs.source_commit }}
    steps:
      - name: Check out the immutable preparation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install frozen generator dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = '11.25.0'
          pnpm --dir web install --frozen-lockfile
          python3 -m venv "$RUNNER_TEMP/tropnik-python"
          "$RUNNER_TEMP/tropnik-python/bin/python" -m pip install --disable-pip-version-check -r tools/android-build/requirements.txt
          echo "$RUNNER_TEMP/tropnik-python/bin" >> "$GITHUB_PATH"
      - name: Regenerate, bind protected sources, and prepare a generated-only child commit
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          function allowedGeneratedPath(path) {
            const fixed = [
              "web/public/terrain/landscape.html",
              "android/app/src/main/assets/landscape/landscape.html",
              "android/app/src/main/assets/landscape/manifest.json",
              "web/public/offline-map/terrain/landscape.html",
              "web/public/offline-map/manifest.json",
              "web/public/sw.js"
            ];
            if (typeof path !== "string" || path.length > 512 || !/^[A-Za-z0-9_.-]+(?:\/[A-Za-z0-9_.-]+)*$/.test(path) || path.split("/").some(p => p === "." || p === "..")) return false;
            if (fixed.includes(path)) return true;
            return /^(?:web\/public\/custom-map|android\/app\/src\/main\/assets\/custom-map)\/.+\.(?:m?js|css|html|json|txt|woff2?)$/.test(path);
          }
          
          function preparationChanges(before, after) {
            function index(entries) {
              const result = new Map();
              for (const entry of entries) {
                if (result.has(entry.path)) throw new Error("Duplicate tree path: " + entry.path);
                result.set(entry.path, entry);
              }
              return result;
            }
            const old = index(before), current = index(after), changes = [];
            const paths = [...new Set([...old.keys(), ...current.keys()])].sort();
            for (const path of paths) {
              const a = old.get(path), b = current.get(path);
              if (a && b && a.sha === b.sha && a.mode === b.mode && a.type === b.type) continue;
              if (!allowedGeneratedPath(path)) throw new Error("Protected source changed: " + path);
              for (const entry of [a,b].filter(Boolean)) {
                if (entry.type !== "blob" || entry.mode !== "100644" || !/^[a-f0-9]{40}$/.test(entry.sha)) throw new Error("Generated file must be an ordinary tracked blob: " + path);
              }
              if (!b && !path.includes("/custom-map/")) throw new Error("Required generated file was removed: " + path);
              changes.push({path, before:a || null, after:b || null});
            }
            if (changes.length === 0 || changes.length > 128) throw new Error("Expected 1..128 generated-only changes");
            return changes;
          }
          
          await (async function prepareGeneratedCommit() {
            const assert = (await import("node:assert/strict")).default;
            const {execFileSync} = await import("node:child_process");
            const {readFileSync, writeFileSync, appendFileSync, lstatSync} = await import("node:fs");
            const {createHash} = await import("node:crypto");
            const {join} = await import("node:path");
            const repo = "orewn/tropnik", branch = "prepare/final-site-0.4.24", source = process.env.GITHUB_SHA;
            assert.equal(process.env.GITHUB_REPOSITORY, repo);
            assert.equal(process.env.GITHUB_REF, "refs/heads/" + branch);
            assert.match(source, /^[a-f0-9]{40}$/);
            assert.ok(process.env.GH_TOKEN);
            assert.match(process.env.GITHUB_RUN_ID, /^\d+$/);
            assert.match(process.env.GITHUB_RUN_ATTEMPT, /^\d+$/);
            const receiptPath = join(process.env.RUNNER_TEMP, "tropnik-derived-preparation.json");
            const receipt = {schemaVersion:1, preparationOnly:true, verified:false, releaseEligible:false, status:"running", repository:repo, branch, sourceCommit:source, workflowRunId:process.env.GITHUB_RUN_ID, workflowRunAttempt:process.env.GITHUB_RUN_ATTEMPT, requiredNext:"Move the candidate PR branch with an expected-head lease, then run every unchanged release acceptance workflow on preparedCommit."};
            const save = () => writeFileSync(receiptPath, JSON.stringify(receipt,null,2) + "\n");
            save();
            try {
              const git = args => execFileSync("git", args, {maxBuffer:128*1024*1024});
              const value = args => git(args).toString("utf8").trim();
              const sha256 = bytes => createHash("sha256").update(bytes).digest("hex");
              const blobSHA = bytes => createHash("sha1").update("blob " + bytes.length + "\0").update(bytes).digest("hex");
              assert.equal(value(["rev-parse","HEAD"]), source);
              assert.equal(value(["status","--porcelain=v1","--untracked-files=all"]), "", "Preparation must start from a pristine checkout");
              const sourceTree = value(["rev-parse", source + "^{tree}"]);
              const readTree = tree => git(["ls-tree","-rz","--full-tree",tree]).toString("utf8").split("\0").filter(Boolean).map(line => {
                const tab = line.indexOf("\t"), header = line.slice(0,tab).split(" ");
                assert.equal(header.length,3); assert.ok(tab > 0);
                return {path:line.slice(tab+1),mode:header[0],type:header[1],sha:header[2]};
              });
              const before = readTree(sourceTree);
              const commands = [
                [process.execPath, ["web/scripts/build-landscape.mjs"]],
                ["python", ["tools/android-build/prepare-landscape.py"]],
                [process.execPath, ["tools/android-build/prepare-custom-map.mjs"]],
                [process.execPath, ["web/scripts/prepare-offline.mjs"]],
                [process.execPath, ["web/scripts/stamp-service-worker.mjs"]]
              ];
              const runGenerators = () => {
                for (const [executable,args] of commands) execFileSync(executable,args,{stdio:"inherit",timeout:180000,env:{...process.env,GH_TOKEN:""}});
              };
              const stageGenerated = () => {
                assert.equal(value(["rev-parse","HEAD"]),source);
                // Rebuild every staging pass from the immutable source index; -u is deliberately absent.
                git(["read-tree",sourceTree]);
                const changed = git(["diff","--no-ext-diff","--no-renames","--name-only","-z",source]).toString("utf8").split("\0").filter(Boolean);
                const added = git(["ls-files","--others","--exclude-standard","-z"]).toString("utf8").split("\0").filter(Boolean);
                const paths = [...new Set([...changed,...added])].sort();
                assert.ok(paths.length > 0 && paths.length <= 128);
                for (const path of paths) {
                  assert.ok(allowedGeneratedPath(path), "Unreviewed output: " + path);
                  try {assert.ok(lstatSync(path).isFile(), "Generated output is not an ordinary file: " + path);}
                  catch (error) {if(error.code !== "ENOENT") throw error;}
                }
                git(["add","-A","--",...paths]);
                git(["diff","--cached","--check"]);
                assert.equal(value(["diff","--name-only"]), "", "Unstaged edits must not be omitted");
                assert.equal(value(["ls-files","--others","--exclude-standard"]), "", "Untracked edits must not be omitted");
                const tree = value(["write-tree"]);
                const after = readTree(tree), changes = preparationChanges(before,after);
                return {tree,after,changes};
              };
              runGenerators();
              const first = stageGenerated();
              runGenerators();
              const candidate = stageGenerated();
              assert.equal(candidate.tree, first.tree, "The complete generator chain must be idempotent");
              for (const [executable,args] of [
                [process.execPath,["tools/android-build/prepare-custom-map.mjs","--check"]],
                ["python",["tools/android-build/prepare-landscape.py","--check"]],
                [process.execPath,["web/scripts/verify-custom-map.mjs"]]
              ]) execFileSync(executable,args,{stdio:"inherit",timeout:180000,env:{...process.env,GH_TOKEN:""}});
              assert.equal(stageGenerated().tree, candidate.tree, "Check-only validation changed the prepared tree");
              const protectedEntries = entries => entries.filter(entry => !allowedGeneratedPath(entry.path)).sort((a,b)=>a.path<b.path?-1:a.path>b.path?1:0);
              const protectedBefore = protectedEntries(before), protectedAfter = protectedEntries(candidate.after);
              assert.deepEqual(protectedAfter, protectedBefore);
              receipt.sourceTree = sourceTree;
              receipt.preparedTree = candidate.tree;
              receipt.protectedSource = {entries:protectedBefore.length, sha256:sha256(JSON.stringify(protectedBefore)), unchanged:true};
              receipt.generatorCommands = commands.map(([executable,args])=>[executable === process.execPath ? "node" : executable,...args]);
              receipt.generatorChainIdempotent = true;
              receipt.checkOnlyVerifiersPassed = true;
              const changed = candidate.changes.map(change => {
                if (!change.after) return {path:change.path,status:"deleted",previousBlob:change.before.sha,blob:null,mode:"100644",bytes:0,sha256:null};
                const bytes = git(["cat-file","blob",change.after.sha]);
                assert.ok(bytes.length <= 64*1024*1024, "Generated file unexpectedly large");
                assert.equal(blobSHA(bytes),change.after.sha);
                return {path:change.path,status:change.before?"modified":"added",previousBlob:change.before?.sha || null,blob:change.after.sha,mode:"100644",bytes:bytes.length,sha256:sha256(bytes)};
              });
              assert.ok(changed.reduce((sum,file)=>sum+file.bytes,0) <= 128*1024*1024);
              receipt.changed = changed;
              save();
              const api = async (method,path,payload) => {
                const response = await fetch("https://api.github.com/repos/" + repo + path,{
                  method,headers:{"Authorization":"Bearer " + process.env.GH_TOKEN,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},
                  ...(payload === undefined ? {} : {body:JSON.stringify(payload)}),
                  signal:AbortSignal.timeout(30000)
                });
                if (!response.ok) throw new Error("GitHub Git Database " + method + " " + path + " returned " + response.status);
                return await response.json();
              };
              const readRefPath = "/git/ref/heads/" + branch, refPath = "/git/refs/heads/" + branch;
              const checkHead = async () => {
                const ref = await api("GET",readRefPath);
                assert.equal(ref.ref,"refs/heads/" + branch);
                assert.equal(ref.object.type,"commit");
                assert.equal(ref.object.sha,source,"Preparation branch moved; do not reuse this run");
              };
              await checkHead();
              const remoteSource = await api("GET","/git/commits/" + source);
              assert.equal(remoteSource.tree.sha,sourceTree);
              for (const file of changed) {
                if (file.blob === null) continue;
                const bytes = git(["cat-file","blob",file.blob]);
                const remote = await api("POST","/git/blobs",{content:bytes.toString("base64"),encoding:"base64"});
                assert.equal(remote.sha,file.blob,"Remote blob bytes differ");
              }
              const remoteTree = await api("POST","/git/trees",{base_tree:sourceTree,tree:changed.map(file=>({path:file.path,mode:file.mode,type:"blob",sha:file.blob}))});
              assert.equal(remoteTree.sha,candidate.tree,"Remote tree differs from the reviewed local generated-only tree");
              const commit = await api("POST","/git/commits",{message:"build: regenerate derived map and terrain assets\n\nPreparation only; full release acceptance is required on this new commit.\nSource: " + source + "\nWorkflow run: " + process.env.GITHUB_RUN_ID,tree:remoteTree.sha,parents:[source]});
              assert.deepEqual(commit.parents.map(parent=>parent.sha),[source]);
              assert.equal(commit.tree.sha,candidate.tree);
              assert.match(commit.sha,/^[a-f0-9]{40}$/);
              receipt.preparedCommit = commit.sha;
              receipt.status = "created-unreferenced";
              save();
              await checkHead();
              const updated = await api("PATCH",refPath,{sha:commit.sha,force:false});
              assert.equal(updated.ref,"refs/heads/" + branch);
              assert.equal(updated.object.sha,commit.sha);
              const observed = await api("GET",readRefPath);
              assert.equal(observed.object.sha,commit.sha);
              receipt.status = "prepared";
              receipt.refUpdate = {branch,expectedParent:source,observedCommit:observed.object.sha,force:false};
              save();
              console.log("TROPNIK_DERIVED_PREPARATION_MANIFEST=" + JSON.stringify(receipt));
              appendFileSync(process.env.GITHUB_OUTPUT,"prepared_commit=" + commit.sha + "\nprepared_tree=" + candidate.tree + "\nsource_commit=" + source + "\n");
              console.log(JSON.stringify({preparationOnly:true,verified:false,releaseEligible:false,sourceCommit:source,preparedCommit:commit.sha,preparedTree:candidate.tree,generatedFiles:changed.length,protectedSourceUnchanged:true}));
            } catch (error) {
              receipt.status = "failed"; receipt.error = String(error.message); save();
              console.log("TROPNIK_DERIVED_PREPARATION_MANIFEST=" + JSON.stringify(receipt));
              throw error;
            }
          })();
          NODE
      - name: Retain the preparation manifest without a release artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tropnik-derived-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tropnik-derived-preparation.json
          if-no-files-found: error
          retention-days: 7
