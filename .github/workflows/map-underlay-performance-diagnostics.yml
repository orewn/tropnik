name: Opaque detail underlay untraced UI performance diagnosis

on:
  push:
    branches: [diagnostics/opaque-detail-underlay-performance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-underlay-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui-performance:
    if: github.repository == 'orewn/tropnik'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install frozen dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = '11.25.0'
          pnpm --dir web install --frozen-lockfile
      - name: Check that the shared runtime is reproducible
        run: node tools/android-build/prepare-custom-map.mjs --check
      - name: Prepare the verified Android link and static diagnostic
        run: |
          node tools/pages-preview/fetch-apk.mjs
          node tools/pages-preview/build.mjs --base /tropnik/ --origin https://orewn.github.io
      - name: Verify native keyboard events and layout-shift attribution
        run: node --test tools/pages-preview/tests/browser-native-text.browser.mjs
      - name: Retain the exact production underlay pixel proof
        run: node --test tools/pages-preview/tests/browser-map-underlay.browser.mjs
      - name: Measure unchanged UI scenarios and limits without tracing
        env:
          TROPNIK_BROWSER_DIAGNOSTIC: ui-smoothness
        run: node tools/pages-preview/browser-smoke.mjs
      - name: Bind diagnostic source and preserve all performance issues
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          import {assertMatchingBrowserEnvironments} from './tools/pages-preview/browser-environment.mjs';
          const report=JSON.parse(readFileSync('web/pages-preview/dist/browser-ui-smoothness-diagnostic.json','utf8'));
          const pixels=JSON.parse(readFileSync('web/pages-preview/dist/browser-map-underlay-verification.json','utf8'));
          const build=JSON.parse(readFileSync('web/pages-preview/dist/build-info.json','utf8'));
          assert.equal(report.sourceCommit,process.env.GITHUB_SHA);
          assert.equal(build.sourceCommit,report.sourceCommit);
          assert.equal(report.status,'completed');
          assert.equal(report.diagnosticOnly,true);
          assert.equal(report.verified,false);
          assert.equal(report.releaseEligible,false);
          assert.deepEqual(report.profiles.map(profile=>profile.profile),['android-portrait','desktop-webgl']);
          for(const profile of report.profiles){
            assert.equal(profile.instrumented,false);
            assert.equal(profile.cpuSlowdownRate,1);
            assert.equal(profile.scenarios.length,8);
          }
          assert.equal(pixels.verified,true);
          assert.equal(pixels.sourceCommit,report.sourceCommit);
          assert.equal(pixels.rendererSHA256,createHash('sha256').update(readFileSync('web/lib/custom-map-engine.ts')).digest('hex'));
          assertMatchingBrowserEnvironments(pixels.environment,report.environment,report.sourceCommit);
          assert.equal(pixels.cases.reduce((total,item)=>total+item.frames.length,0),46);
          console.log(JSON.stringify({diagnosticOnly:true,releaseEligible:false,sourceCommit:report.sourceCommit,performancePassed:report.performancePassed,performanceIssues:report.performanceIssues}));
          NODE
      - name: Preserve the complete diagnostic and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tropnik-underlay-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/pages-preview/dist/build-info.json
            web/pages-preview/dist/browser-ui-smoothness-diagnostic.json
            web/pages-preview/dist/browser-native-text-verification.json
            web/pages-preview/dist/browser-map-underlay-verification.json
            web/pages-preview/dist/browser-network.json
            web/pages-preview/dist/browser-failure.*
            web/pages-preview/design-qa
          if-no-files-found: error
          retention-days: 7
