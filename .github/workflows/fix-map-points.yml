name: Tropnik 0.4.5 release gate

on:
  push:
    paths:
      - .github/workflows/fix-map-points.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install locked dependencies
        working-directory: web
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Apply release fixes
        run: |
          python3 scripts/fix-map-points.py
          python3 scripts/fix-map-callback.py
          python3 scripts/fix-offline-package.py
          python3 scripts/fix-overview-cache.py
          git diff --check
      - name: Run regression suite
        id: regression
        continue-on-error: true
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee ../release-tests.log
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-tests-log
          path: release-tests.log
          retention-days: 1
      - name: Enforce regression suite
        if: steps.regression.outcome != 'success'
        run: exit 1
      - name: Lint release-owned files strictly
        working-directory: web
        run: pnpm exec eslint --max-warnings=0 lib/map-coordinate.ts lib/offline-map.ts tests/map-coordinate.test.mjs
      - name: Build production release
        working-directory: web
        run: pnpm build
      - name: Commit verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release(web): v0.4.5 responsive route markers"
          git push origin HEAD:main
