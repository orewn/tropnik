name: Tropnik 0.4.5 release gate

on:
  push:
    paths:
      - .github/workflows/fix-map-points.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Apply map interaction and package integrity fixes
        run: |
          python3 scripts/fix-map-points.py
          python3 scripts/fix-offline-package.py
          git diff --check
      - name: Install locked dependencies
        working-directory: web
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Run full regression suite
        working-directory: web
        run: pnpm test
      - name: Run lint
        working-directory: web
        run: pnpm lint
      - name: Build production release
        working-directory: web
        run: pnpm build
      - name: Commit verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release(web): v0.4.5 responsive route markers"
          git push origin HEAD:main
