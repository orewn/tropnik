name: One-off map points repair

on:
  push:
    paths:
      - .github/workflows/fix-map-points.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair route markers, labels and selection performance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          helper = '''export type MapCenter = [number, number];
          type RegionHint = {center: [number, number]; bounds?: number[]};

          const distanceScore = (point: MapCenter, target: MapCenter) => {
            const latitudeScale = Math.cos(target[1] * Math.PI / 180);
            const dx = (point[0] - target[0]) * latitudeScale;
            const dy = point[1] - target[1];
            return dx * dx + dy * dy;
          };

          /**
           * Route imports historically arrived in both GeoJSON [lng, lat] and
           * human-facing [lat, lng] order. Resolve the point once at the map
           * boundary, preferring the selected territory when both candidates
           * happen to fall inside Russia.
           */
          export function resolveTrailCenter(
            center: readonly [number, number],
            isCovered: (lng: number, lat: number) => boolean,
            region?: RegionHint,
          ): MapCenter | undefined {
            const direct: MapCenter = [center[0], center[1]];
            const swapped: MapCenter = [center[1], center[0]];
            const candidates = [direct, swapped].filter(point =>
              Number.isFinite(point[0]) && Number.isFinite(point[1]) && isCovered(point[0], point[1]));
            if (!candidates.length) return undefined;
            if (candidates.length === 1) return candidates[0];
            if (!region) return direct;
            const insideBounds = (point: MapCenter) => !region.bounds ||
              (point[0] >= region.bounds[0] && point[0] <= region.bounds[2] &&
               point[1] >= region.bounds[1] && point[1] <= region.bounds[3]);
            const bounded = candidates.filter(insideBounds);
            const pool = bounded.length ? bounded : candidates;
            return pool.reduce((best, point) =>
              distanceScore(point, region.center) < distanceScore(best, region.center) ? point : best);
          }
          '''
          Path('web/lib/map-coordinate.ts').write_text(helper)

          replace_once('web/components/Atlas.tsx',
            "import {terrainExaggerationForZoom,terrainPitchForZoom} from '@/lib/map-camera-profile';\n",
            "import {terrainExaggerationForZoom,terrainPitchForZoom} from '@/lib/map-camera-profile';\nimport {resolveTrailCenter} from '@/lib/map-coordinate';\n")
          replace_once('web/components/Atlas.tsx',
            "const onRegionRef=useRef(onRegion),regionRef=useRef(region),trailRef=useRef(trail),viewportRef=useRef(onViewportRegion);",
            "const onRegionRef=useRef(onRegion),onTrailRef=useRef(onTrail),regionRef=useRef(region),trailRef=useRef(trail),viewportRef=useRef(onViewportRegion);")
          replace_once('web/components/Atlas.tsx',
            "onRegionRef.current=onRegion;regionRef.current=region;trailRef.current=trail;viewportRef.current=onViewportRegion;",
            "onRegionRef.current=onRegion;onTrailRef.current=onTrail;regionRef.current=region;trailRef.current=trail;viewportRef.current=onViewportRegion;")
          replace_once('web/components/Atlas.tsx',
            """   for(const t of visibleTrails){
    if(!t.center||!inRussiaCoverage(...t.center,coverage.area))continue;
    const button=document.createElement('button');button.type='button';button.className='trail-marker';button.setAttribute('aria-label',`Открыть маршрут ${t.title}`);
    const label=document.createElement('span');label.className='trail-marker-label';label.setAttribute('aria-hidden','true');label.textContent=t.title;button.appendChild(label);
    button.addEventListener('click',event=>{event.stopPropagation();onTrail?.(t);});
    routeMarkers.push(new ml.Marker({element:button,anchor:'center'}).setLngLat([russiaLongitude(t.center[0]),t.center[1]]).addTo(map));
   }
   requestAnimationFrame(()=>{if(!removed)updateDirections.current?.();});
  });
  return()=>{removed=true;routeMarkers.forEach(marker=>marker.remove());};
 },[visibleTrails,region?.id,loaded,onTrail]);""",
            """   for(const t of visibleTrails){
    if(!t.center)continue;
    const center=resolveTrailCenter(t.center,(lng,lat)=>inRussiaCoverage(lng,lat,coverage.area),regionRef.current);
    if(!center)continue;
    const button=document.createElement('button');button.type='button';button.className='trail-marker';button.setAttribute('aria-label',`Открыть маршрут ${t.title}`);
    const label=document.createElement('span');label.className='trail-marker-label';label.setAttribute('aria-hidden','true');label.textContent=t.title;button.appendChild(label);
    button.addEventListener('click',event=>{event.stopPropagation();requestAnimationFrame(()=>onTrailRef.current?.(t));});
    routeMarkers.push(new ml.Marker({element:button,anchor:'center'}).setLngLat([russiaLongitude(center[0]),center[1]]).addTo(map));
   }
   requestAnimationFrame(()=>{if(!removed)updateDirections.current?.();});
  });
  return()=>{removed=true;routeMarkers.forEach(marker=>marker.remove());};
 },[visibleTrails,region?.id,loaded]);""")
          replace_once('web/components/Atlas.tsx',
            """     const routeZoom=11;fullView.current=false;if(map.getSource('terrain-dem')){map.setTerrain({source:'terrain-dem',exaggeration:terrainExaggerationForZoom(routeZoom)});setTerrain(true);}
     const padding=container.current?russiaView(container.current).padding:80;
     map.fitBounds([[covered[0],covered[1]],[covered[2],covered[3]]],{padding,maxZoom:14,pitch:terrainPitchForZoom(routeZoom,true),bearing:-18,duration:window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:900});""",
            """     const routeZoom=11;fullView.current=false;
     const terrainActive=!!map.getTerrain();
     const padding=container.current?russiaView(container.current).padding:80;
     map.stop();
     map.fitBounds([[covered[0],covered[1]],[covered[2],covered[3]]],{padding,maxZoom:14,pitch:terrainActive?terrainPitchForZoom(routeZoom,true):0,bearing:terrainActive?-18:0,duration:window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:450});""")

          replace_once('web/components/Atlas2D.tsx',
            "import {constrainFramedCamera,MapFrameRefit,bindMapFrameRefit} from '@/lib/map-framing';\n",
            "import {constrainFramedCamera,MapFrameRefit,bindMapFrameRefit} from '@/lib/map-framing';\nimport {resolveTrailCenter} from '@/lib/map-coordinate';\n")
          replace_once('web/components/Atlas2D.tsx',
            """   for(const item of visibleTrails){
    if(!item.center||!inRussiaCoverage(...item.center,coverage.area))continue;
    const button=document.createElement('button');button.type='button';button.className='trail-marker';button.setAttribute('aria-label',`Открыть маршрут ${item.title}`);
    const label=document.createElement('span');label.className='trail-marker-label';label.setAttribute('aria-hidden','true');label.textContent=item.title;button.appendChild(label);
    button.addEventListener('click',event=>{event.stopPropagation();callbacks.current.onTrail?.(item);});
    const marker=L.marker([item.center[1],russiaLongitude(item.center[0])],{icon:L.divIcon({html:button,className:'leaflet-route-marker',iconSize:[32,32],iconAnchor:[16,16]}),keyboard:false});
    points.current?.addLayer(marker);
   }""",
            """   for(const item of visibleTrails){
    if(!item.center)continue;
    const center=resolveTrailCenter(item.center,(lng,lat)=>inRussiaCoverage(lng,lat,coverage.area),regionRef.current);
    if(!center)continue;
    const button=document.createElement('button');button.type='button';button.className='trail-marker';button.setAttribute('aria-label',`Открыть маршрут ${item.title}`);
    const label=document.createElement('span');label.className='trail-marker-label';label.setAttribute('aria-hidden','true');label.textContent=item.title;button.appendChild(label);
    button.addEventListener('click',event=>{event.stopPropagation();requestAnimationFrame(()=>callbacks.current.onTrail?.(item));});
    const marker=L.marker([center[1],russiaLongitude(center[0])],{icon:L.divIcon({html:button,className:'leaflet-route-marker',iconSize:[32,32],iconAnchor:[16,16]}),keyboard:false});
    points.current?.addLayer(marker);
   }""")

          style_path=Path('web/public/maps/tropa-style.json')
          style=json.loads(style_path.read_text())
          changed=0
          def rewrite(value):
              global changed
              if isinstance(value,list):
                  if (len(value)>=4 and value[0]=='coalesce' and value[1]==['get','name:ru']
                      and value[2]==['get','name:latin'] and value[3]==['get','name']):
                      value[2],value[3]=value[3],value[2]
                      changed+=1
                  for item in value: rewrite(item)
              elif isinstance(value,dict):
                  for item in value.values(): rewrite(item)
          rewrite(style)
          if changed < 5:
              raise SystemExit(f'Expected multiple label expressions, changed {changed}')
          style_path.write_text(json.dumps(style,ensure_ascii=False,indent=2)+'\n')

          test = '''import test from 'node:test';
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {resolveTrailCenter} from '../lib/map-coordinate.ts';

          const covered=(lng,lat)=>lng>=19&&lng<=191&&lat>=41&&lat<=82;

          test('keeps GeoJSON longitude-latitude order',()=>{
            assert.deepEqual(resolveTrailCenter([40.608,43.747],covered,{center:[40,44]}),[40.608,43.747]);
          });

          test('repairs imported latitude-longitude route points',()=>{
            assert.deepEqual(resolveTrailCenter([43.747,40.608],covered,{center:[40,44]}),[40.608,43.747]);
          });

          test('uses territory proximity when both orders are geographically possible',()=>{
            assert.deepEqual(resolveTrailCenter([55,60],covered,{center:[60,55],bounds:[56,52,64,58]}),[60,55]);
          });

          test('map labels prefer Russian then local name before Latin fallback',async()=>{
            const style=JSON.parse(await readFile(new URL('../public/maps/tropa-style.json',import.meta.url),'utf8'));
            const expressions=[];
            const walk=value=>{
              if(Array.isArray(value)){
                if(value[0]==='coalesce'&&value[1]?.[0]==='get'&&value[1]?.[1]==='name:ru')expressions.push(value);
                value.forEach(walk);
              }else if(value&&typeof value==='object')Object.values(value).forEach(walk);
            };
            walk(style);
            assert.ok(expressions.length>=5);
            for(const expression of expressions){
              const local=expression.findIndex(value=>Array.isArray(value)&&value[1]==='name');
              const latin=expression.findIndex(value=>Array.isArray(value)&&value[1]==='name:latin');
              if(latin>=0)assert.ok(local>0&&local<latin);
            }
          });
          '''
          Path('web/tests/map-coordinate.test.mjs').write_text(test)

          Path('.github/workflows/fix-map-points.yml').unlink()
          PY

      - name: Install and verify web application
        shell: bash
        run: |
          cd web
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm test
          pnpm lint
          pnpm build

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(map): keep route points on land and remove click lag"
          git push origin HEAD:main
