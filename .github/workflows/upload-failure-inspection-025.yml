name: Inspect exact Android and Pages upload failures

on:
  push:
    branches: [diagnostics/upload-failure-inspection-025]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: upload-failure-inspection-025
  cancel-in-progress: false

jobs:
  inspect:
    name: Read exact upload job metadata and bounded error context
    if: github.repository == 'orewn/tropnik' && github.ref == 'refs/heads/diagnostics/upload-failure-inspection-025'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect original jobs without builds, uploads or reruns
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, socket, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          REPO = "orewn/tropnik"
          REPOSITORY_ID = 1447843944
          API = "https://api.github.com/repos/" + REPO + "/"
          TOKEN = os.environ["GH_TOKEN"]
          DEADLINE = time.monotonic() + 210
          JSON_LIMIT = 2 * 1024 * 1024
          TAIL_BYTES = 512 * 1024
          TARGETS = [
              {"label": "android-main-025-attempt1", "run": 43093581429, "attempt": 1, "job": 130779797114,
               "head": "b705c20378c7d5cab7a0eaccbd6b59158c7291d0"},
              {"label": "pages-f7-attempt2", "run": 43090337179, "attempt": 2, "job": 130775710983,
               "head": "f7c2e3738dd4df471da5cd81d4a6f40b3f194372"},
          ]
          HEADERS = {"Authorization": "Bearer " + TOKEN, "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "Tropnik-upload-read-only-inspection"}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def remaining_timeout():
              remaining = DEADLINE - time.monotonic()
              if remaining <= 0:
                  raise TimeoutError("Inspection deadline")
              return min(10, remaining)

          def clean(value):
              value = str(value).replace(TOKEN, "[REDACTED_TOKEN]")
              value = re.sub(r"(?i)(authorization\s*[:=]\s*)(?:bearer\s+)?[^\s,;]+", r"\1[REDACTED]", value)
              value = re.sub(r"\b(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)\b", "[REDACTED_TOKEN]", value)
              value = re.sub(r"(?im)(\b[A-Z0-9_]*(?:TOKEN|SECRET|PASSWORD|CREDENTIAL)[A-Z0-9_]*\s*[:=]\s*)[^\r\n]+", r"\1[REDACTED]", value)
              value = re.sub(r"(?i)\bbearer\s+[A-Za-z0-9_.~-]+", "Bearer [REDACTED]", value)
              def public_url(match):
                  try:
                      url = urllib.parse.urlsplit(match.group(0))
                      return urllib.parse.urlunsplit((url.scheme, url.hostname or "", url.path, "", ""))
                  except ValueError:
                      return "[REDACTED_URL]"
              return re.sub(r"https?://[^\s<>\"']+", public_url, value)

          def safe(value):
              if isinstance(value, str):
                  return clean(value)
              if isinstance(value, list):
                  return [safe(item) for item in value]
              if isinstance(value, dict):
                  return {key: safe(item) for key, item in value.items()}
              return value

          def emit(kind, value):
              print(kind + "=" + json.dumps(safe(value), ensure_ascii=False, separators=(",", ":")), flush=True)

          def get(path):
              assert not path.startswith("/") and "://" not in path, "Non-API resource"
              request = urllib.request.Request(API + path, headers=HEADERS, method="GET")
              with opener.open(request, timeout=remaining_timeout()) as response:
                  payload = response.read(JSON_LIMIT + 1)
              if len(payload) > JSON_LIMIT:
                  raise ValueError("API JSON exceeds the explicit bound")
              return json.loads(payload)

          def unavailable(error):
              # HTTPError strings contain URLs; never print them or response bodies.
              result = {"available": False, "errorType": type(error).__name__}
              if isinstance(error, urllib.error.HTTPError):
                  result["httpStatus"] = error.code
              return result

          def snapshot(target):
              run = get(f"actions/runs/{target['run']}/attempts/{target['attempt']}")
              jobs = get(f"actions/runs/{target['run']}/attempts/{target['attempt']}/jobs?per_page=100")
              job = get(f"actions/jobs/{target['job']}")
              assert run["id"] == target["run"] and run["run_attempt"] == target["attempt"]
              assert run["head_sha"] == target["head"] and run["head_branch"] == "main"
              assert run["repository"]["id"] == REPOSITORY_ID and run["repository"]["full_name"] == REPO
              members = [item for item in jobs["jobs"] if item["id"] == target["job"]]
              assert len(members) == 1, "Job does not belong to the pinned attempt"
              assert job["id"] == target["job"] and job["run_id"] == target["run"] and job["head_sha"] == target["head"]
              assert members[0]["run_id"] == target["run"] and members[0]["head_sha"] == target["head"]
              if "run_attempt" in job:
                  assert job["run_attempt"] == target["attempt"]
              check_url = job["check_run_url"]
              check_match = re.fullmatch(re.escape(API) + r"check-runs/(\d+)", check_url)
              assert check_match, "Unexpected check-run resource"
              check_id = int(check_match.group(1))
              check, output, annotations = {"id": check_id}, {}, []
              check_read, annotation_read = {"available": False}, {"available": False}
              try:
                  check = get(f"check-runs/{check_id}")
                  assert check["id"] == check_id and check["head_sha"] == target["head"]
                  assert check["name"] == job["name"] and check["app"]["slug"] == "github-actions"
                  output = check.get("output") or {}
                  check_read = {"available": True}
              except AssertionError:
                  raise
              except Exception as error:
                  check_read = unavailable(error)
              if check_read["available"]:
                  try:
                      annotations = get(f"check-runs/{check_id}/annotations?per_page=100")
                      if not isinstance(annotations, list):
                          raise ValueError("Invalid annotation response")
                      annotation_read = {"available": True}
                  except Exception as error:
                      annotations = []
                      annotation_read = unavailable(error)
              keep = ("path", "start_line", "end_line", "annotation_level", "title", "message", "raw_details")
              selected = [{key: item.get(key) for key in keep} for item in annotations[:20]]
              for item in selected:
                  for key in ("title", "message", "raw_details"):
                      if isinstance(item.get(key), str) and len(item[key]) > 4000:
                          item[key] = item[key][:4000] + " [explicitly truncated at 4000 characters]"
              return {
                  "source": target,
                  "run": {key: run.get(key) for key in ("id", "run_attempt", "head_sha", "head_branch", "status", "conclusion", "created_at", "updated_at")},
                  "job": {key: job.get(key) for key in ("id", "run_id", "run_attempt", "head_sha", "name", "status", "conclusion", "started_at", "completed_at")},
                  "steps": [{key: step.get(key) for key in ("number", "name", "status", "conclusion", "started_at", "completed_at")} for step in job.get("steps", [])],
                  "check": {key: check.get(key) for key in ("id", "head_sha", "status", "conclusion", "started_at", "completed_at")},
                  "checkRead": check_read, "annotationRead": annotation_read,
                  "checkOutputExplicitlyTruncatedFields": [key for key in ("title", "summary", "text") if isinstance(output.get(key), str) and len(output[key]) > 8000],
                  "checkOutput": {key: (output.get(key)[:8000] if isinstance(output.get(key), str) else output.get(key)) for key in ("title", "summary", "text", "annotations_count")},
                  "annotations": selected, "annotationsPageCount": len(annotations),
                  "annotationsReportedCount": output.get("annotations_count"),
                  "annotationsExplicitlyTruncated": len(annotations) > 20 or (output.get("annotations_count") or 0) > len(annotations),
              }

          def log_tail(target):
              request = urllib.request.Request(API + f"actions/jobs/{target['job']}/logs", headers=HEADERS, method="GET")
              try:
                  response = opener.open(request, timeout=remaining_timeout())
              except urllib.error.HTTPError as error:
                  if error.code not in (301, 302, 303, 307, 308):
                      return unavailable(error)
                  location = error.headers.get("Location", "")
                  error.close()
                  parsed = urllib.parse.urlsplit(location)
                  host = parsed.hostname or ""
                  trusted = host.endswith(".blob.core.windows.net") or host.endswith(".githubusercontent.com") or host == "github.com"
                  if parsed.scheme != "https" or not trusted or parsed.username or parsed.password:
                      return {"available": False, "errorType": "UnrecognizedLogRedirect"}
                  # No authorization header crosses the API origin. Signed queries stay private.
                  public_headers = {"User-Agent": HEADERS["User-Agent"], "Range": f"bytes=-{TAIL_BYTES}", "Accept-Encoding": "identity"}
                  response = opener.open(urllib.request.Request(location, headers=public_headers, method="GET"), timeout=remaining_timeout())
              with response:
                  status = response.status
                  encoding = response.headers.get("Content-Encoding", "identity").lower()
                  content_range = response.headers.get("Content-Range", "")
                  length = response.headers.get("Content-Length")
                  if encoding not in ("", "identity"):
                      return {"available": False, "errorType": "EncodedLogTailUnsupported", "httpStatus": status}
                  if status == 206:
                      match = re.fullmatch(r"bytes (\d+)-(\d+)/(\d+)", content_range)
                      if not match or int(match.group(2)) != int(match.group(3)) - 1:
                          return {"available": False, "errorType": "ResponseIsNotTheLogTail", "httpStatus": status}
                      start, total = int(match.group(1)), int(match.group(3))
                  elif status == 200:
                      if length is not None and int(length) > TAIL_BYTES:
                          return {"available": False, "errorType": "RangeIgnoredLogTooLarge", "httpStatus": status, "reportedBytes": int(length)}
                      start, total = 0, int(length) if length is not None else None
                  else:
                      return {"available": False, "errorType": "UnexpectedLogStatus", "httpStatus": status}
                  payload = response.read(TAIL_BYTES + 1)
              if len(payload) > TAIL_BYTES:
                  return {"available": False, "errorType": "LogBodyExceedsTailBound", "httpStatus": status}
              text = payload.decode("utf-8", "replace")
              if start:
                  text = text.partition("\n")[2]
              lines = text.splitlines()
              marker = re.compile(r"upload-artifact|artifact upload|upload.*artifact|artifact.*upload|##\[error\]|\bError:|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENOSPC|non-retryable|retry limit", re.I)
              hits = [index for index, line in enumerate(lines) if marker.search(line)]
              indices = sorted({near for index in hits for near in range(max(0, index - 3), min(len(lines), index + 7))})
              chosen, emitted_bytes = [], 0
              for index in indices:
                  line = clean(lines[index])
                  if len(line) > 1600:
                      line = line[:1600] + " [explicitly truncated at 1600 characters]"
                  size = len(line.encode("utf-8"))
                  if len(chosen) >= 140 or emitted_bytes + size > 48 * 1024:
                      break
                  chosen.append({"tailLine": index + 1, "text": line})
                  emitted_bytes += size
              return {"available": True, "scope": "bounded original job-log tail", "httpStatus": status,
                      "tailBytesRead": len(payload), "totalLogBytes": total, "tailStartByte": start,
                      "matchingLines": len(hits), "contextLines": chosen,
                      "contextExplicitlyTruncated": len(chosen) < len(indices),
                      "noMarkerDoesNotEstablishNoFailure": True}

          results = []
          for target in TARGETS:
              item = {"target": target, "observations": [], "logs": []}
              for attempt in range(2):
                  try:
                      observed = snapshot(target)
                  except Exception as error:
                      item["metadataError"] = unavailable(error)
                      if isinstance(error, AssertionError):
                          emit("TROPNIK_UPLOAD_INSPECTION_SOURCE_REJECTED", {"target": target, "errorType": "SourceIdentityMismatch"})
                          raise SystemExit(1)
                      break
                  item["observations"].append(observed)
                  emit("TROPNIK_UPLOAD_JOB_METADATA", observed)
                  try:
                      logs = log_tail(target)
                  except Exception as error:
                      logs = unavailable(error)
                  item["logs"].append(logs)
                  emit("TROPNIK_UPLOAD_LOG_CONTEXT", {"source": target, "readAttempt": attempt + 1, **logs})
                  if logs.get("available") or attempt == 1 or DEADLINE - time.monotonic() < 20:
                      break
                  time.sleep(3)
              results.append(item)
          result = {"schemaVersion": 1, "diagnosticOnly": True, "releaseEligible": False,
                    "controllerCommit": os.environ.get("GITHUB_SHA"), "method": "GET only; no checkout, build, application, upload or retry API",
                    "limits": {"readsPerJob": 2, "httpTimeoutSeconds": 10, "requestStartDeadlineSeconds": 210, "logTailBytes": TAIL_BYTES},
                    "causeNotInferredFromMissingAnnotationsOrUnpublishedLogs": True,
                    "targets": [{"source": item["target"], "metadataObservations": len(item["observations"]),
                                 "metadataError": item.get("metadataError"),
                                 "jobStatus": item["observations"][-1]["job"]["status"] if item["observations"] else None,
                                 "jobConclusion": item["observations"][-1]["job"]["conclusion"] if item["observations"] else None,
                                 "logAvailable": any(log.get("available") for log in item["logs"]),
                                 "logErrors": [log for log in item["logs"] if not log.get("available")]} for item in results]}
          emit("TROPNIK_UPLOAD_INSPECTION_RESULT", result)
          summary = "# Read-only upload failure inspection\n\n"
          summary += "Pinned original runs/attempts/jobs only. Missing annotations or unpublished logs do not establish a cause.\n\n"
          summary += "~~~json\n" + json.dumps(safe(result), ensure_ascii=False, indent=2) + "\n~~~\n"
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
          PY
