name: Fix Android map effect formatting

on:
  push:
    branches: [fix/map-label-viewport-20261107]
    paths:
      - '.github/workflows/fix-android-map-format.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/map-label-viewport-20261107
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize the position effect formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/java/ru/tropa/app/ui/TropaMap.kt')
          lines = path.read_text().splitlines()
          effect = lines.index('    LaunchedEffect(map, styleRevision, displayArea, position) {')
          start = next(i for i in range(effect + 1, len(lines))
                       if lines[i] == '        withContext(Dispatchers.Main.immediate) {')
          box = lines.index('    Box(modifier.background(Palette.Water)) {', start)
          replacement = [
              '        withContext(Dispatchers.Main.immediate) {',
              '            val ready = position as? PositionState.Ready',
              '            val inside = ready?.fix?.let { area.contains(it.longitude, it.latitude) } == true',
              '            nativeMap.style?.getSourceAs<GeoJsonSource>("position")?.setGeoJson(',
              '                points(if (inside) ready?.fix?.let { listOf(it.longitude to it.latitude) }.orEmpty() else emptyList()))',
              '            scopeNotice = if (ready != null && !inside) "Геопозиция получена. Точка находится вне области карты России." else null',
              '            if (ready != null && inside && lastPositionTime != ready.fix.measuredAt) {',
              '                lastPositionTime = ready.fix.measuredAt',
              '                nativeMap.animateCamera(CameraUpdateFactory.newLatLngZoom(LatLng(ready.fix.latitude, area.cameraLongitude(ready.fix.longitude)), 11.0), 500)',
              '            }',
              '        }',
              '    }',
              '',
          ]
          lines[start:box] = replacement
          text = '\n'.join(lines) + '\n'
          if text.count('LaunchedEffect(map, styleRevision, displayArea, position) {') != 1:
              raise SystemExit('Position effect count changed unexpectedly')
          if '\n        withContext(Dispatchers.Main.immediate) {\n            val ready = position as? PositionState.Ready' not in text:
              raise SystemExit('Position effect formatting was not applied')
          path.write_text(text)
          PY
          git diff --check
          sed -n '242,266p' android/app/src/main/java/ru/tropa/app/ui/TropaMap.kt

      - name: Commit normalized source only
        run: |
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | awk '{print $2}')" = 'android/app/src/main/java/ru/tropa/app/ui/TropaMap.kt'
          git config user.name 'tropnik-release-bot'
          git config user.email '38781694+orewn@users.noreply.github.com'
          git add android/app/src/main/java/ru/tropa/app/ui/TropaMap.kt
          git commit -m 'Format Android position map effect'
          git push origin HEAD:fix/map-label-viewport-20261107
