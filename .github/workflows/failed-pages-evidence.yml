{
  "name": "Read failed Pages raw evidence without new measurements",
  "on": {
    "push": {
      "branches": [
        "verify/failed-pages-evidence-20261113"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "tropnik-failed-pages-evidence-20261113",
    "cancel-in-progress": false
  },
  "jobs": {
    "extract": {
      "if": "github.repository == 'orewn/tropnik' && github.ref == 'refs/heads/verify/failed-pages-evidence-20261113'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "env": {
        "EVIDENCE_SOURCE": "f0c489e956c7cbf9164a49d80521e2486b9ad18c",
        "EVIDENCE_BUILD": "39a9a382cb37a4fb",
        "EVIDENCE_RUN": "43458536389",
        "EVIDENCE_ATTEMPT": "1",
        "EVIDENCE_JOB": "131998995441",
        "EVIDENCE_ARTIFACT": "14056958350",
        "EVIDENCE_NAME": "tropnik-pages-browser-failure-1",
        "EVIDENCE_BYTES": "2477913",
        "EVIDENCE_SHA256": "6eafe72296e2fb10ddb65852d3579186ca6193fe39bebbd4a847fbda40d3b5bb"
      },
      "steps": [
        {
          "name": "Check out the exact failed source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "f0c489e956c7cbf9164a49d80521e2486b9ad18c",
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24",
            "package-manager-cache": false
          }
        },
        {
          "name": "Bind the original failed run and immutable failure artifact",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "node --input-type=module <<'NODE'\nconst {default:assert}=await import('node:assert/strict');\nconst {writeFileSync}=await import('node:fs');\nconst {join}=await import('node:path');\nconst {execFileSync}=await import('node:child_process');\nconst e=process.env,repo='orewn/tropnik',source=e.EVIDENCE_SOURCE;\nassert.equal(e.GITHUB_REPOSITORY,repo);\nassert.equal(e.GITHUB_REF,'refs/heads/verify/failed-pages-evidence-20261113');\nassert.match(source,/^[a-f0-9]{40}$/);\nassert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),source);\nconst get=async path=>{\n  const response=await fetch('https://api.github.com/repos/'+repo+path,{\n    headers:{Authorization:'Bearer '+e.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},\n    signal:AbortSignal.timeout(30000)\n  });\n  assert.equal(response.status,200,'GitHub metadata read failed: '+path);\n  return await response.json();\n};\nconst [run,artifact]=await Promise.all([get('/actions/runs/'+e.EVIDENCE_RUN),get('/actions/artifacts/'+e.EVIDENCE_ARTIFACT)]);\nassert.equal(run.id,Number(e.EVIDENCE_RUN));\nassert.equal(run.run_attempt,Number(e.EVIDENCE_ATTEMPT));\nassert.equal(run.path,'.github/workflows/pages.yml');\nassert.equal(run.event,'push');\nassert.equal(run.head_branch,'main');\nassert.equal(run.head_sha,source);\nassert.equal(run.status,'completed');\nassert.equal(run.conclusion,'failure');\nassert.equal(run.repository.full_name,repo);\nconst jobs=await get('/actions/runs/'+e.EVIDENCE_RUN+'/jobs?per_page=100');\nconst buildJob=jobs.jobs.find(job=>job.id===Number(e.EVIDENCE_JOB));\nassert.ok(buildJob);assert.equal(buildJob.name,'build');assert.equal(buildJob.head_sha,source);\nassert.equal(buildJob.status,'completed');assert.equal(buildJob.conclusion,'failure');\nassert.deepEqual(buildJob.steps.filter(step=>step.conclusion==='failure').map(step=>step.number),[30]);\nassert.ok(jobs.jobs.some(job=>job.name==='deploy'&&job.conclusion==='skipped'));\nassert.equal(artifact.id,Number(e.EVIDENCE_ARTIFACT));\nassert.equal(artifact.name,e.EVIDENCE_NAME);\nassert.equal(artifact.size_in_bytes,Number(e.EVIDENCE_BYTES));\nassert.equal(artifact.digest,'sha256:'+e.EVIDENCE_SHA256);\nassert.equal(artifact.expired,false);\nassert.equal(artifact.workflow_run.id,run.id);\nassert.equal(artifact.workflow_run.head_sha,source);\nassert.equal(artifact.workflow_run.head_branch,'main');\nconst receipt={\n schemaVersion:1,evidence:'failed-pages-artifact-read-only',releaseEligible:false,\n extractor:{sourceCommit:e.GITHUB_SHA,runId:Number(e.GITHUB_RUN_ID),attempt:Number(e.GITHUB_RUN_ATTEMPT)},\n artifactSourceCommit:source,expectedBuildId:e.EVIDENCE_BUILD,\n run:{id:run.id,attempt:run.run_attempt,path:run.path,event:run.event,headBranch:run.head_branch,headSha:run.head_sha,status:run.status,conclusion:run.conclusion,url:run.html_url},\n artifact:{id:artifact.id,name:artifact.name,bytes:artifact.size_in_bytes,sha256:e.EVIDENCE_SHA256,expired:artifact.expired,workflowRun:artifact.workflow_run},\n noNewMeasurements:true,noBrowserRun:true,observedAt:new Date().toISOString()\n};\nassert.notEqual(receipt.extractor.runId,receipt.run.id);\nwriteFileSync(join(e.RUNNER_TEMP,'tropnik-failed-pages-transport.json'),JSON.stringify(receipt,null,2)+'\\n');\nconsole.log(JSON.stringify({artifactSourceCommit:source,failedRun:run.id,artifact:artifact.id,metadataVerified:true}));\nNODE"
        },
        {
          "name": "Download the original failure ZIP once",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "artifact-ids": "14056958350",
            "run-id": "43458536389",
            "repository": "orewn/tropnik",
            "github-token": "${{ github.token }}",
            "path": "${{ runner.temp }}/tropnik-failed-pages-zip",
            "digest-mismatch": "error",
            "skip-decompress": true
          }
        },
        {
          "name": "Verify original ZIP bytes and read only four JSON members",
          "run": "python3 - <<'PY'\nimport hashlib,json,os,pathlib,stat,zipfile\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])\ndownloads=root/'tropnik-failed-pages-zip'\nassert downloads.is_dir()\nentries=list(downloads.rglob('*'))\nassert len(entries)<=16 and all(not p.is_symlink() for p in entries)\nfiles=[p for p in entries if p.is_file()]\nassert len(files)==1, 'Expected one original artifact ZIP'\narchive=files[0]\nassert stat.S_ISREG(archive.stat().st_mode)\ndef digest(path):\n    value=hashlib.sha256()\n    with path.open('rb') as stream:\n        for block in iter(lambda:stream.read(1024*1024),b''):\n            value.update(block)\n    return value.hexdigest()\nassert archive.stat().st_size==int(os.environ['EVIDENCE_BYTES'])\nassert digest(archive)==os.environ['EVIDENCE_SHA256']\noutput=root/'tropnik-failed-pages-evidence'\noutput.mkdir(exist_ok=False)\nwanted={'browser-failure.json':32*1024*1024,'browser-ui-smoothness-diagnostic.json':2*1024*1024,'browser-map-loading-verification.json':4*1024*1024,'browser-service-worker-update-verification.json':4*1024*1024}\nrecords={}\nseen=set()\nlisting=[]\nwith zipfile.ZipFile(archive) as source:\n    members=source.infolist()\n    assert len(members)==15, 'Unexpected original failure artifact shape'\n    assert sum(member.file_size for member in members)<=64*1024*1024\n    for member in members:\n        name=member.filename\n        path=pathlib.PurePosixPath(name)\n        assert name and '\\\\' not in name and '\\x00' not in name\n        assert not path.is_absolute() and path.parts==(name,) and name not in ('.','..')\n        assert name not in seen and not member.is_dir() and not (member.flag_bits&1)\n        assert (member.external_attr>>16)&0o170000 in (0,stat.S_IFREG)\n        seen.add(name)\n        listing.append({'path':name,'bytes':member.file_size})\n        if name not in wanted:\n            continue\n        assert 0<member.file_size<=wanted[name]\n        with source.open(member) as stream:\n            data=stream.read(member.file_size+1)\n        assert len(data)==member.file_size\n        (output/name).write_bytes(data)\n        records[name]={'path':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}\nassert set(records)==set(wanted)\nreceipt={'schemaVersion':1,'archive':{'bytes':archive.stat().st_size,'sha256':digest(archive)},'members':records,'zipMembers':listing,'extractedFiles':sorted(records),'noOtherMembersExtracted':True}\n(output/'member-receipt.json').write_text(json.dumps(receipt,indent=2)+'\\n',encoding='utf-8')\nprint(json.dumps({'originalZipVerified':True,'selectedJsonMembers':len(records),'zipMembers':len(seen)}))\nPY"
        },
        {
          "name": "Recompute the original raw windows while preserving the full release failure",
          "run": "node --input-type=module <<'NODE'\nconst {default:assert}=await import('node:assert/strict');\nconst {readFileSync,writeFileSync}=await import('node:fs');\nconst {join}=await import('node:path');\nconst {createHash}=await import('node:crypto');\nconst {assertSmoothnessAudit,smoothnessIssues}=await import('./tools/pages-preview/browser-smoothness.mjs');\nconst {assertMatchingBrowserEnvironments}=await import('./tools/pages-preview/browser-environment.mjs');\nconst e=process.env,source=e.EVIDENCE_SOURCE,dir=join(e.RUNNER_TEMP,'tropnik-failed-pages-evidence');\nconst hash=value=>createHash('sha256').update(value).digest('hex');\nconst transport=JSON.parse(readFileSync(join(e.RUNNER_TEMP,'tropnik-failed-pages-transport.json'),'utf8'));\nconst members=JSON.parse(readFileSync(join(dir,'member-receipt.json'),'utf8'));\nconst read=name=>{\n const bytes=readFileSync(join(dir,name)),record=members.members[name];\n assert.equal(bytes.length,record.bytes);assert.equal(hash(bytes),record.sha256);\n return JSON.parse(bytes.toString('utf8'));\n};\nconst early=read('browser-ui-smoothness-diagnostic.json'),failure=read('browser-failure.json');\nconst loading=read('browser-map-loading-verification.json'),worker=read('browser-service-worker-update-verification.json');\nassert.equal(early.sourceCommit,source);\nassert.equal(failure.environment.sourceCommit,source);\nif(Object.hasOwn(failure,'sourceCommit'))assert.equal(failure.sourceCommit,source);\nassertMatchingBrowserEnvironments(early.environment,failure.environment,source);\nconst focusedSources=[];\nfor(const [name,report]of [['loading',loading],['serviceWorker',worker]]){\n assert.equal(report.sourceCommit,source);assert.equal(report.buildId,e.EVIDENCE_BUILD);assert.equal(report.verified,true);\n assertMatchingBrowserEnvironments(report.environment,failure.environment,source);\n const sources=Object.entries(report.sources);\n assert.ok(sources.length>0&&sources.length<=32);\n for(const [path,expected]of sources){\n  assert.ok(typeof path==='string'&&!path.includes('\\\\')&&!path.startsWith('/')&&path.split('/').every(part=>part&&part!=='.'&&part!=='..'));\n  assert.match(expected,/^[a-f0-9]{64}$/);\n  const bytes=readFileSync(path),sha256=hash(bytes);assert.equal(sha256,expected);\n  focusedSources.push({receipt:name,path,bytes:bytes.length,sha256});\n }\n}\nconst helperPaths=['tools/pages-preview/browser-smoothness.mjs','tools/pages-preview/browser-source-end-pan.mjs','tools/pages-preview/browser-environment.mjs','tools/pages-preview/browser-smoke.mjs'];\nconst helpers=helperPaths.map(path=>{const bytes=readFileSync(path);return{path,bytes:bytes.length,sha256:hash(bytes)};});\nassert.equal(early.status,'completed');assert.equal(early.diagnostic,'ui-smoothness');\nassert.equal(early.diagnosticOnly,true);assert.equal(early.verified,false);assert.equal(early.releaseEligible,false);\nassert.equal(early.performancePassed,true);assert.deepEqual(early.performanceIssues,[]);\nconst profiles=[{name:'android-portrait',mobile:true,engine:'tropnik-canvas'},{name:'desktop-webgl',mobile:false,engine:'tropnik-canvas'}];\nassert.deepEqual(early.profiles.map(audit=>audit.profile),profiles.map(profile=>profile.name));\nassert.deepEqual(failure.completedSiteSmoothness.map(audit=>audit.profile).sort(),profiles.map(profile=>profile.name).sort());\nconst expectedIssues=[{profile:'desktop-webgl',phase:'ui-smoothness/map-pan',metric:'frameP95Ms',value:35,limit:35}];\nassert.deepEqual(failure.performanceIssues,expectedIssues);\nassert.match(failure.error,/Rendering exceeded the unchanged CLS\\/long-task budgets/);\nconst windows=[];\nfor(const profile of profiles){\n const earlyAudit=early.profiles.find(audit=>audit.profile===profile.name),fullAudit=failure.completedSiteSmoothness.find(audit=>audit.profile===profile.name);\n for(const [phase,audit]of [['early',earlyAudit],['full',fullAudit]]){\n  assert.equal(audit.cpuSlowdownRate,1);assert.equal(audit.cpuThrottleRestored,true);\n  assert.equal(audit.instrumented,false);assert.deepEqual(audit.traces,[]);\n  assert.equal(audit.scenarios.length,8);\n  assertSmoothnessAudit(audit,profile,{release:phase==='early'});\n  for(const scenario of audit.scenarios)windows.push({phase,profile:profile.name,scenario:scenario.name,issues:smoothnessIssues(scenario,profile)});\n }\n if(profile.mobile){\n  assertSmoothnessAudit(fullAudit,profile);\n  assert.equal(fullAudit.performancePassed,true);assert.deepEqual(fullAudit.performanceIssues,[]);\n }else{\n  assert.equal(fullAudit.performancePassed,false);assert.deepEqual(fullAudit.performanceIssues,expectedIssues);\n  assert.throws(()=>assertSmoothnessAudit(fullAudit,profile),/UI smoothness budget failed/);\n }\n}\nassert.deepEqual(failure.completedSiteSmoothness.flatMap(audit=>audit.performanceIssues),expectedIssues);\nassert.equal(windows.length,32);assert.equal(windows.filter(window=>window.issues.length===0).length,31);\nassert.deepEqual(windows.filter(window=>window.issues.length),[{phase:'full',profile:'desktop-webgl',scenario:'map-pan',issues:expectedIssues}]);\nconst envelope=report=>Object.fromEntries(['schemaVersion','status','sourceCommit','buildId','verified','diagnosticOnly','releaseEligible','performancePassed','performanceIssues','environment'].filter(key=>Object.hasOwn(report,key)).map(key=>[key,report[key]]));\nconst result={\n schemaVersion:1,evidence:'failed-pages-raw-smoothness-extraction',verified:false,releaseEligible:false,extractionOnly:true,newMeasurements:false,newBrowserRun:false,independentPNGDecoding:false,originalRunConclusion:'failure',\n artifactSourceCommit:source,extractorSourceCommit:e.GITHUB_SHA,transport,members,helpers,focusedSources,\n buildBinding:{sourceCommit:source,buildId:e.EVIDENCE_BUILD,kind:'two focused receipts in the same exact-source failure artifact',buildInfoAvailable:false},\n revalidation:{originalEarlyReleaseAudits:'passed',originalFullRawAudits:'validated-with-failure-preserved',originalFullReleaseQualification:'rejected-as-original',windows:32,passingWindows:31,failures:expectedIssues,matchingOriginalEnvironments:true},\n early:{envelope:envelope(early),profiles:early.profiles},\n failure:{envelope:envelope(failure),profile:failure.profile,error:failure.error,errorDetails:failure.errorDetails,performanceIssues:failure.performanceIssues,profilePerformance:failure.profilePerformance,browserStartup:failure.browserStartup,completedSiteSmoothness:failure.completedSiteSmoothness}\n};\nconst serialized=JSON.stringify(result);\nwriteFileSync(join(dir,'compact-evidence.json'),serialized+'\\n');\nconst width=12000,parts=Math.ceil(serialized.length/width),sha256=hash(serialized);\nconst header={schemaVersion:1,artifactSourceCommit:source,extractorSourceCommit:e.GITHUB_SHA,utf16CodeUnits:serialized.length,utf8Bytes:Buffer.byteLength(serialized,'utf8'),sha256,parts};\nconsole.log('TROPNIK_FAILED_EVIDENCE_HEADER='+JSON.stringify(header));\nfor(let index=0;index<parts;index++)console.log('TROPNIK_FAILED_EVIDENCE_CHUNK='+JSON.stringify({index,text:serialized.slice(index*width,(index+1)*width)}));\nconsole.log('TROPNIK_FAILED_EVIDENCE_END='+JSON.stringify({parts,sha256}));\nNODE"
        },
        {
          "name": "Preserve the compact failed-run extraction receipt",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "tropnik-failed-pages-evidence-${{ github.run_id }}",
            "path": "${{ runner.temp }}/tropnik-failed-pages-evidence/compact-evidence.json\n${{ runner.temp }}/tropnik-failed-pages-evidence/member-receipt.json\n${{ runner.temp }}/tropnik-failed-pages-transport.json",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
