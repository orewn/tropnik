name: Service details 0.4.12

on:
  push:
    branches: [polish/service-details-0.4.12]

permissions:
  contents: write

concurrency:
  group: tropnik-service-details-0.4.12
  cancel-in-progress: true

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply deterministic product patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tools/apply-service-details-0.4.12.py')
          text=path.read_text()
          old=r'''r'\{notice && <div className=\{styles\.notice\}>\{notice\}</div>\}' '''.strip()
          new=r'''r'\{notice && <div className=\{styles\.notice\} role="status">\{notice\}</div>\}' '''.strip()
          if old not in text: raise SystemExit('notice regex patch anchor missing')
          path.write_text(text.replace(old,new,1))
          PY
          python3 tools/apply-service-details-0.4.12.py
          python3 - <<'PY'
          from pathlib import Path

          map_test=Path('web/tests/map-polish.test.mjs')
          text=map_test.read_text()
          if text.count('tropnik-shell-v18') != 1: raise SystemExit('map polish worker version anchor missing')
          map_test.write_text(text.replace('tropnik-shell-v18','tropnik-shell-v19',1))

          service_test=Path('web/tests/service-polish.test.mjs')
          text=service_test.read_text()
          replacements={
            "  assert.match(stories,/role=\"img\"/);":"  assert.match(stories,/<img\\b/);",
            "  assert.doesNotMatch(stories,/<img\\b/);":"  assert.doesNotMatch(stories,/role=\"img\"/);",
            "  assert.match(component,/passportSnapshot/);":"  assert.match(component,/safetyPassportSnapshot/);",
            "  assert.match(worker,/tropnik-shell-v18/);":"  assert.match(worker,/tropnik-shell-v19/);",
            "  assert.equal(JSON.parse(pkg).version,'0.4.11');":"  assert.equal(JSON.parse(pkg).version,'0.4.12');",
          }
          for old,new in replacements.items():
            if text.count(old)!=1: raise SystemExit('service polish assertion anchor missing: '+old)
            text=text.replace(old,new,1)
          service_test.write_text(text)
          PY
          git diff --check
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          pnpm --dir web install --frozen-lockfile
      - name: Run complete regression suite
        working-directory: web
        run: pnpm test
      - name: Check static client types
        run: node web/node_modules/typescript/bin/tsc -p web/pages-preview/tsconfig.json --noEmit
      - name: Strictly lint changed modules and tests
        working-directory: web
        run: pnpm exec eslint --max-warnings=0 components/PlaceStories.tsx components/ServiceWorker.tsx components/MapResourceHints.tsx components/Header.tsx components/SafetyRegistration.tsx lib/safety-passport.ts tests/place-stories.test.mjs tests/safety-passport.test.mjs tests/startup-polish.test.mjs tests/service-polish.test.mjs tests/map-polish.test.mjs
      - name: Build production application
        working-directory: web
        run: pnpm build
      - name: Restore verified APK
        run: node tools/pages-preview/fetch-apk.mjs
      - name: Build and verify Pages artifact
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/pages-preview/build.mjs --base /tropnik/ --origin https://orewn.github.io
      - name: Run Chromium cross-platform interaction gate
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/pages-preview/browser-smoke.mjs
      - name: Verify clean release tree
        run: |
          test "$(node -p "require('./web/package.json').version")" = '0.4.12'
          grep -q "tropnik-shell-v19" web/public/sw.js
          grep -q "safetyPassportSnapshot" web/lib/safety-passport.ts
          grep -q "IntersectionObserver" web/components/PlaceStories.tsx
          grep -q "registrationRef.current.update" web/components/ServiceWorker.tsx
          ! grep -q '<link rel="preconnect" href="https://tiles.openfreemap.org"' tools/pages-preview/build.mjs
          test ! -e .github/workflows/service-details-0.4.12.yml
          test ! -e tools/apply-service-details-0.4.12.py
          git diff --check
      - name: Commit verified product release
        run: |
          git config user.name 'tropnik-release-bot'
          git config user.email '38781694+orewn@users.noreply.github.com'
          git add -A
          git commit -m 'Release 0.4.12: resilient stories, storage and long-lived updates'
          git push origin HEAD:polish/service-details-0.4.12
