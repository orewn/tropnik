name: Service polish 0.4.11

on:
  push:
    branches: [perf/service-polish-0.4.11]

permissions:
  contents: write

concurrency:
  group: tropnik-service-polish-0.4.11
  cancel-in-progress: true

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply service polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tools/apply-service-polish.py')
          text=path.read_text()
          helper_old="""def append_once(relative: str, marker: str, addition: str) -> None:
          """
          helper_new="""def replace_first(relative: str, old: str, new: str) -> None:
              path = ROOT / relative
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"{relative}: expected at least one match")
              path.write_text(text.replace(old, new, 1))

          def append_once(relative: str, marker: str, addition: str) -> None:
          """
          if helper_old not in text: raise SystemExit('replace_first insertion anchor missing')
          text=text.replace(helper_old,helper_new,1)
          repeated_old="""replace_once("web/components/Explore.tsx", "saved={saved.some(s=>s.id===t.id)}", "saved={savedIds.has(t.id)}")
          replace_once("web/components/Explore.tsx", "saved={saved.some(s=>s.id===t.id)}", "saved={savedIds.has(t.id)}")
          """
          repeated_new="""replace_first("web/components/Explore.tsx", "saved={saved.some(s=>s.id===t.id)}", "saved={savedIds.has(t.id)}")
          replace_once("web/components/Explore.tsx", "saved={saved.some(s=>s.id===t.id)}", "saved={savedIds.has(t.id)}")
          """
          if repeated_old not in text: raise SystemExit('repeated route-card replacement anchor missing')
          path.write_text(text.replace(repeated_old,repeated_new,1))
          PY
          python3 tools/apply-service-polish.py
          git diff --check
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          pnpm --dir web install --frozen-lockfile
      - name: Run complete regression suite
        working-directory: web
        run: pnpm test
      - name: Check static client types
        run: node web/node_modules/typescript/bin/tsc -p web/pages-preview/tsconfig.json --noEmit
      - name: Strictly lint changed modules and tests
        working-directory: web
        run: >-
          pnpm exec eslint --max-warnings=0
          components/Explore.tsx
          components/TerritoryBrowser.tsx
          components/TrailCard.tsx
          components/PlaceStories.tsx
          components/Header.tsx
          components/SafetyRegistration.tsx
          components/ServiceWorker.tsx
          tests/service-polish.test.mjs
          tests/startup-polish.test.mjs
          tests/map-polish.test.mjs
      - name: Build production application
        working-directory: web
        run: pnpm build
      - name: Restore verified APK
        run: node tools/pages-preview/fetch-apk.mjs
      - name: Build and verify Pages artifact
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/pages-preview/build.mjs --base /tropnik/ --origin https://orewn.github.io
      - name: Run Chromium cross-platform interaction gate
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/pages-preview/browser-smoke.mjs
      - name: Verify clean release tree
        run: |
          test "$(node -p "require('./web/package.json').version")" = '0.4.11'
          grep -q "tropnik-shell-v18" web/public/sw.js
          grep -q "useDeferredValue" web/components/Explore.tsx
          grep -q "beforeunload" web/components/SafetyRegistration.tsx
          grep -q "skip-waiting" web/components/ServiceWorker.tsx
          test -f web/tests/service-polish.test.mjs
          test ! -e .github/workflows/service-polish.yml
          test ! -e tools/apply-service-polish.py
          git diff --check
      - name: Commit verified product release
        run: |
          git config user.name 'tropnik-release-bot'
          git config user.email '38781694+orewn@users.noreply.github.com'
          git add -A
          git commit -m 'Release 0.4.11: professional service responsiveness and detail polish'
          git push origin HEAD:perf/service-polish-0.4.11
