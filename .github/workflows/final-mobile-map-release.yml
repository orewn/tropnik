name: Final mobile map release gate

on:
  push:
    branches: [fix/native-trail-points-final]
    paths:
      - '.github/workflows/final-mobile-map-release.yml'
      - 'tools/final-mobile-map-release.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-mobile-map-release
  cancel-in-progress: false

jobs:
  verify-and-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/native-trail-points-final
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic final patch
        run: |
          python3 tools/final-mobile-map-release.py
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install frozen dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = '11.25.0'
          pnpm --dir web install --frozen-lockfile

      - name: Run full web regression suite
        run: pnpm --dir web test

      - name: Check static client types
        run: node web/node_modules/typescript/bin/tsc -p web/pages-preview/tsconfig.json --noEmit

      - name: Lint release-owned source
        run: pnpm --dir web exec eslint --max-warnings=0 lib/map-direction-layout.ts lib/map-trail-points.ts components/Atlas.tsx components/Atlas2D.tsx lib/canvas-relief.ts tests/map-trail-points.test.mjs

      - name: Build production web app
        run: pnpm --dir web build

      - name: Require intended release changes
        run: |
          test -n "$(git status --porcelain)"
          grep -q '"version": "0.4.7"' web/package.json
          grep -q "TRAIL_POINT_HIT" web/components/Atlas.tsx
          grep -q "L.circleMarker" web/components/Atlas2D.tsx
          grep -q "window.visualViewport" web/lib/map-direction-layout.ts
          test ! -e tools/final-mobile-map-release.py
          test ! -e .github/workflows/final-mobile-map-release.yml
          git diff --check
          git status --short

      - name: Commit verified release branch
        run: |
          git config user.name 'tropnik-release-bot'
          git config user.email '38781694+orewn@users.noreply.github.com'
          git add -A
          git commit -m 'release(web): v0.4.7 cross-platform map anchors'
          git push origin HEAD:fix/native-trail-points-final
