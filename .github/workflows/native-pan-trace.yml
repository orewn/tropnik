name: Native map pan CPU and raster trace

on:
  push:
    branches: [diagnostics/native-pan-trace]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-pan-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check the bounded trace window contract
        run: node --test tools/pages-preview/tests/browser-smoothness.test.mjs
      - name: Build the unchanged candidate once
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          pnpm --dir web install --frozen-lockfile
          node tools/pages-preview/fetch-apk.mjs
          node tools/pages-preview/build.mjs --base /tropnik/ --origin https://orewn.github.io
      - name: Preserve exact diagnostic input bytes
        id: build-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-pan-static-build
          path: web/pages-preview/dist
          if-no-files-found: error
          retention-days: 7
      - name: Capture only map-pan while retaining all eight native input scenarios
        timeout-minutes: 8
        env:
          GITHUB_SHA: ${{ github.sha }}
          TROPNIK_BROWSER_DIAGNOSTIC: ui-smoothness
          TROPNIK_BROWSER_TRACE: '1'
        run: node tools/pages-preview/browser-smoke.mjs
      - name: Preserve bounded traces and unchanged environment receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-pan-trace-${{ github.run_id }}
          path: |
            web/pages-preview/design-qa
            web/pages-preview/dist/browser-ui-smoothness-diagnostic.json
            web/pages-preview/dist/browser-network.json
            web/pages-preview/dist/build-info.json
            web/pages-preview/dist/browser-failure.*
          if-no-files-found: error
          retention-days: 7
