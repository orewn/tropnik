name: Safety registration 0.4.9 gate

on:
  push:
    branches: [feature/safety-registration-0.4.9]

permissions:
  contents: write

concurrency:
  group: safety-registration-0.4.9
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply deterministic release cleanup
        run: |
          python3 tools/fix-safety-registration-release.py
          git diff --check
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          pnpm --dir web install --frozen-lockfile
      - name: Run regression suite
        working-directory: web
        run: pnpm test
      - name: Check static client types
        run: node web/node_modules/typescript/bin/tsc -p web/pages-preview/tsconfig.json --noEmit
      - name: Strictly lint safety release files
        working-directory: web
        run: pnpm exec eslint --max-warnings=0 components/SafetyRegistration.tsx lib/safety-passport.ts tests/safety-passport.test.mjs app/safety/page.tsx app/safety/registration/page.tsx
      - name: Build production application
        working-directory: web
        run: pnpm build
      - name: Restore verified APK
        run: node tools/pages-preview/fetch-apk.mjs
      - name: Build and verify Pages artifact
        run: node tools/pages-preview/build.mjs --base /tropnik/ --origin https://orewn.github.io
      - name: Require the public registration page
        run: |
          test -f web/pages-preview/dist/safety/registration/index.html
          grep -q 'Регистрация похода в МЧС' web/pages-preview/dist/safety/registration/index.html
          grep -q '"path": "/safety/registration"' web/pages-preview/dist/page-manifest.json
          test "$(node -p "require('./web/package.json').version")" = '0.4.9'
          grep -q "tropnik-shell-v16" web/public/sw.js
      - name: Persist verified cleanup
        run: |
          if ! git diff --quiet; then
            git config user.name 'tropnik-release-bot'
            git config user.email '38781694+orewn@users.noreply.github.com'
            git add web/components/SafetyRegistration.tsx web/tests/map-polish.test.mjs web/tests/safety-passport.test.mjs tools/pages-preview/build.mjs
            git commit -m 'fix(safety): persist verified registration release cleanup'
            git push origin HEAD:feature/safety-registration-0.4.9
          fi
