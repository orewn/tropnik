name: Apply Tropnik map release 0.4.5

on:
  push:
    branches: [fix/map-stability-labels-regions-20261107]
    paths:
      - '.github/workflows/apply-map-release-0.4.5.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tropnik-map-release-0.4.5
  cancel-in-progress: false

jobs:
  verify-and-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/map-stability-labels-regions-20261107
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install frozen dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = '11.25.0'
          pnpm --dir web install --frozen-lockfile

      - name: Apply reviewed release changes
        run: python tools/apply-map-release-0.4.5.py

      - name: Regenerate the checked-in map style
        working-directory: web
        run: node scripts/create-map-style.mjs

      - name: Run the complete web regression suite
        run: pnpm --dir web test

      - name: Lint release-owned modules strictly
        working-directory: web
        run: |
          pnpm exec eslint --max-warnings=0 \
            lib/map-coordinate.ts \
            lib/map-direction-layout.ts \
            lib/territories.ts \
            lib/map-lifecycle.ts \
            lib/canvas-relief.ts \
            tests/map-coordinate.test.mjs \
            tests/map-region-selection.test.mjs \
            tests/map-direction-layout.test.mjs
          pnpm exec eslint components/Atlas.tsx components/Atlas2D.tsx

      - name: Run TypeScript static verification
        run: node web/node_modules/typescript/bin/tsc -p web/pages-preview/tsconfig.json --noEmit

      - name: Build the production web release
        run: pnpm --dir web build

      - name: Verify release invariants
        run: |
          test "$(node -p "require('./web/package.json').version")" = '0.4.5'
          grep -q "tropnik-shell-v13" web/public/sw.js
          grep -q "symbol-avoid-edges" web/public/maps/tropa-style.json
          grep -q "hillshade-illumination-anchor.*map" web/public/maps/tropa-style.json
          grep -q "interface-refresh.css" web/app/layout.tsx
          test ! -e .github/workflows/fix-map-points.yml
          test ! -e .github/workflows/apply-map-release-0.4.5.yml
          test ! -e tools/apply-map-release-0.4.5.py
          test ! -e scripts/fix-map-points.py
          git diff --check
          git status --short

      - name: Commit the verified release branch
        run: |
          git config user.name 'tropnik-release-bot'
          git config user.email '38781694+orewn@users.noreply.github.com'
          git add -A
          git commit -m 'release(web): v0.4.5 stable map labels, terrain and region selection'
          git push origin HEAD:fix/map-stability-labels-regions-20261107
