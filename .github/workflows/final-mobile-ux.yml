name: Final mobile UX 0.4.8 gate

on:
  push:
    branches: [perf/ui-smoothness-0.4.8-final]
    paths:
      - '.github/workflows/final-mobile-ux.yml'
      - 'tools/apply-final-mobile-ux.py'
      - 'tools/normalize-final-mobile-ux.py'
      - 'tools/finalize-doc-eof.py'
      - 'tools/fix-landscape-mobile-sheet.py'

permissions:
  contents: write

concurrency:
  group: tropnik-final-mobile-ux-0.4.8
  cancel-in-progress: false

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out clean release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/ui-smoothness-0.4.8-final
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install frozen dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = '11.25.0'
          pnpm --dir web install --frozen-lockfile

      - name: Record release lint baseline
        shell: bash
        run: |
          set +e
          pnpm --dir web lint > "$RUNNER_TEMP/lint-before.log" 2>&1
          set -e

      - name: Apply final mobile UX patch
        run: |
          python3 tools/apply-final-mobile-ux.py
          python3 tools/normalize-final-mobile-ux.py
          python3 tools/fix-landscape-mobile-sheet.py
          python3 tools/finalize-doc-eof.py
          git diff --check

      - name: Run all regression tests
        working-directory: web
        run: pnpm test

      - name: Check static client types
        run: node web/node_modules/typescript/bin/tsc -p web/pages-preview/tsconfig.json --noEmit

      - name: Strictly lint permanent web performance gates
        working-directory: web
        run: pnpm exec eslint --max-warnings=0 lib/map-direction-layout.ts lib/map-framing.ts tests/ui-smoothness.test.mjs tests/map-framing.test.mjs

      - name: Validate permanent browser gate scripts
        run: |
          node --check tools/pages-preview/browser-smoke.mjs
          node --check tools/pages-preview/verify-deployed.mjs

      - name: Require zero lint regression
        shell: bash
        run: |
          set +e
          pnpm --dir web lint > "$RUNNER_TEMP/lint-after.log" 2>&1
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          def counts(path):
              text=Path(path).read_text()
              match=re.search(r'✖\s+\d+\s+problems\s+\((\d+)\s+errors,\s+(\d+)\s+warnings\)',text)
              if match:return tuple(map(int,match.groups()))
              if '✖' not in text:return (0,0)
              raise SystemExit('Could not parse lint summary: '+path)
          before=counts(os.environ['RUNNER_TEMP']+'/lint-before.log')
          after=counts(os.environ['RUNNER_TEMP']+'/lint-after.log')
          print('lint baseline',before,'release',after)
          if after[0]>before[0] or after[1]>before[1]:raise SystemExit('Final mobile UX introduces lint regression')
          PY

      - name: Build production web application
        working-directory: web
        run: pnpm build

      - name: Restore verified public APK
        run: node tools/pages-preview/fetch-apk.mjs

      - name: Build static Pages artifact
        run: node tools/pages-preview/build.mjs --base /tropnik/ --origin https://orewn.github.io

      - name: Run real Chromium mobile interaction smoke
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/pages-preview/browser-smoke.mjs

      - name: Verify browser report and clean release tree
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync('web/pages-preview/dist/browser-verification.json','utf8'));
          assert.equal(report.verified,true);
          assert.equal(report.sourceCommit,process.env.GITHUB_SHA);
          assert.ok(report.profiles.length>=4);
          for(const profile of report.profiles){
            assert.equal(profile.interactionTested,true,profile.name);
            assert.equal(profile.sheetTested,true,profile.name);
            assert.ok(profile.sheetHeightDelta<1.1,profile.name);
            assert.ok(profile.layoutShift<.12,profile.name);
            assert.ok(profile.longestTaskMs<350,profile.name);
          }
          NODE
          test "$(node -p "require('./web/package.json').version")" = '0.4.8'
          grep -q "tropnik-shell-v15" web/public/sw.js
          grep -q "sheet-peek-summary" web/components/Explore.tsx
          grep -q "Verify real mobile rendering and sheet interaction" .github/workflows/pages.yml
          test ! -e tools/apply-final-mobile-ux.py
          test ! -e tools/normalize-final-mobile-ux.py
          test ! -e tools/finalize-doc-eof.py
          test ! -e tools/fix-landscape-mobile-sheet.py
          test ! -e .github/workflows/final-mobile-ux.yml
          test ! -e .github/workflows/ui-smoothness-release-v2.yml
          test ! -e tools/apply-ui-bottom-sheet.py
          test ! -e tools/apply-ui-smoothness-extra.py
          test ! -e tools/apply-ui-smoothness.py
          git diff --check
          git status --short

      - name: Commit verified clean release
        run: |
          git config user.name 'tropnik-release-bot'
          git config user.email '38781694+orewn@users.noreply.github.com'
          git add -A
          git commit -m 'Polish 0.4.8 mobile sheet and add real browser gate'
          git push origin HEAD:perf/ui-smoothness-0.4.8-final
