name: UI smoothness 0.4.8 release gate

on:
  push:
    branches: [perf/ui-smoothness-0.4.8]
    paths:
      - '.github/workflows/ui-smoothness-release.yml'

permissions:
  contents: write

concurrency:
  group: tropnik-ui-smoothness-0.4.8
  cancel-in-progress: false

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/ui-smoothness-0.4.8
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install frozen dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = '11.25.0'
          pnpm --dir web install --frozen-lockfile

      - name: Record current lint baseline
        shell: bash
        run: |
          set +e
          pnpm --dir web lint > "$RUNNER_TEMP/lint-before.log" 2>&1
          set -e

      - name: Apply deterministic smoothness patch
        run: |
          python3 scripts/apply-ui-smoothness-0.4.8.py
          python3 scripts/fix-ui-smoothness-gate.py
          git diff --check

      - name: Run full web regression suite
        working-directory: web
        run: pnpm test

      - name: Check static client types
        run: node web/node_modules/typescript/bin/tsc -p web/pages-preview/tsconfig.json --noEmit

      - name: Strictly lint changed interaction modules
        working-directory: web
        run: pnpm exec eslint --max-warnings=0 components/Explore.tsx components/Atlas.tsx components/Atlas2D.tsx lib/map-direction-layout.ts lib/map-framing.ts tests/ui-smoothness.test.mjs tests/map-framing.test.mjs

      - name: Require zero lint regression
        shell: bash
        run: |
          set +e
          pnpm --dir web lint > "$RUNNER_TEMP/lint-after.log" 2>&1
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re, os

          def counts(path):
              text=Path(path).read_text()
              match=re.search(r'✖\s+\d+\s+problems\s+\((\d+)\s+errors,\s+(\d+)\s+warnings\)',text)
              if match:return tuple(map(int,match.groups()))
              if '✖' not in text:return (0,0)
              raise SystemExit('Could not parse lint summary: '+path)

          before=counts(os.environ['RUNNER_TEMP']+'/lint-before.log')
          after=counts(os.environ['RUNNER_TEMP']+'/lint-after.log')
          print('lint baseline',before,'release',after)
          if after[0]>before[0] or after[1]>before[1]:raise SystemExit('Release introduces lint regression')
          PY

      - name: Build production web app
        working-directory: web
        run: pnpm build

      - name: Require intended release changes
        run: |
          test "$(node -p "require('./web/package.json').version")" = '0.4.8'
          grep -q "tropnik-shell-v15" web/public/sw.js
          grep -q "transition:transform .28s" web/app/map-ui-release.css
          grep -q "content-visibility:auto" web/app/map-ui-release.css
          test -f web/tests/ui-smoothness.test.mjs
          test ! -e scripts/apply-ui-smoothness-0.4.8.py
          test ! -e scripts/fix-ui-smoothness-gate.py
          test ! -e .github/workflows/ui-smoothness-release.yml
          git diff --check
          git status --short

      - name: Commit verified release branch
        run: |
          git config user.name 'tropnik-release-bot'
          git config user.email '38781694+orewn@users.noreply.github.com'
          git add -A
          git commit -m 'Release 0.4.8: smooth mobile sheet and bounded map reflow'
          git push origin HEAD:perf/ui-smoothness-0.4.8
