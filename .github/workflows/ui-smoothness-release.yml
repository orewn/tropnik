      - name: Run full regression suite
        working-directory: web
        run: pnpm test
      - name: Check static client types
        run: node web/node_modules/typescript/bin/tsc -p web/pages-preview/tsconfig.json --noEmit
      - name: Strictly lint changed interaction modules
        working-directory: web
        run: pnpm exec eslint --max-warnings=0 components/PlaceStories.tsx components/Atlas.tsx components/Atlas2D.tsx lib/map-direction-layout.ts tests/place-stories.test.mjs tests/map-polish.test.mjs
      - name: Require zero lint regression
        run: |
          pnpm --dir web exec eslint . --format json > /tmp/lint-after.json || true
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const findings=path=>{
            const result=new Map();
            for(const report of JSON.parse(readFileSync(path,'utf8')||'[]')){
              const file=report.filePath.split('/web/').at(-1)||report.filePath;
              for(const item of report.messages){
                const key=JSON.stringify([file,item.ruleId||'parser',item.message,item.severity||0]);
                result.set(key,(result.get(key)||0)+1);
              }
            }
            return result;
          };
          const before=findings('/tmp/lint-before.json'),after=findings('/tmp/lint-after.json');
          const added=[];
          for(const [key,count] of after)if(count>(before.get(key)||0))added.push([key,count-(before.get(key)||0)]);
          if(added.length){console.error(added);process.exit(1);}
          console.log(`Lint baseline preserved: ${[...before.values()].reduce((a,b)=>a+b,0)} existing findings, no additions`);
          NODE
      - name: Build production app
        working-directory: web
        run: pnpm build
      - name: Build Pages artifact and run real Chromium smoke
        run: |
          node tools/pages-preview/build.mjs --base /tropnik/ --origin https://orewn.github.io
          node tools/pages-preview/browser-smoke.mjs
      - name: Commit verified release branch
        run: |
          test ! -e .github/workflows/ui-smoothness-release.yml
          test ! -e tools/apply-ui-smoothness.py
          git config user.name 'tropnik-release-bot'
          git config user.email '38781694+orewn@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release 0.4.8: smooth touch controls and map camera hot path'
          git push origin HEAD:perf/ui-smoothness-0.4.8
