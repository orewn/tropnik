name: Tropnik 0.4.8 interaction performance gate

on:
  push:
    branches: [perf/ui-smoothness-0.4.8]
    paths:
      - '.github/workflows/ui-smoothness-release.yml'

permissions:
  contents: write

concurrency:
  group: tropnik-ui-smoothness-0.4.8
  cancel-in-progress: false

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/ui-smoothness-0.4.8
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install frozen dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = '11.25.0'
          pnpm --dir web install --frozen-lockfile
      - name: Record lint baseline
        run: pnpm --dir web exec eslint . --format json > /tmp/lint-before.json || true
      - name: Apply deterministic performance patch
