name: Apply Tropnik map anchor release 0.4.6

on:
  push:
    branches: [fix/map-anchor-reflow-20261107]
    paths:
      - '.github/workflows/apply-map-anchor-release-0.4.6.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tropnik-map-anchor-release-0.4.6
  cancel-in-progress: false

jobs:
  verify-and-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/map-anchor-reflow-20261107
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install frozen dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = '11.25.0'
          pnpm --dir web install --frozen-lockfile

      - name: Apply reviewed camera-frame anchor changes
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/apply-map-anchor-release-0.4.6.py')
          lines=path.read_text().splitlines()
          filtered=[line for line in lines if 'WebGL style load layout' not in line]
          if len(filtered)!=len(lines)-1:
              raise SystemExit('Expected exactly one obsolete style-load patch line')
          path.write_text('\n'.join(filtered)+'\n')
          PY
          python tools/apply-map-anchor-release-0.4.6.py
          git diff --check

      - name: Run complete web regression suite
        run: pnpm --dir web test

      - name: Lint release-owned modules strictly
        working-directory: web
        run: |
          pnpm exec eslint --max-warnings=0 \
            lib/map-direction-layout.ts \
            tests/map-direction-layout.test.mjs \
            tests/map-polish.test.mjs

      - name: Run TypeScript static verification
        run: node web/node_modules/typescript/bin/tsc -p web/pages-preview/tsconfig.json --noEmit

      - name: Build production web release
        run: pnpm --dir web build

      - name: Verify release invariants
        run: |
          test "$(node -p "require('./web/package.json').version")" = '0.4.6'
          grep -q "tropnik-shell-v14" web/public/sw.js
          grep -q "reconcileDirectionAnchors" web/components/Atlas.tsx
          grep -q "reconcileDirectionAnchors" web/components/Atlas2D.tsx
          grep -q "data-map-camera='zooming'" web/app/interface-refresh.css
          grep -q "directionAnchorCorrection" web/lib/map-direction-layout.ts
          test -e docs/release-0.4.6.md
          test ! -e .github/workflows/apply-map-anchor-release-0.4.6.yml
          test ! -e tools/apply-map-anchor-release-0.4.6.py
          git diff --check
          git status --short

      - name: Commit verified release branch
        run: |
          git config user.name 'tropnik-release-bot'
          git config user.email '38781694+orewn@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'release(web): v0.4.6 exact region anchors during zoom'
          git push origin HEAD:fix/map-anchor-reflow-20261107
