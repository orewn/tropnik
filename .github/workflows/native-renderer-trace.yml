name: Native renderer traces and WebGL2 pixel proof

on:
  push:
    branches: [diagnostics/native-renderer-trace]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-renderer-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build the unchanged product once
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          pnpm --dir web install --frozen-lockfile
          node tools/pages-preview/fetch-apk.mjs
          node tools/pages-preview/build.mjs --base /tropnik/ --origin https://orewn.github.io
      - name: Preserve exact input bytes for both diagnostics
        id: build-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-renderer-static-build
          path: web/pages-preview/dist
          if-no-files-found: error
          retention-days: 7
      - name: Prove actual WebGL2 pixels and context recovery with the native compositor
        timeout-minutes: 4
        env:
          GITHUB_SHA: ${{ github.sha }}
          TROPNIK_BROWSER_DIAGNOSTIC: ui-smoothness
          TROPNIK_BROWSER_SURFACE: headless-software
          TROPNIK_TERRAIN_MASK_SOFTWARE: '1'
          TROPNIK_DIAGNOSTIC_BUILD_ARTIFACT_SHA256: ${{ steps.build-artifact.outputs.artifact-digest }}
        run: node --test tools/pages-preview/tests/terrain-mask.browser.mjs
      - name: Record bounded native compositor traces without release certification
        timeout-minutes: 8
        env:
          GITHUB_SHA: ${{ github.sha }}
          TROPNIK_BROWSER_DIAGNOSTIC: ui-smoothness
          TROPNIK_BROWSER_SURFACE: headless-software
          TROPNIK_BROWSER_SURFACE_TRACE: '1'
          TROPNIK_BROWSER_TRACE: '1'
          TROPNIK_DIAGNOSTIC_BUILD_ARTIFACT_SHA256: ${{ steps.build-artifact.outputs.artifact-digest }}
        run: node tools/pages-preview/browser-smoke.mjs
      - name: Preserve instrumented traces and actual pixel proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-compositor-traces-and-webgl2-${{ github.run_id }}
          path: |
            web/pages-preview/design-qa
            web/pages-preview/dist/browser-surface-diagnostic.json
            web/pages-preview/dist/browser-ui-smoothness-diagnostic.json
            web/pages-preview/dist/browser-terrain-mask-software-diagnostic.json
            web/pages-preview/dist/browser-failure.*
          if-no-files-found: error
          retention-days: 7
