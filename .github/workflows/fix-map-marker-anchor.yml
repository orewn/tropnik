name: Fix exact map marker anchors

on:
  push:
    branches:
      - fix/map-marker-anchor-20261107
    paths:
      - .github/workflows/fix-map-marker-anchor.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/map-marker-anchor-20261107
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          pnpm --dir web install --frozen-lockfile
      - name: Apply hotfix
        run: |
          python tools/fix-marker-anchor.py
          git diff --check
      - name: Verify
        run: |
          pnpm --dir web test
          node web/node_modules/typescript/bin/tsc -p web/pages-preview/tsconfig.json --noEmit
          pnpm --dir web build
      - name: Commit
        run: |
          git config user.name tropnik-release-bot
          git config user.email 38781694+orewn@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(map): center region markers on exact coordinates'
          git push origin HEAD:fix/map-marker-anchor-20261107
