name: Combined 0.4.8 safety release gate

on:
  push:
    branches: [release/0.4.8-safety-final]
    paths:
      - '.github/workflows/combine-safety-final.yml'

permissions:
  contents: write

concurrency:
  group: tropnik-combined-0.4.8-safety
  cancel-in-progress: true

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TROPA_SAFETY_DATA_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Check out clean release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/0.4.8-safety-final
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Import verified non-commercial safety files
        run: |
          set -euo pipefail
          git fetch origin feature/safety-passport-mchs-final
          git checkout 3e96124e087e0f98f9e6dbba8cac3f2311e41d34 -- \
            backend/SAFETY-PASSPORT.md \
            backend/internal/domain/model.go \
            backend/internal/domain/safety.go \
            backend/internal/domain/safety_test.go \
            backend/internal/httpapi/safety.go \
            backend/internal/httpapi/server.go \
            backend/internal/store/guides.go \
            backend/internal/store/postgres.go \
            backend/internal/store/safety.go \
            backend/internal/store/safety_integration_test.go \
            backend/internal/store/safety_test.go \
            backend/migrations/006_safety_passport.sql \
            backend/migrations/grants.go \
            backend/migrations/migrate.go \
            docs/SAFETY-PASSPORT.md \
            web/app/globals.css \
            web/components/SafetyPanel.tsx \
            web/components/Trips.tsx \
            web/lib/api.ts \
            web/lib/contract.ts \
            web/tests/safety-passport.test.mjs
          git diff --check
          if git diff --unified=0 -- backend web docs | grep -Ei 'platformFee|payment_intent|pricePerPerson|commission|комисси|split-плат'; then
            echo 'Commercial functionality entered the safety-only release.' >&2
            exit 1
          fi
      - name: Install frozen web dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = '11.25.0'
          pnpm --dir web install --frozen-lockfile
      - name: Verify backend and database
        run: |
          set -euo pipefail
          (cd backend && go test -race -count=1 ./...)
          (cd backend && go vet ./...)
          bash infra/run-integration.sh
      - name: Verify web and production artifacts
        run: |
          set -euo pipefail
          pnpm --dir web test
          node web/node_modules/typescript/bin/tsc -p web/pages-preview/tsconfig.json --noEmit
          pnpm --dir web exec eslint --max-warnings=0 \
            components/SafetyPanel.tsx \
            lib/map-direction-layout.ts \
            lib/map-framing.ts \
            tests/safety-passport.test.mjs \
            tests/ui-smoothness.test.mjs \
            tests/map-framing.test.mjs
          pnpm --dir web build
          node tools/pages-preview/fetch-apk.mjs
          node tools/pages-preview/build.mjs --base /tropnik/ --origin https://orewn.github.io
          passed=false
          for attempt in 1 2; do
            if GITHUB_SHA="$GITHUB_SHA" node tools/pages-preview/browser-smoke.mjs; then
              passed=true
              break
            fi
            if [ "$attempt" -eq 1 ]; then sleep 2; fi
          done
          test "$passed" = true
      - name: Commit combined verified release
        run: |
          set -euo pipefail
          git config user.name 'tropnik-release-bot'
          git config user.email '38781694+orewn@users.noreply.github.com'
          git add backend web docs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Release 0.4.8 with official hike safety workflow'
          git fetch origin release/0.4.8-safety-final
          git rebase origin/release/0.4.8-safety-final
          git push origin HEAD:release/0.4.8-safety-final
