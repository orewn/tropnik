name: Finish Android map threading cleanup

on:
  push:
    branches: [fix/map-label-viewport-20261107]
    paths:
      - '.github/workflows/fix-android-map-threading.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/map-label-viewport-20261107
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize the position UI block and verify control flow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/java/ru/tropa/app/ui/TropaMap.kt')
          text = path.read_text()
          old = '''        withContext(Dispatchers.Main.immediate) {
                  val ready = position as? PositionState.Ready
                  val inside = ready?.fix?.let { area.contains(it.longitude, it.latitude) } == true
                  nativeMap.style?.getSourceAs<GeoJsonSource>("position")?.setGeoJson(
                      points(if (inside) ready?.fix?.let { listOf(it.longitude to it.latitude) }.orEmpty() else emptyList()))
                  scopeNotice = if (ready != null && !inside) "Геопозиция получена. Точка находится вне области карты России." else null
                  if (ready != null && inside && lastPositionTime != ready.fix.measuredAt) {
                      lastPositionTime = ready.fix.measuredAt
                      nativeMap.animateCamera(CameraUpdateFactory.newLatLngZoom(LatLng(ready.fix.latitude, area.cameraLongitude(ready.fix.longitude)), 11.0), 500)
                  }
              }
              }
          '''
          new = '''        withContext(Dispatchers.Main.immediate) {
                  val ready = position as? PositionState.Ready
                  val inside = ready?.fix?.let { area.contains(it.longitude, it.latitude) } == true
                  nativeMap.style?.getSourceAs<GeoJsonSource>("position")?.setGeoJson(
                      points(if (inside) ready?.fix?.let { listOf(it.longitude to it.latitude) }.orEmpty() else emptyList()))
                  scopeNotice = if (ready != null && !inside) "Геопозиция получена. Точка находится вне области карты России." else null
                  if (ready != null && inside && lastPositionTime != ready.fix.measuredAt) {
                      lastPositionTime = ready.fix.measuredAt
                      nativeMap.animateCamera(CameraUpdateFactory.newLatLngZoom(LatLng(ready.fix.latitude, area.cameraLongitude(ready.fix.longitude)), 11.0), 500)
                  }
              }
          }
          '''
          if old not in text:
              raise SystemExit('Reviewed TropaMap position block no longer matches')
          text = text.replace(old, new, 1)
          required = [
              'withContext(Dispatchers.Main.immediate) ui@{',
              'val style = nativeMap.style ?: return@ui',
              'if (lastFittedFocus == focusKey) return@ui',
              'mapView.post { map?.animateCamera(CameraUpdateFactory.zoomIn(), 180) }',
              'mapView.post { map?.animateCamera(CameraUpdateFactory.zoomOut(), 180) }',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit('Missing reviewed UI-thread marker: ' + marker)
          path.write_text(text)
          PY
          git diff --check

      - name: Commit normalized source only
        run: |
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | awk '{print $2}')" = 'android/app/src/main/java/ru/tropa/app/ui/TropaMap.kt'
          git config user.name 'tropnik-release-bot'
          git config user.email '38781694+orewn@users.noreply.github.com'
          git add android/app/src/main/java/ru/tropa/app/ui/TropaMap.kt
          git commit -m 'Normalize Android map UI-thread effect blocks'
          git push origin HEAD:fix/map-label-viewport-20261107
