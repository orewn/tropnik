name: Isolated PGDG PostGIS rebuild probe

on:
  push:
    branches: [verify/postgis-18.7-20261113]

permissions:
  contents: read

concurrency:
  group: isolated-postgis-image-probe
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify official PGDG buildinfo and library symbols
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          import urllib.request
          from datetime import datetime, timezone
          
          OUT = Path("verification").resolve()
          OUT.mkdir(exist_ok=True)
          VERSION = "3.7.0+dfsg-1.pgdg13+2"
          BASE = "postgres:18.7-trixie@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b"
          BUILDINFO = f"postgis_{VERSION}_amd64.buildinfo"
          POOL = "https://apt.postgresql.org/pub/repos/apt/pool/main/p/postgis/"
          report = {
              "schemaVersion": 1,
              "purpose": "Verify official PGDG rebuilt PostGIS package provenance without executing its library",
              "sourceSHA": os.environ["GITHUB_SHA"],
              "sourceRef": os.environ["GITHUB_REF"],
              "runID": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "createdAt": datetime.now(timezone.utc).isoformat(),
              "base": BASE,
              "packageVersion": VERSION,
              "buildinfoURL": POOL + BUILDINFO,
              "packages": [],
          }
          
          def command(argv, timeout=60):
              p = subprocess.run(argv, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=timeout)
              if p.returncode:
                  raise RuntimeError(f"{argv[0]} {argv[1]} failed ({p.returncode}): {p.stderr[-3000:]}")
              return p.stdout
          
          def save():
              (OUT / "package-probe.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          
          def fields(text):
              result = {}
              current = None
              for line in text.splitlines():
                  if line.startswith((" ", "\t")) and current:
                      result[current] += "\n" + line
                  elif re.match(r"^[A-Za-z][A-Za-z0-9-]*:", line):
                      current, value = line.split(":", 1)
                      result[current] = value.strip()
                  else:
                      current = None
              return result
          
          try:
              raw = urllib.request.urlopen(POOL + BUILDINFO, timeout=60).read()
              assert len(raw) < 262144
              (OUT / BUILDINFO).write_bytes(raw)
              info = fields(raw.decode("utf-8"))
              report["buildinfoSHA256"] = hashlib.sha256(raw).hexdigest()
              report["buildDate"] = info.get("Build-Date")
              report["buildArchitecture"] = info.get("Build-Architecture")
              report["buildSource"] = info.get("Source")
              report["buildVersion"] = info.get("Version")
              assert info["Version"] == VERSION and info["Build-Architecture"] == "amd64"
              deps = info["Installed-Build-Depends"].split(",")
              report["postgresBuildDependencies"] = [s.strip() for s in deps if s.strip().startswith(("postgresql", "libpq"))]
              report["headers18_7Verified"] = any(re.fullmatch(r"postgresql-server-dev-18\s+\(=\s*18\.7-[^)]+\)", s.strip()) for s in deps)
              checksums = {}
              for line in info["Checksums-Sha256"].splitlines():
                  parts = line.split()
                  if len(parts) == 3:
                      checksums[parts[2]] = {"sha256": parts[0], "bytes": int(parts[1])}
              command(["docker", "pull", "--platform", "linux/amd64", BASE], timeout=240)
              with tempfile.TemporaryDirectory(prefix="tropnik-pgdg-package-") as temp:
                  temp_path = Path(temp)
                  package_names = ["postgresql-18-postgis-3", "postgresql-18-postgis-3-scripts"]
                  # apt verifies the repository InRelease signatures and package checksums.
                  # This disposable container has no credentials, database or production volumes.
                  script = "set -eu\napt-get update -qq\ncd /evidence\napt-get download " + " ".join(p + "=" + VERSION for p in package_names) + "\n"
                  output = command(["docker", "run", "--rm", "--platform", "linux/amd64",
                                    "--entrypoint", "/bin/sh", "--security-opt", "no-new-privileges:true",
                                    "--mount", f"type=bind,src={temp},dst=/evidence", BASE, "-c", script], timeout=240)
                  (OUT / "apt-download.log").write_text(output, encoding="utf-8")
                  for pkg in package_names:
                      candidates = list(temp_path.glob(pkg + "_*.deb"))
                      assert len(candidates) == 1, candidates
                      deb = candidates[0]
                      expected = checksums[deb.name]
                      actual = hashlib.sha256(deb.read_bytes()).hexdigest()
                      assert actual == expected["sha256"] and deb.stat().st_size == expected["bytes"]
                      control = fields(command(["dpkg-deb", "--field", str(deb)]))
                      assert control["Package"] == pkg and control["Version"] == VERSION
                      record = {"name": pkg, "file": deb.name, "sha256": actual, "bytes": deb.stat().st_size,
                                "version": control["Version"], "architecture": control["Architecture"],
                                "depends": control.get("Depends"), "matchesOfficialBuildinfo": True,
                                "libraries": []}
                      report["packages"].append(record)
                      extracted = temp_path / pkg
                      command(["dpkg-deb", "--extract", str(deb), str(extracted)])
                      for library in sorted(extracted.glob("usr/lib/postgresql/18/lib/*.so")):
                          symbols = command(["readelf", "--dyn-syms", "--wide", str(library)])
                          wanted = [line.strip() for line in symbols.splitlines()
                                    if any(name in line for name in ["DatumGetHeapTupleHeader", "heap_datum_check", "heap_datum_update_type"])]
                          record["libraries"].append({"name": library.name, "sha256": hashlib.sha256(library.read_bytes()).hexdigest(),
                                                      "securitySymbols": wanted})
                          (OUT / (library.name + ".symbols.txt")).write_text(symbols, encoding="utf-8")
                  core = next(p for p in report["packages"] if p["name"] == "postgresql-18-postgis-3")
                  core_library = next(p for p in core["libraries"] if p["name"] == "postgis-3.so")
                  report["newCompositeChecksReferenced"] = all(any(name in symbol for symbol in core_library["securitySymbols"])
                                                             for name in ["DatumGetHeapTupleHeader", "heap_datum_check"])
                  report["officialRebuildQualified"] = report["headers18_7Verified"] and report["newCompositeChecksReferenced"]
                  report["measurementComplete"] = True
          finally:
              report["finishedAt"] = datetime.now(timezone.utc).isoformat()
              save()
          
          print(json.dumps(report, indent=2))
          
          PY
      - name: Preserve public package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tropnik-postgis-18.7-package-probe
          path: verification/
          if-no-files-found: error
          retention-days: 3
