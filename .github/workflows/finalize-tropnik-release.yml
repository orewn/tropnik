name: Finalize Tropnik release branch

on:
  push:
    branches: [fix/map-label-viewport-20261107]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-tropnik-release-20261107
  cancel-in-progress: false

jobs:
  regenerate-test-and-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/map-label-viewport-20261107
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare pinned Python geometry environment
        run: |
          python3 -m venv "$RUNNER_TEMP/tropnik-mask-python"
          "$RUNNER_TEMP/tropnik-mask-python/bin/python" -m pip install --disable-pip-version-check -r tools/map-package/requirements-territories.txt
          printf '%s\n' "$RUNNER_TEMP/tropnik-mask-python/bin" >> "$GITHUB_PATH"

      - name: Apply reviewed source fixes
        run: python tools/finalize-tropnik-release.py

      - name: Regenerate and validate renderer-safe Russia masks
        run: |
          python tools/map-package/build-russia-mask.py
          python tools/map-package/test_russia_mask_partition.py

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install frozen web dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = '11.25.0'
          pnpm --dir web install --frozen-lockfile

      - name: Regenerate the checked-in map style
        working-directory: web
        run: node scripts/create-map-style.mjs

      - name: Run map and web regression checks
        run: |
          python tools/map-package/test_russia_mask_partition.py
          pnpm --dir web test
          node web/node_modules/typescript/bin/tsc -p web/pages-preview/tsconfig.json --noEmit

      - name: Require the intended generated changes
        run: |
          test -n "$(git status --porcelain)"
          grep -q 'tropnik-shell-v12' web/public/sw.js
          grep -q 'russia-priority-city-label' web/public/maps/tropa-style.json
          grep -q 'MASK_TILE_DEGREES = 15.0' tools/map-package/build-russia-mask.py
          git diff --check
          git status --short

      - name: Commit verified final release sources and generated assets
        run: |
          git config user.name 'tropnik-release-bot'
          git config user.email '38781694+orewn@users.noreply.github.com'
          git add -A
          git commit -m 'Fix map mask wedges, label overflow and Android UI-thread access'
          git push origin HEAD:fix/map-label-viewport-20261107
