            "persist-credentials": false
          }
        },
        {
          "name": "Use the pinned Node runtime for stored report validation",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24",
            "package-manager-cache": false
          }
        },
        {
          "name": "Require the latest final successful Pages run and exact universal producer",
          "id": "identity",
          "run": "node --input-type=module <<'NODE'\nimport assert from 'node:assert/strict';\nimport {readFileSync,writeFileSync,mkdirSync,appendFileSync} from 'node:fs';\nimport {join} from 'node:path';\nimport {execFileSync} from 'node:child_process';\nconst e=process.env,c=JSON.parse(e.RELEASE_PACKAGE_CONFIG),repo='orewn/tropnik';\nassert.equal(e.GITHUB_REPOSITORY,repo);\nassert.equal(e.GITHUB_REF,'refs/heads/verify/final-web-zip-20261113');\nassert.match(c.sourceCommit,/^[a-f0-9]{40}$/);\nassert.match(c.buildId,/^[a-f0-9]{16}$/);\nassert.match(c.artifact.sha256,/^[a-f0-9]{64}$/);\nassert.equal(c.artifact.name,'github-pages-'+c.runId+'-'+c.runAttempt);\nfor(const n of [c.runId,c.runAttempt,c.artifact.id,c.artifact.bytes,c.producer.runId,c.producer.apkBytes])assert.ok(Number.isSafeInteger(n)&&n>0);\nassert.ok(c.artifact.bytes<=256*1024*1024);\nassert.equal(c.producer.version,'0.4.33-preview');\nassert.equal(c.producer.versionCode,16);\nfor(const hash of [c.producer.manifestSourceSHA256,c.producer.apkSHA256,c.sourceWorker.sha256])assert.match(hash,/^[a-f0-9]{64}$/);\nassert.match(c.producer.sourceCommit,/^[a-f0-9]{40}$/);\nassert.match(c.sourceWorker.version,/^tropnik-shell-0\\.4\\.33-[a-f0-9]{16}$/);\nassert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),c.sourceCommit);\nconst get=async path=>{\n const response=await fetch('https://api.github.com/repos/'+repo+path,{headers:{Authorization:'Bearer '+e.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},signal:AbortSignal.timeout(30000)});\n assert.equal(response.status,200,'GitHub read failed: '+path);\n return response.json();\n};\nconst [run,artifact,jobs,head,recent,producer]=await Promise.all([\n get('/actions/runs/'+c.runId),get('/actions/artifacts/'+c.artifact.id),\n get('/actions/runs/'+c.runId+'/attempts/'+c.runAttempt+'/jobs?per_page=100'),\n get('/git/ref/heads/main'),get('/actions/workflows/pages.yml/runs?branch=main&event=push&per_page=1'),\n get('/actions/runs/'+c.producer.runId)\n]);\nassert.equal(head.object.sha,c.sourceCommit,'Main changed after the final accepted source was selected');\nassert.equal(recent.workflow_runs.length,1);\nassert.equal(recent.workflow_runs[0].id,run.id,'A newer main Pages run exists');\nassert.equal(run.id,c.runId);assert.equal(run.run_attempt,c.runAttempt);\nassert.equal(run.path,'.github/workflows/pages.yml');assert.equal(run.event,'push');\nassert.equal(run.repository.full_name,repo);assert.equal(run.head_branch,'main');assert.equal(run.head_sha,c.sourceCommit);\nassert.equal(run.status,'completed');assert.equal(run.conclusion,'success');\nassert.equal(jobs.total_count,jobs.jobs.length);\nassert.ok(jobs.jobs.length>=2&&jobs.jobs.every(job=>job.status==='completed'&&job.conclusion==='success'&&job.head_sha===c.sourceCommit));\nconst publicJobs=jobs.jobs.filter(job=>job.steps.some(step=>step.name==='Verify the public build, browser report and APK without authentication'&&step.status==='completed'&&step.conclusion==='success'));\nassert.equal(publicJobs.length,1,'Final public verification must have succeeded');\nassert.equal(artifact.id,c.artifact.id);assert.equal(artifact.name,c.artifact.name);\nassert.equal(artifact.size_in_bytes,c.artifact.bytes);assert.equal(artifact.digest,'sha256:'+c.artifact.sha256);assert.equal(artifact.expired,false);\nassert.equal(artifact.workflow_run.id,run.id);assert.equal(artifact.workflow_run.head_sha,c.sourceCommit);assert.equal(artifact.workflow_run.head_branch,'main');\nassert.equal(producer.id,c.producer.runId);assert.equal(producer.repository.full_name,repo);\nassert.equal(producer.path,'.github/workflows/android.yml');assert.equal(producer.head_sha,c.producer.sourceCommit);\nassert.equal(producer.status,'completed');assert.equal(producer.conclusion,'success');\nconst root=join(e.RUNNER_TEMP,'tropnik-web-package');mkdirSync(root,{recursive:false});\nconst transport={schemaVersion:1,acceptedSource:c.sourceCommit,acceptedBuildId:c.buildId,\n originalRun:{id:run.id,attempt:run.run_attempt,sourceCommit:run.head_sha,url:run.html_url,status:run.status,conclusion:run.conclusion},\n originalArtifact:{id:artifact.id,name:artifact.name,bytes:artifact.size_in_bytes,sha256:c.artifact.sha256,expiresAt:artifact.expires_at},\n publicVerification:{jobId:publicJobs[0].id,status:'success'},\n producer:{runId:producer.id,sourceCommit:producer.head_sha,url:producer.html_url,status:producer.status,conclusion:producer.conclusion},\n packaging:{sourceCommit:e.GITHUB_SHA,runId:Number(e.GITHUB_RUN_ID),attempt:Number(e.GITHUB_RUN_ATTEMPT)},\n originalGatesUnchanged:true,newMeasurements:false,newBrowserRun:false,localRebuild:false};\nwriteFileSync(join(root,'transport.json'),JSON.stringify(transport,null,2)+'\\n');\nwriteFileSync(join(root,'config.json'),JSON.stringify(c,null,2)+'\\n');\nconst zipName='tropnik-web-0.4.33-'+c.buildId+'.zip';\nappendFileSync(e.GITHUB_OUTPUT,'zip_name='+zipName+'\\nzip_path='+join(root,zipName)+'\\n');\nconsole.log(JSON.stringify({sourceCommit:c.sourceCommit,buildId:c.buildId,originalRun:run.id,artifact:artifact.id,metadataVerified:true,zipName}));\nNODE\n"
        },
        {
          "name": "Download the accepted Pages ZIP once by immutable artifact ID",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "artifact-ids": "14062357483",
            "run-id": "43471278331",
            "repository": "orewn/tropnik",
            "github-token": "${{ github.token }}",
            "path": "${{ runner.temp }}/tropnik-web-input",
            "skip-decompress": true,
            "digest-mismatch": "error"
          }
        },
        {
          "name": "Verify archive transport and preserve every payload file",
          "run": "python3 - <<'PY'\nimport hashlib,json,os,pathlib,stat,tarfile,zipfile\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'tropnik-web-package'\nc=json.loads((root/'config.json').read_text())\ndownloads=pathlib.Path(os.environ['RUNNER_TEMP'])/'tropnik-web-input'\nentries=list(downloads.rglob('*'))\nassert len(entries)<=16 and all(not p.is_symlink() for p in entries)\narchives=[p for p in entries if p.is_file()]\nassert len(archives)==1\narchive=archives[0]\ndef digest(path):\n    h=hashlib.sha256()\n    with path.open('rb') as stream:\n        for block in iter(lambda:stream.read(1048576),b''): h.update(block)\n    return h.hexdigest()\nassert stat.S_ISREG(archive.stat().st_mode)\nassert archive.stat().st_size==c['artifact']['bytes']\nassert digest(archive)==c['artifact']['sha256']\ntar_path=root/'accepted-artifact.tar'\nwith zipfile.ZipFile(archive) as outer:\n    members=outer.infolist()\n    assert len(members)==1 and members[0].filename=='artifact.tar'\n    item=members[0]\n    assert not item.is_dir() and not item.flag_bits&1\n    assert (item.external_attr>>16)&0o170000 in (0,stat.S_IFREG)\n    assert 0<item.file_size<=1024*1024*1024\n    with outer.open(item) as source,tar_path.open('xb') as target:\n        total=0\n        for block in iter(lambda:source.read(1048576),b''):\n            total+=len(block);assert total<=item.file_size;target.write(block)\n        assert total==item.file_size\nstage=root/'stage';payload=stage/'tropnik';payload.mkdir(parents=True,exist_ok=False)\ndef safe_name(raw,is_dir):\n    assert isinstance(raw,str) and raw and len(raw.encode('utf-8'))<=4096\n    assert '\\\\' not in raw and ':' not in raw and not any(ord(ch)<32 or ord(ch)==127 for ch in raw)\n    if raw.startswith('./'): raw=raw[2:]\n    if is_dir and raw.endswith('/'): raw=raw[:-1]\n    if raw in ('','.'):\n        assert is_dir\n        return None\n    parts=raw.split('/')\n    assert all(part not in ('','.','..') for part in parts)\n    assert not pathlib.PurePosixPath(raw).is_absolute()\n    return raw\nseen=set();regular=[];declared_dirs=[];total_bytes=0\nwith tarfile.open(tar_path,mode='r|') as inner:\n    for index,item in enumerate(inner):\n        assert index<10000\n        assert item.type in (tarfile.REGTYPE,tarfile.AREGTYPE,tarfile.DIRTYPE)\n        assert not item.sparse and not any(key.startswith('GNU.sparse') for key in item.pax_headers)\n        name=safe_name(item.name,item.isdir())\n        key='.' if name is None else name\n        assert key not in seen,'Duplicate normalized TAR member'\n        seen.add(key)\n        if name is None: continue\n        target=payload.joinpath(*name.split('/'))\n        assert target.resolve().is_relative_to(payload.resolve())\n        if item.isdir():\n            assert item.size==0\n            target.mkdir(parents=True,exist_ok=True)\n            declared_dirs.append(name+'/')\n            continue\n        assert 0<=item.size<=128*1024*1024\n        total_bytes+=item.size;assert total_bytes<=512*1024*1024\n        target.parent.mkdir(parents=True,exist_ok=True)\n        source=inner.extractfile(item);assert source is not None\n        h=hashlib.sha256();count=0\n        with target.open('xb') as output:\n            for block in iter(lambda:source.read(1048576),b''):\n                count+=len(block);assert count<=item.size\n                h.update(block);output.write(block)\n        assert count==item.size\n        regular.append({'path':name,'bytes':count,'sha256':h.hexdigest()})\nassert regular and not any(record['path'].lower().endswith('.apk') for record in regular)\nrequired=['browser-verification.json','browser-service-worker-update-verification.json','browser-map-loading-verification.json','browser-map-underlay-verification.json','browser-map-tile-opacity-verification.json']\nadditional=['build-info.json','verification.json','http-verification.json','browser-ui-smoothness-diagnostic.json','page-manifest.json','downloads/android-manifest.json','sw.js','index.html','.nojekyll','.vite/manifest.json']\nby_name={item['path']:item for item in regular}\nassert all(name in by_name for name in required+additional)\ninventory={'schemaVersion':1,'sourceArchive':{'bytes':archive.stat().st_size,'sha256':digest(archive)},'tar':{'bytes':tar_path.stat().st_size,'sha256':digest(tar_path),'members':len(seen)},\n 'files':sorted(regular,key=lambda item:item['path']),'declaredDirectories':sorted(declared_dirs),'fileCount':len(regular),'totalFileBytes':total_bytes,'requiredBrowserReports':required,'additionalRequiredFiles':additional,'allRegularFilesPreserved':True}\n(root/'input-inventory.json').write_text(json.dumps(inventory,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')\nprint(json.dumps({'originalZIPVerified':True,'payloadFiles':len(regular),'payloadBytes':total_bytes,'fiveBrowserReportsPresent':True}))\nPY\n"
        },
        {
          "name": "Revalidate stored source-bound proofs without running any browser",
          "run": "node --input-type=module <<'NODE'\nimport assert from 'node:assert/strict';\nimport {createHash} from 'node:crypto';\nimport {readFileSync,writeFileSync} from 'node:fs';\nimport {join,resolve,sep} from 'node:path';\nimport {assertBrowserReport} from './tools/pages-preview/browser-report.mjs';\nimport {assertSmoothnessAudit} from './tools/pages-preview/browser-smoothness.mjs';\nimport {assertMatchingBrowserEnvironments} from './tools/pages-preview/browser-environment.mjs';\nimport {assertServiceWorkerUpdateReceipt} from './tools/pages-preview/browser-service-worker-update.mjs';\nimport {assertMapLoadingReceipt} from './tools/pages-preview/browser-map-loading.mjs';\nimport {assertTileOpacityReceipt} from './tools/pages-preview/browser-map-tile-opacity-receipt.mjs';\nimport {validateApkManifest,validateApkDelivery,publicApkUrl} from './tools/pages-preview/apk-artifact.mjs';\nconst UNDERLAY_METADATA_SHA256='9617aa2aa197f5c6495cf46a333840218d46eb5adbb35cf08677d7c8249e66a8';\nconst root=join(process.env.RUNNER_TEMP,'tropnik-web-package'),c=JSON.parse(readFileSync(join(root,'config.json'),'utf8'));\nconst payload=join(root,'stage','tropnik'),hash=bytes=>createHash('sha256').update(bytes).digest('hex');\nconst readPayloadJSON=path=>JSON.parse(readFileSync(join(payload,path),'utf8'));\nconst build=readPayloadJSON('build-info.json');\nassert.equal(build.sourceCommit,c.sourceCommit);assert.equal(build.buildId,c.buildId);\nassert.equal(build.base,'/tropnik/');assert.equal(build.origin,'https://orewn.github.io');\nassert.equal(build.hasApk,true);assert.equal(build.apiConnected,false);\nassert.equal(build.serverCodeIncluded,false);assert.equal(build.fakeServerResponses,false);\nassert.equal(hash(JSON.stringify({base:build.base,origin:build.origin,inputs:build.inputs})).slice(0,16),build.buildId);\nassert.ok(Array.isArray(build.inputs)&&build.inputs.length>0);\nconst byInput=new Map(build.inputs.map(item=>[item.path,item]));assert.equal(byInput.size,build.inputs.length);\nconst sourceManifestPath='web/public/downloads/android-manifest.json';\nconst sourceManifestBytes=readFileSync(sourceManifestPath);\nassert.equal(hash(sourceManifestBytes),c.producer.manifestSourceSHA256);\nconst android=validateApkManifest(JSON.parse(sourceManifestBytes));\nassert.deepEqual(readPayloadJSON('downloads/android-manifest.json'),android,'Deployed universal manifest differs from exact producer manifest');\nassert.equal(android.version,c.producer.version);assert.equal(android.versionCode,c.producer.versionCode);\nassert.equal(android.architecture,'universal');assert.equal(android.sourceCommit,c.producer.sourceCommit);\nassert.equal(android.workflowRunId,c.producer.runId);assert.equal(android.sha256,c.producer.apkSHA256);assert.equal(android.bytes,c.producer.apkBytes);\nassert.equal(android.releaseRequestId,c.producer.releaseRequestId);\nassert.equal(android.releasePayloadDeviceVerified,true);assert.equal(android.universalReleasePayloadDeviceVerified,true);\nassert.equal(android.installedArtifactBytesVerified,true);assert.equal(android.testedUniversalSha256,android.sha256);\nassert.deepEqual([...android.abis].sort(),['arm64-v8a','armeabi-v7a','x86_64'].sort());\nvalidateApkDelivery(build.apk,android);\nassert.equal(build.apk.downloadHref,publicApkUrl(android));\nconst apkInputPath='web/public'+build.apk.sourcePath;\nfor(const input of build.inputs){\n assert.ok(input.path&&typeof input.path==='string'&&!input.path.includes('\\\\')&&!input.path.split('/').some(part=>part==='..'||!part));\n assert.ok(resolve(input.path).startsWith(process.cwd()+sep));assert.ok(Number.isSafeInteger(input.bytes)&&input.bytes>=0);assert.match(input.sha256,/^[a-f0-9]{64}$/);\n if(input.path===apkInputPath){assert.equal(input.bytes,android.bytes);assert.equal(input.sha256,android.sha256);continue;}\n const bytes=readFileSync(input.path);assert.equal(bytes.length,input.bytes);assert.equal(hash(bytes),input.sha256);\n}\nassert.ok(byInput.has(apkInputPath));\nconst sourceWorker=readFileSync('web/public/sw.js');\nassert.equal(hash(sourceWorker),c.sourceWorker.sha256);\nconst sourceVersions=[...sourceWorker.toString('utf8').matchAll(/const VERSION='([^']+)'/g)];\nassert.equal(sourceVersions.length,1);assert.equal(sourceVersions[0][1],c.sourceWorker.version);\nassert.equal(byInput.get('web/public/sw.js')?.sha256,c.sourceWorker.sha256);\nassert.equal(byInput.get(sourceManifestPath)?.sha256,c.producer.manifestSourceSHA256);\nconst verification=readPayloadJSON('verification.json'),http=readPayloadJSON('http-verification.json'),pages=readPayloadJSON('page-manifest.json');\nassert.equal(verification.verified,true);assert.equal(verification.apkVerified,true);\nassert.equal(verification.base,build.base);assert.equal(verification.pages,build.pages);\nassert.equal(http.verified,true);assert.equal(http.base,build.base);assert.equal(http.backendConnected,false);\nassert.equal(pages.length,build.pages);\nconst browser=readPayloadJSON('browser-verification.json');\nassertBrowserReport(browser,c.sourceCommit,build.catalogue);\nconst early=readPayloadJSON('browser-ui-smoothness-diagnostic.json');\nassert.equal(early.sourceCommit,c.sourceCommit);assert.equal(early.status,'completed');\nassert.equal(early.diagnosticOnly,true);assert.equal(early.releaseEligible,false);\nassert.equal(early.performancePassed,true);assert.deepEqual(early.performanceIssues,[]);\nassertMatchingBrowserEnvironments(early.environment,browser.environment,c.sourceCommit);\nconst profiles=[{name:'android-portrait',mobile:true,engine:'tropnik-canvas'},{name:'desktop-webgl',mobile:false,engine:'tropnik-canvas'}];\nassert.deepEqual(early.profiles.map(item=>item.profile),profiles.map(item=>item.name));\nassert.equal(browser.siteSmoothness.length,2);\nfor(const [index,profile]of profiles.entries()){\n assertSmoothnessAudit(early.profiles[index],profile);\n const full=browser.siteSmoothness.filter(item=>item.profile===profile.name);assert.equal(full.length,1);\n assertSmoothnessAudit(full[0],profile);\n}\nconst workerUpdate=readPayloadJSON('browser-service-worker-update-verification.json');\nassertServiceWorkerUpdateReceipt(workerUpdate,{sourceCommit:c.sourceCommit,buildId:c.buildId,environment:browser.environment});\nconst loading=readPayloadJSON('browser-map-loading-verification.json');\nassertMapLoadingReceipt(loading,{sourceCommit:c.sourceCommit,buildId:c.buildId,environment:browser.environment});\nconst opacity=readPayloadJSON('browser-map-tile-opacity-verification.json');\nassertTileOpacityReceipt(opacity,{sourceCommit:c.sourceCommit,buildId:c.buildId,environment:browser.environment});\nconst bindSource=(path,sha256,bytes)=>{\n assert.equal(byInput.get(path)?.sha256,sha256);\n if(bytes!==undefined)assert.equal(byInput.get(path)?.bytes,bytes);\n const actual=readFileSync(path);assert.equal(hash(actual),sha256);if(bytes!==undefined)assert.equal(actual.length,bytes);\n};\nfor(const [path,digest]of Object.entries(workerUpdate.sources))bindSource(path,digest);\nfor(const [path,digest]of Object.entries(loading.sources))bindSource(path,digest);\nfor(const record of opacity.sources)bindSource(record.path,record.sha256,record.bytes);\nconst deployedWorker=readFileSync(join(payload,'sw.js'));\nassert.equal(hash(deployedWorker),workerUpdate.worker.sha256);\nconst deployedVersions=[...deployedWorker.toString('utf8').matchAll(/const VERSION='([^']+)'/g)];\nassert.equal(deployedVersions.length,1);\nassert.equal(deployedVersions[0][1],'tropnik-tropnik-shell-'+build.buildId);\nassert.equal(workerUpdate.worker.version,deployedVersions[0][1]);\nassert.equal(hash(deployedWorker.toString('utf8').replace(/const VERSION='([^']+)'/g,\"const VERSION='SW_AUDIT_VERSION'\")),workerUpdate.worker.normalizedSha256);\nfor(const item of build.customMap.deployedFiles){\n assert.match(item.path,/^(?:[\\w.-]+\\/)*[\\w.-]+$/);\n const bytes=readFileSync(join(payload,'custom-map',item.path));assert.equal(bytes.length,item.sizeBytes);assert.equal(hash(bytes),item.sha256);\n}\nconst pagesSource=readFileSync('.github/workflows/pages.yml','utf8');\nconst ua=pagesSource.indexOf('          const underlay ='),ub=pagesSource.indexOf('          const controls =',ua);\nassert.ok(ua>=0&&ub>ua);\nconst originalUnderlayMetadata=pagesSource.slice(ua,ub).split('\\n').map(line=>line.startsWith('          ')?line.slice(10):line).join('\\n');\nassert.equal(hash(originalUnderlayMetadata),UNDERLAY_METADATA_SHA256);\nconst underlay = readPayloadJSON('browser-map-underlay-verification.json');\nassert.equal(underlay.schemaVersion, 1);\nassert.equal(underlay.evidence, 'production-canvas-underlay-pixel-parity');\nassert.equal(underlay.baseline, 'same-production-draw-with-fixture-only-coverage-false');\nassert.equal(underlay.verified, true);\nassert.equal(underlay.sourceCommit, c.sourceCommit);\nassert.equal(underlay.rendererSHA256, createHash('sha256').update(readFileSync('web/lib/custom-map-engine.ts')).digest('hex'));\nassert.equal(underlay.sources['web/lib/custom-map-engine.ts'], underlay.rendererSHA256);\nfor (const [path, hash] of Object.entries(underlay.sources)) {\n  assert.match(path, /^web\\/(?:[\\w.-]+\\/)*[\\w.-]+$/);\n  assert.equal(hash, createHash('sha256').update(readFileSync(path)).digest('hex'));\n}\nassertMatchingBrowserEnvironments(underlay.environment, browser.environment, c.sourceCommit);\nconst covers = {opaque:[true], 'fractional-zoom':[true], 'pan-sequence':[true,true,true,false,true], missing:[false], transparent:[false], rotated:[false], pitched:[false], satellite:[false], overview:[false], zoom12:[true,true,true,false,true], zoom13:[false], zoom18:[false], 'tiny-tile':[false], 'unwrapped-world':[true], 'boundaries-hidden':[true]};\nassert.deepEqual(underlay.cases.map(item => item.dpr + '/' + item.name).sort(), [1,2].flatMap(dpr => Object.keys(covers).map(name => dpr + '/' + name)).sort());\nlet underlayFrames = 0;\nfor (const item of underlay.cases) {\n  assert.equal(item.verified, true);\n  assert.equal(item.contextAttributes.alpha, fal