  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "tropnik-final-web-zip-20261113",
    "cancel-in-progress": false
  },
  "jobs": {
    "package": {
      "if": "${{ github.repository == 'orewn/tropnik' && github.ref == 'refs/heads/verify/final-web-zip-20261113' }}",
      "runs-on": "ubuntu-24.04",
