          "name": "Create the user ZIP from immutable payload and three outer documentation files",
          "run": "python3 - <<'PY'\nimport hashlib,json,os,pathlib,stat,zipfile\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'tropnik-web-package'\nc=json.loads((root/'config.json').read_text())\ntransport=json.loads((root/'transport.json').read_text())\nproof=json.loads((root/'stored-proof-validation.json').read_text())\ninventory=json.loads((root/'input-inventory.json').read_text())\nstage=root/'stage'\ndef digest(path):\n    h=hashlib.sha256()\n    with path.open('rb') as stream:\n        for block in iter(lambda:stream.read(1048576),b''): h.update(block)\n    return h.hexdigest()\nassert proof['verified'] is True and proof['sourceCommit']==c['sourceCommit'] and proof['buildId']==c['buildId']\npayload_records=[]\nfor item in inventory['files']:\n    file=stage/'tropnik'/item['path']\n    assert file.is_file() and not file.is_symlink()\n    assert file.stat().st_size==item['bytes'] and digest(file)==item['sha256']\n    payload_records.append({'path':'tropnik/'+item['path'],'sourceMember':item['path'],'bytes':item['bytes'],'sha256':item['sha256']})\nreadme=('\\n'.join([\n 'Тропник — проверенная статическая веб-версия 0.4.33',\n '',\n 'Сборка: '+c['buildId'],\n 'Исходный commit: '+c['sourceCommit'],\n 'Принятый Pages run: '+str(c['runId']),\n 'Публичный сайт: https://orewn.github.io/tropnik/',\n '',\n 'Содержимое tropnik/ перенесено без изменения файлов из последнего принятого',\n 'GitHub Pages artifact. Локальная пересборка и новые браузерные измерения',\n 'при упаковке не выполнялись. Исходные проверки этой сборки сохранены внутри.',\n '',\n 'Как открыть:',\n '1. Распакуйте архив целиком.',\n '2. В каталоге с этим README.txt запустите сервер Python:',\n '   Windows: py -m http.server 8080 --bind 127.0.0.1',\n '   macOS/Linux: python3 -m http.server 8080 --bind 127.0.0.1',\n '3. Откройте http://127.0.0.1:8080/tropnik/',\n '   Файл index.html напрямую через file:// не предназначен для запуска.',\n '',\n 'Для размещения сохраните путь /tropnik/. Встроенные URL и публичный origin',\n 'остались ровно такими, как в принятой Pages-сборке.',\n 'Подробная онлайн-карта использует внешние источники; архив не обещает',\n 'полностью автономную детальную карту России.',\n '',\n 'Android APK не вложен в веб-архив. Исходная ссылка ведёт на проверенный',\n 'универсальный APK 0.4.33-preview:',\n proof['producerUniversalManifest']['url'],\n '',\n 'RELEASE.json содержит source/build/producer и SHA256 каждого исходного файла.',\n 'FILES.sha256 проверяет все обычные файлы ZIP, кроме самого FILES.sha256.',\n 'На системах с sha256sum: sha256sum --check FILES.sha256',\n '',\n 'Выдача через GitHub Actions может требовать входа в GitHub.',\n 'Срок хранения ссылки указан у artifact; распакованные файлы от него не зависят.',\n 'Этот архив не является новым GitHub Release и не меняет Android release assets.',\n ''\n])).encode('utf-8')\n(stage/'README.txt').write_bytes(readme)\nrelease={'schemaVersion':1,'kind':'tropnik-accepted-pages-web-archive','version':'0.4.33',\n 'sourceCommit':c['sourceCommit'],'buildId':c['buildId'],'base':'/tropnik/','origin':'https://orewn.github.io',\n 'sourceTransport':transport,'sourceTar':inventory['tar'],'payloadFiles':payload_records,'payloadFileCount':len(payload_records),\n 'payloadBytes':inventory['totalFileBytes'],'payloadBytesUnchanged':True,'buildAndStoredProofs':proof,\n 'packaging':{'format':'zip','fixedEntryTimestamp':'1980-01-01T00:00:00','payloadPrefix':'tropnik/','addedFiles':['README.txt','RELEASE.json','FILES.sha256'],\n  'checksumFile':'FILES.sha256','checksumExcludesOnly':['FILES.sha256'],'newMeasurements':False,'newBrowserRun':False,'newPNGDecoding':False,'localRebuild':False,\n  'delivery':'GitHub Actions artifact uploaded as-is, without another archive wrapper','libraryUploadPerformed':False,'newReleaseOrTag':False},\n 'readme':{'bytes':len(readme),'sha256':hashlib.sha256(readme).hexdigest()}}\n(stage/'RELEASE.json').write_text(json.dumps(release,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')\nbefore=[p for p in stage.rglob('*') if p.is_file()]\nassert all(not p.is_symlink() for p in stage.rglob('*'))\nchecksum_records=[{'path':p.relative_to(stage).as_posix(),'bytes':p.stat().st_size,'sha256':digest(p)} for p in before]\nchecksum_records.sort(key=lambda item:item['path'])\nassert not any(item['path']=='FILES.sha256' for item in checksum_records)\nchecksum_text=''.join(item['sha256']+'  '+item['path']+'\\n' for item in checksum_records)\n(stage/'FILES.sha256').write_text(checksum_text,encoding='utf-8')\nall_entries=[]\nempty=hashlib.sha256(b'').hexdigest()\nfor path in sorted(stage.rglob('*')):\n    name=path.relative_to(stage).as_posix()\n    if path.is_dir():\n        all_entries.append({'path':name+'/','kind':'directory','bytes':0,'sha256':empty})\n    else:\n        assert path.is_file()\n        all_entries.append({'path':name,'kind':'file','bytes':path.stat().st_size,'sha256':digest(path)})\nall_entries.sort(key=lambda item:item['path'])\nassert len({entry['path'] for entry in all_entries})==len(all_entries)\nassert {entry['path'] for entry in all_entries if '/' not in entry['path']}=={'README.txt','RELEASE.json','FILES.sha256'}\nactual_payload=[entry for entry in all_entries if entry['kind']=='file' and entry['path'].startswith('tropnik/')]\nassert len(actual_payload)==len(payload_records)\nfor a,b in zip(sorted(actual_payload,key=lambda x:x['path']),payload_records):\n    assert (a['path'],a['bytes'],a['sha256'])==(b['path'],b['bytes'],b['sha256'])\nzip_path=root/('tropnik-web-0.4.33-'+c['buildId']+'.zip')\nwith zipfile.ZipFile(zip_path,'x',compression=zipfile.ZIP_DEFLATED,compresslevel=9,allowZip64=True) as archive:\n    for entry in all_entries:\n        info=zipfile.ZipInfo(entry['path'],(1980,1,1,0,0,0));info.create_system=3\n        if entry['kind']=='directory':\n            info.compress_type=zipfile.ZIP_STORED\n            info.external_attr=(stat.S_IFDIR|0o755)<<16|0x10\n            archive.writestr(info,b'')\n        else:\n            info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=(stat.S_IFREG|0o644)<<16\n            archive.writestr(info,(stage/entry['path']).read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)\nexpected={'schemaVersion':1,'filename':zip_path.name,'bytes':zip_path.stat().st_size,'sha256':digest(zip_path),\n 'sourceCommit':c['sourceCommit'],'buildId':c['buildId'],'members':all_entries,\n 'originalPayloadFiles':len(payload_records),'addedRegularFiles':3,'allPayloadBytesRecheckedBeforeZIP':True,\n 'checksumManifestFiles':len(checksum_records),'checksumManifestExcludesOnly':['FILES.sha256']}\n(root/'expected-output-members.json').write_text(json.dumps(expected,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')\nprint(json.dumps({'packageBuilt':True,'filename':zip_path.name,'bytes':expected['bytes'],'sha256':expected['sha256'],'members':len(all_entries),'payloadFiles':len(payload_records),'newMeasurements':False}))\nPY\n"
        },
        {
          "name": "Upload the user ZIP itself without another archive layer",
          "id": "delivery",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "path": "${{ steps.identity.outputs.zip_path }}",
            "archive": false,
            "if-no-files-found": "error",
            "retention-days": 30,
            "overwrite": false
          }
        },
        {
          "name": "Bind actual output artifact ID and digest to the prepared ZIP",
          "env": {
            "OUTPUT_ARTIFACT_ID": "${{ steps.delivery.outputs.artifact-id }}",
            "OUTPUT_ARTIFACT_SHA256": "${{ steps.delivery.outputs.artifact-digest }}",
            "OUTPUT_ARTIFACT_URL": "${{ steps.delivery.outputs.artifact-url }}"
          },
          "run": "node --input-type=module <<'NODE'\nimport assert from 'node:assert/strict';\nimport {readFileSync,writeFileSync} from 'node:fs';\nimport {join} from 'node:path';\nconst e=process.env,root=join(e.RUNNER_TEMP,'tropnik-web-package');\nconst expected=JSON.parse(readFileSync(join(root,'expected-output-members.json'),'utf8'));\nassert.match(e.OUTPUT_ARTIFACT_ID,/^[1-9]\\d*$/);assert.match(e.OUTPUT_ARTIFACT_SHA256,/^[a-f0-9]{64}$/);\nassert.equal(e.OUTPUT_ARTIFACT_SHA256,expected.sha256,'Upload must preserve the ZIP bytes as-is');\nconst response=await fetch('https://api.github.com/repos/orewn/tropnik/actions/artifacts/'+e.OUTPUT_ARTIFACT_ID,{headers:{Authorization:'Bearer '+e.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},signal:AbortSignal.timeout(30000)});\nassert.equal(response.status,200);\nconst artifact=await response.json();\nassert.equal(artifact.id,Number(e.OUTPUT_ARTIFACT_ID));assert.equal(artifact.name,expected.filename);\nassert.equal(artifact.size_in_bytes,expected.bytes);assert.equal(artifact.digest,'sha256:'+expected.sha256);assert.equal(artifact.expired,false);\nassert.equal(artifact.workflow_run.id,Number(e.GITHUB_RUN_ID));assert.equal(artifact.workflow_run.head_sha,e.GITHUB_SHA);\nconst receipt={schemaVersion:1,id:artifact.id,name:artifact.name,bytes:artifact.size_in_bytes,sha256:expected.sha256,\n packagingSourceCommit:e.GITHUB_SHA,packagingRunId:Number(e.GITHUB_RUN_ID),expiresAt:artifact.expires_at,\n artifactURL:e.OUTPUT_ARTIFACT_URL,archiveFalse:true,apiDigestMatchesPreparedZIP:true};\nassert.equal(receipt.artifactURL,'https://github.com/orewn/tropnik/actions/runs/'+e.GITHUB_RUN_ID+'/artifacts/'+e.OUTPUT_ARTIFACT_ID);\nwriteFileSync(join(root,'uploaded-artifact.json'),JSON.stringify(receipt,null,2)+'\\n');\nconsole.log(JSON.stringify({uploadedArtifactMetadataVerified:true,id:receipt.id,name:receipt.name,bytes:receipt.bytes,sha256:receipt.sha256}));\nNODE\n"
        },
        {
          "name": "Read back the actual uploaded ZIP once by its new artifact ID",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "artifact-ids": "${{ steps.delivery.outputs.artifact-id }}",
            "run-id": "${{ github.run_id }}",
            "repository": "orewn/tropnik",
            "github-token": "${{ github.token }}",
            "path": "${{ runner.temp }}/tropnik-web-output-readback",
            "skip-decompress": true,
            "digest-mismatch": "error"
          }
        },
        {
          "name": "Verify every member of the actual downloaded user ZIP",
          "run": "python3 - <<'PY'\nimport hashlib,json,os,pathlib,stat,zipfile\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'tropnik-web-package'\nexpected=json.loads((root/'expected-output-members.json').read_text())\nmetadata=json.loads((root/'uploaded-artifact.json').read_text())\ndownloads=pathlib.Path(os.environ['RUNNER_TEMP'])/'tropnik-web-output-readback'\nentries=list(downloads.rglob('*'))\nassert len(entries)<=16 and all(not p.is_symlink() for p in entries)\nfiles=[p for p in entries if p.is_file()]\nassert len(files)==1\narchive=files[0]\ndef digest(path):\n    h=hashlib.sha256()\n    with path.open('rb') as stream:\n        for block in iter(lambda:stream.read(1048576),b''):h.update(block)\n    return h.hexdigest()\nassert archive.stat().st_size==expected['bytes']==metadata['bytes']\nassert digest(archive)==expected['sha256']==metadata['sha256']\nwanted={item['path']:item for item in expected['members']}\nseen=set();actual=[];checksum_text=None\nwith zipfile.ZipFile(archive) as source:\n    members=source.infolist()\n    assert len(members)==len(wanted)\n    for info in members:\n        assert info.filename not in seen and info.filename in wanted\n        seen.add(info.filename)\n        entry=wanted[info.filename]\n        assert not info.flag_bits&1\n        assert info.date_time==(1980,1,1,0,0,0)\n        assert info.is_dir()==(entry['kind']=='directory')\n        expected_type=stat.S_IFDIR if info.is_dir() else stat.S_IFREG\n        assert (info.external_attr>>16)&0o170000==expected_type\n        assert info.file_size==entry['bytes']\n        h=hashlib.sha256();count=0;checksum_bytes=bytearray()\n        with source.open(info) as stream:\n            for block in iter(lambda:stream.read(1048576),b''):\n                count+=len(block);assert count<=entry['bytes'];h.update(block)\n                if info.filename=='FILES.sha256':checksum_bytes.extend(block)\n        assert count==entry['bytes'] and h.hexdigest()==entry['sha256']\n        if info.filename=='FILES.sha256':checksum_text=bytes(checksum_bytes).decode('utf-8')\n        actual.append({'path':info.filename,'kind':entry['kind'],'bytes':count,'sha256':h.hexdigest()})\nassert seen==set(wanted)\nassert checksum_text is not None\nexpected_checksums=''.join(item['sha256']+'  '+item['path']+'\\n' for item in expected['members'] if item['kind']=='file' and item['path']!='FILES.sha256')\nassert checksum_text==expected_checksums\nassert {'README.txt','RELEASE.json','FILES.sha256'}<=seen\nassert 'tropnik/index.html' in seen and 'tropnik/.nojekyll' in seen and 'tropnik/.vite/manifest.json' in seen\nassert not any(name.endswith('.zip') and not name.startswith('tropnik/') for name in seen),'Unexpected nested ZIP wrapper'\nreceipt={'schemaVersion':1,'verified':True,'evidence':'uploaded-user-web-zip-actual-readback',\n 'sourceCommit':expected['sourceCommit'],'buildId':expected['buildId'],'artifact':metadata,\n 'actualArchive':{'bytes':archive.stat().st_size,'sha256':digest(archive)},\n 'memberCount':len(actual),'verifiedMembers':actual,'allPayloadMembersByteIdentical':True,\n 'topLevelExtras':['README.txt','RELEASE.json','FILES.sha256'],'noDoubleWrapper':True,'filesSHA256ManifestVerified':True,\n 'downloadedByExactArtifactId':True,'apiDigestVerified':True,'newMeasurements':False,'newBrowserRun':False,'newPNGDecoding':False,'libraryUploadPerformed':False}\n(root/'final-web-zip-readback.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')\nsummary={key:receipt[key] for key in ['schemaVersion','verified','evidence','sourceCommit','buildId','artifact','actualArchive','memberCount','allPayloadMembersByteIdentical','noDoubleWrapper','filesSHA256ManifestVerified','newMeasurements','libraryUploadPerformed']}\nsummary['fullReadbackReceipt']={'bytes':(root/'final-web-zip-readback.json').stat().st_size,'sha256':digest(root/'final-web-zip-readback.json')}\nprint('TROPNIK_FINAL_WEB_ZIP_READBACK='+json.dumps(summary,separators=(',',':')))\nwith open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as output:\n    output.write('## Verified web ZIP\\n\\n')\n    output.write('['+metadata['name']+']('+metadata['artifactURL']+')\\n\\n')\n    output.write('Source: '+expected['sourceCommit']+'\\n\\nBuild: '+expected['buildId']+'\\n\\n')\n    output.write('ZIP SHA256: '+metadata['sha256']+'\\n\\nBytes: '+str(metadata['bytes'])+'\\n\\n')\n    output.write('All '+str(len(actual))+' ZIP members verified after download by artifact ID. No nested ZIP wrapper.\\n\\n')\n    output.write('GitHub Actions access may require GitHub login. Expires: '+str(metadata['expiresAt'])+'. No Library upload was performed.\\n')\nPY\n"
        },
        {
          "name": "Preserve packaging provenance and actual readback evidence",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "tropnik-web-zip-evidence-${{ github.run_id }}",
            "path": "${{ runner.temp }}/tropnik-web-package/transport.json\n${{ runner.temp }}/tropnik-web-package/input-inventory.json\n${{ runner.temp }}/tropnik-web-package/stored-proof-validation.json\n${{ runner.temp }}/tropnik-web-package/expected-output-members.json\n${{ runner.temp }}/tropnik-web-package/uploaded-artifact.json\n${{ runner.temp }}/tropnik-web-package/final-web-zip-readback.json",
            "if-no-files-found": "ignore",
            "retention-days": 30
          }
        }
      ]
    }
  }
