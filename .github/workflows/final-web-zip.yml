        "RELEASE_PACKAGE_CONFIG": "{\"sourceCommit\":\"0770a7448fed05853bc724b4edb4feb235e5cda3\",\"buildId\":\"56bf66e1870513ce\",\"runId\":43471278331,\"runAttempt\":1,\"artifact\":{\"id\":14062357483,\"name\":\"github-pages-43471278331-1\",\"bytes\":67258462,\"sha256\":\"1dfe69f062dc5b3a236af0ead7a58b05cd34cf7a8e9c2ad9712e7616de91b139\"},\"producer\":{\"sourceCommit\":\"79b5c5edd0c88f7c54e182181c3e8db6791ad706\",\"runId\":43466306940,\"manifestSourceSHA256\":\"aa01366bcd1917b5353c81a5bbad2a585d745dc757aeecdf57067feb570634c4\",\"version\":\"0.4.33-preview\",\"versionCode\":16,\"releaseRequestId\":\"android-0-4-33-preview-source-archive-20261113\",\"apkBytes\":69231946,\"apkSHA256\":\"1e121dd05d8aba6eeb92640101ea30fdd2764b514c96d6d4924f5b0c34220408\"},\"sourceWorker\":{\"version\":\"tropnik-shell-0.4.33-d7251b01afd47ebd\",\"sha256\":\"8ab590677f074665ad7f04b3327bdf5f83ab7463018d910adbc9cf32f12f3c28\"}}"
      },
      "steps": [
        {
