name: Apply map label hover stability

on:
  push:
    branches: [fix/map-label-safe-area-20261107]
    paths:
      - '.github/workflows/apply-map-label-hover-stability.yml'
      - 'tools/apply-map-label-hover-stability.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/map-label-safe-area-20261107
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed hover correction
        run: |
          python -m py_compile tools/apply-map-label-hover-stability.py
          python tools/apply-map-label-hover-stability.py
          git diff --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run focused regressions
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          pnpm --dir web install --frozen-lockfile
          node --experimental-strip-types --test --test-concurrency=1 web/tests/map-direction-layout.test.mjs web/tests/map-polish.test.mjs
          node web/node_modules/typescript/bin/tsc -p web/pages-preview/tsconfig.json --noEmit
      - name: Commit source and regression
        run: |
          grep -q 'focus-visible{background:transparent;transform:none}' web/app/map-polish.css
          git config user.name 'tropnik-release-bot'
          git config user.email '38781694+orewn@users.noreply.github.com'
          git add web/app/map-polish.css web/tests/map-polish.test.mjs
          git commit -m 'Keep route tooltip geometry stable on hover'
          git push origin HEAD:fix/map-label-safe-area-20261107
