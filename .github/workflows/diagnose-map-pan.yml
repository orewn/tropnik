name: Diagnose desktop map pan

on:
  push:
    branches: [verify/map-pan-20261113]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install frozen dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = '11.25.0'
          pnpm --dir web install --frozen-lockfile
      - name: Restore and verify the existing Android preview
        run: node tools/pages-preview/fetch-apk.mjs
      - name: Build and verify the actual static client
        run: node tools/pages-preview/build.mjs --base /tropnik/ --origin https://orewn.github.io
      - name: Record bounded desktop map-pan trace
        timeout-minutes: 6
        env:
          TROPNIK_BROWSER_DIAGNOSTIC: ui-smoothness
          TROPNIK_BROWSER_TRACE: '1'
        run: node tools/pages-preview/browser-smoke.mjs
      - name: Preserve the exact browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tropnik-map-pan-trace-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            web/pages-preview/dist/build-info.json
            web/pages-preview/dist/browser-ui-smoothness-diagnostic.json
            web/pages-preview/dist/browser-network.json
            web/pages-preview/dist/browser-failure.*
            web/pages-preview/design-qa/desktop-webgl-ui-smoothness-map-pan.trace*.json
          if-no-files-found: warn
          retention-days: 7
