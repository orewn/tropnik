name: Professional service design 0.4.13

on:
  push:
    branches: [design/pro-service-0.4.13]

permissions:
  contents: read

concurrency:
  group: tropnik-pro-service-design-0.4.13
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact design revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify patch hygiene
        run: |
          git diff origin/main...HEAD --check
          test "$(node -p "require('./web/package.json').version")" = '0.4.13'
          test -f docs/SERVICE-DESIGN-SYSTEM.md
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          pnpm --dir web install --frozen-lockfile
      - name: Run complete regression suite
        working-directory: web
        run: pnpm test
      - name: Check static client types
        run: node web/node_modules/typescript/bin/tsc -p web/pages-preview/tsconfig.json --noEmit
      - name: Strictly lint changed product modules
        working-directory: web
        run: pnpm exec eslint --max-warnings=0 app/page.tsx components/HomeEditorial.tsx components/Footer.tsx tests/service-design.test.mjs tests/startup-polish.test.mjs
      - name: Build production application
        working-directory: web
        run: pnpm build
      - name: Restore verified APK
        run: node tools/pages-preview/fetch-apk.mjs
      - name: Build and verify Pages artifact
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/pages-preview/build.mjs --base /tropnik/ --origin https://orewn.github.io
      - name: Run Chromium cross-platform interaction gate
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/pages-preview/browser-smoke.mjs
